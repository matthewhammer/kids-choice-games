# (ticket 165) Dress Up's test drivers, tools/, on GitHub's computers: on every
# branch but main (a push to main deploys the game, so a change is tried on a
# branch first), and by hand. Since 2026-10-16 no test browser runs on
# Matthew's laptop (it froze four times that evening, each time during one).
# A branch carrying tools/checks/.only runs only its own checks and pictures
# (a diagnostic, answered in minutes), not the gate, the audit or the leaks.
# Frame rates here are a GitHub computer's, not a kid's: compare them with
# each other (a branch against main, a case against its control), never with
# the 55 frames a second a release needs on the laptop or the kids' devices.
name: Dress Up tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dress-up-tests-${{ github.ref }}
  cancel-in-progress: true
env:
  # (ticket 236, Matthew: "Turn on the accessibility features during all tests") #inspect: every 🔬 overlay on from the start
  PAGE: http://127.0.0.1:8133/dress-up/index.html#inspect
  MAIN_PAGE: http://127.0.0.1:8133/main/dress-up/index.html#inspect
jobs:
  chrome:
    name: Chrome (script, safety net, pictures, gate, audit, leak)
    runs-on: ubuntu-24.04
    # (2026-10-20: every run on scripting-panel since 17:43 was cancelled at 60 minutes, at the frame-rate gate: the
    # checks, ~190 of them now, the pictures and the safety net no longer fit in an hour; the speed workflow allows 90)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The page's script parses
        run: python3 tools/check_script.py dress-up/index.html
      - name: Serve this branch's game and main's beside it; start Chrome, muted
        run: |
          git worktree add --detach main origin/main
          mkdir -p out
          (python3 -m http.server 8133 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (google-chrome --headless=new --mute-audio --no-first-run --no-default-browser-check \
            --remote-debugging-port=9333 --remote-allow-origins='*' \
            --user-data-dir="$RUNNER_TEMP/chrome" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &)
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:9333/json/version > /dev/null && curl -sf "$PAGE" > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9333/json/version | grep -i '"Browser"'
      - name: The safety net against main (every picture's markup, and the structure)
        shell: bash
        run: |
          node tools/sweep.mjs 9333 "$MAIN_PAGE" out/sweep-main.json
          node tools/sweep.mjs 9333 "$PAGE" out/sweep-branch.json
          python3 tools/sweep_diff.py out/sweep-main.json out/sweep-branch.json | tee out/safety-net.txt
          node tools/structure.mjs 9333 "$MAIN_PAGE" out/structure-main.json
          node tools/structure.mjs 9333 "$PAGE" out/structure-branch.json
          python3 tools/structure_diff.py out/structure-main.json out/structure-branch.json | tee -a out/safety-net.txt
      - name: The branch's own checks (tools/checks/*.mjs, each exiting 1 on a failure)
        id: checks
        if: hashFiles('tools/checks/*.mjs') != ''
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out/checks; s=0
          for f in tools/checks/*.mjs; do
            if [ -f tools/fresh.mjs ]; then node tools/fresh.mjs 9333 http://127.0.0.1:8133 || true; fi   # (ticket 369: each check from a fresh visitor's saved state)
            node "$f" 9333 "$PAGE" | tee "out/checks/$(basename "$f" .mjs).txt" || s=1
          done
          exit $s
      - name: Pictures the branch asks for (tools/shots.json)
        if: hashFiles('tools/shots.json') != ''
        shell: bash
        run: node tools/shots.mjs 9333 "$PAGE" tools/shots.json out/shots | tee out/shots.txt
      - name: The frame-rate gate (ticket 152; this computer's numbers)
        if: hashFiles('tools/checks/.only') == ''
        continue-on-error: true
        shell: bash
        run: W=1920 H=1080 OUT=out/fpsgate.json node tools/fpsgate.mjs 9333 "$PAGE" | tee out/fpsgate.txt
      - name: The frame-rate gate's slow scenes (SLOW=1)
        if: hashFiles('tools/checks/.only') == ''
        continue-on-error: true
        shell: bash
        run: SLOW=1 W=1920 H=1080 OUT=out/fpsgate-slow.json node tools/fpsgate.mjs 9333 "$PAGE" | tee out/fpsgate-slow.txt
      - name: Every place with the on-screen controller (ticket 160)
        if: hashFiles('tools/checks/.only') == ''
        continue-on-error: true
        shell: bash
        run: RUNS=1 OUT=out/audit160.json node tools/audit160.mjs 9333 "$PAGE" | tee out/audit160.txt
      - name: After the duck pond (ticket 167), in Chrome
        if: hashFiles('tools/checks/.only') == ''
        continue-on-error: true
        shell: bash
        run: node tools/leak167.mjs 9333 "$PAGE" - 2 | tee out/leak167-chrome.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Chrome"
            shopt -s nullglob
            for f in out/*.txt out/checks/*.txt; do
              echo "### ${f#out/}"; echo '```'; tail -n 70 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome
          path: out/
      - name: Fail the run if the branch's own checks failed (after everything else ran)
        if: steps.checks.outcome == 'failure'
        run: exit 1
  firefox:
    name: Firefox (the leak, ticket 167)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Serve the game
        run: |
          mkdir -p out
          (python3 -m http.server 8133 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for i in $(seq 30); do curl -sf "$PAGE" > /dev/null && break; sleep 1; done
          firefox --version
      - name: The branch's own Firefox checks (tools/checks/*.py, each given the page)
        if: hashFiles('tools/checks/*.py') != ''
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out/checks
          for f in tools/checks/*.py; do python3 "$f" "$PAGE" | tee "out/checks/$(basename "$f" .py).txt"; done
      - name: After rounds of changes; then the caches emptied, the music paused, a reload
        if: hashFiles('tools/checks/.only') == ''
        continue-on-error: true
        shell: bash
        run: CLEAR=1 python3 tools/leakff.py "$PAGE" - 2 | tee out/leakff-changes.txt
      - name: The control, only swimming for as long
        if: hashFiles('tools/checks/.only') == ''
        continue-on-error: true
        shell: bash
        run: CONTROL=1 python3 tools/leakff.py "$PAGE" - 2 | tee out/leakff-control.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Firefox"
            shopt -s nullglob
            for f in out/*.txt out/checks/*.txt; do
              echo "### ${f#out/}"; echo '```'; cat "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox
          path: out/
