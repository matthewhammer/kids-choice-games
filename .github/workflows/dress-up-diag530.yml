# (never merged) 0.0.529's speed run read 💭 our imagination at 9.1 fps (0.0.522's: 60), one run on an unknown runner. Before
# (dress-up-0.0.522) and after (this branch, main after 0.0.529) on the same computer: eight jobs, each serving both, the speed
# run's own walk (tools/audit160.mjs) over the survey's first five places and the three space places changed since, three runs
# each; before, after, after, before, each pass in a Chrome of its own; the runner's CPU recorded.
name: Dress Up diagnostic (imagination, 0.0.522 against 0.0.529)
on:
  push:
    branches: ['diag-530']
jobs:
  pair:
    name: Before and after (${{ matrix.job }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        job: [r1, r2, r3, r4, r5, r6, r7, r8]
    steps:
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: actions/checkout@v4
        with:
          ref: dress-up-0.0.522
          path: before
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner; serve both
        run: |
          mkdir -p out
          { echo "job: ${{ matrix.job }}"; lscpu | grep -E 'Model name|^CPU\(s\)'; } | tee out/runner.txt
          (cd before && python3 -m http.server 8133 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (cd after && python3 -m http.server 8134 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:8133/dress-up/index.html > /dev/null && curl -sf http://127.0.0.1:8134/dress-up/index.html > /dev/null && break; sleep 1; done
      - name: Before, after, after, before
        continue-on-error: true
        shell: bash
        run: |
          PLACES=emptyroom,bubblespace,bubbleroom,imagination,forest,starfield,alienplanet,blackhole
          chrome() { pkill -f "remote-debugging-port=9333" || true; sleep 2
            (google-chrome --headless=new --mute-audio --no-first-run --no-default-browser-check --remote-debugging-port=9333 --remote-allow-origins='*' \
              --user-data-dir="$RUNNER_TEMP/chrome-$1" about:blank > "$RUNNER_TEMP/chrome-$1.log" 2>&1 &)
            for i in $(seq 30); do curl -sf http://127.0.0.1:9333/json/version > /dev/null && break; sleep 1; done; }
          for step in before:8133:1 after:8134:1 after:8134:2 before:8133:2; do
            IFS=: read side port pass <<< "$step"
            chrome "$side-$pass"
            echo "== $side, pass $pass" | tee -a out/all.txt
            RUNS=3 OUT=out/$side-$pass.json timeout 900 node after/tools/audit160.mjs 9333 "http://127.0.0.1:$port/dress-up/index.html#inspect" "$PLACES" | tee -a out/all.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag530-${{ matrix.job }}
          path: out/
