# (ticket 184) After a release, not before it. Matthew, 2026-10-17: deploy
# publicly as soon as a version is made, so M and N can try it at once, and
# check its speed systematically, apart, so that nobody has to by hand.
# Each release tag (dress-up-X.Y.Z) runs the checks, the frame-rate gate
# (both tiers), the on-screen controller audit and the leak tests on
# GitHub's computers, against that tag; then records the result in
# dress-up/speed.json on main. The game reads it beside version.json and
# marks its own version 🚧🐢 when the gate failed (🚧 when a check did).
# A slow version stays live and is fixed in the next one. Frame rates here
# are a GitHub computer's (Chrome, no graphics card), not a kid's.
name: Dress Up speed (after a release)
on:
  push:
    tags: ['dress-up-*']
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to check (dress-up-X.Y.Z)"
        required: true
permissions:
  contents: write
  pages: write
concurrency:
  group: dress-up-speed
  cancel-in-progress: false
env:
  # (ticket 236, Matthew: "Turn on the accessibility features during all tests") #inspect: every 🔬 overlay on from the start
  PAGE: http://127.0.0.1:8133/dress-up/index.html#inspect
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  chrome:
    name: Chrome (checks, gate, audit, leak)
    runs-on: ubuntu-24.04
    # (ticket 369, 2026-10-19: the checks alone took 43 minutes in 0.0.319's run, and with the gate, the slow gate and the audit the job
    # ran past 60, so since 0.0.312 every run was cut off in the audit or the leak, its last steps never recorded)
    timeout-minutes: 90
    outputs:
      checks: ${{ steps.checks.outcome }}
      gate: ${{ steps.gate.outcome }}
      gate_slow: ${{ steps.gate_slow.outcome }}
      version: ${{ steps.version.outputs.number }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The version
        id: version
        shell: bash
        run: |
          echo "number=$(python3 -c "import json; print(json.load(open('dress-up/version.json'))['number'])")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Serve the game; start Chrome, muted
        run: |
          mkdir -p out
          (python3 -m http.server 8133 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (google-chrome --headless=new --mute-audio --no-first-run --no-default-browser-check \
            --remote-debugging-port=9333 --remote-allow-origins='*' \
            --user-data-dir="$RUNNER_TEMP/chrome" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &)
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:9333/json/version > /dev/null && curl -sf "$PAGE" > /dev/null && break
            sleep 1
          done
      - name: The checks (tools/checks/*.mjs)
        id: checks
        if: hashFiles('tools/checks/*.mjs') != ''
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out/checks; s=0
          for f in tools/checks/*.mjs; do
            if [ -f tools/fresh.mjs ]; then node tools/fresh.mjs 9333 http://127.0.0.1:8133 || true; fi   # (ticket 369: each check from a fresh visitor's saved state)
            node "$f" 9333 "$PAGE" | tee "out/checks/$(basename "$f" .mjs).txt" || s=1
          done
          exit $s
      - name: The frame-rate gate (ticket 152)
        id: gate
        continue-on-error: true
        shell: bash
        run: W=1920 H=1080 OUT=out/fpsgate.json node tools/fpsgate.mjs 9333 "$PAGE" | tee out/fpsgate.txt
      - name: The frame-rate gate's slow scenes (SLOW=1)
        id: gate_slow
        continue-on-error: true
        shell: bash
        run: SLOW=1 W=1920 H=1080 OUT=out/fpsgate-slow.json node tools/fpsgate.mjs 9333 "$PAGE" | tee out/fpsgate-slow.txt
      - name: Every place with the on-screen controller (ticket 160; recorded, not a verdict)
        continue-on-error: true
        shell: bash
        run: RUNS=1 OUT=out/audit160.json node tools/audit160.mjs 9333 "$PAGE" | tee out/audit160.txt
      - name: After the duck pond (ticket 167), in Chrome (recorded, not a verdict)
        continue-on-error: true
        shell: bash
        run: node tools/leak167.mjs 9333 "$PAGE" - 2 | tee out/leak167-chrome.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${TAG}: Chrome"
            shopt -s nullglob
            for f in out/*.txt out/checks/*.txt; do
              echo "### ${f#out/}"; echo '```'; tail -n 70 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-chrome
          path: out/
  firefox:
    name: Firefox (the leak, recorded)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Serve the game
        run: |
          mkdir -p out
          (python3 -m http.server 8133 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for i in $(seq 30); do curl -sf "$PAGE" > /dev/null && break; sleep 1; done
      - name: After rounds of changes; then the caches emptied, the music paused, a reload
        continue-on-error: true
        shell: bash
        run: CLEAR=1 python3 tools/leakff.py "$PAGE" - 2 | tee out/leakff-changes.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo "## ${TAG}: Firefox"; for f in out/*.txt; do echo "### ${f#out/}"; echo '```'; cat "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-firefox
          path: out/
  record:
    name: Record the result in dress-up/speed.json
    needs: [chrome, firefox]
    if: always() && needs.chrome.outputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write, commit and push (if main moved on, rebase and try again)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          V="${{ needs.chrome.outputs.version }}"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            line=$(python3 tools/speed_record.py "$V" "${{ needs.chrome.outputs.commit }}" "$RUN" \
              "${{ needs.chrome.outputs.checks }}" "${{ needs.chrome.outputs.gate }}" "${{ needs.chrome.outputs.gate_slow }}")
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
            git add dress-up/speed.json
            git commit -q -m "Dress Up speed, after the release: $line" -m "$RUN"
            git push -q origin HEAD:main && break
            sleep $((i * 10))
          done
          # (a push by this workflow's own token may not start a Pages build by itself)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
