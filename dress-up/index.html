<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dress Up</title>
<style>
  :root { --ink: #222; --muted: #666; --line: #d6d6d6; --paper: #fffdf7; --bg: #f3f0ff;
          --panel: #ffffff; --accent: #7c3aed; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #aaa; --line: #444; --paper: #fffdf7; --bg: #1d1a26;
            --panel: #29253a; --accent: #a78bfa; --accent-ink: #1d1a26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 1.6em; letter-spacing: 0.02em; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px;
         max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: sticky; top: 8px; align-self: start; }
  /* The picture, its caption and buttons always fit on the screen, so the
     picture stays in view while the controls scroll. */
  svg#pic { display: block; width: 100%; height: auto;
            max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px);
            background: var(--paper); border-radius: 18px; border: 2px solid var(--line);
            touch-action: none; user-select: none; }
  .caption { text-align: center; margin-top: 6px; font-size: 1.2em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 2px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 6px 12px; }
  button.big { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
               font-weight: 600; padding: 8px 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tabs button { font-weight: 600; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .panel { background: var(--panel); border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); }
  .ctl { margin: 10px 0; }
  .ctl > .lbl { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .ctl > .lbl .val { color: var(--muted); font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid var(--line); }
  .swatch[aria-pressed=true] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .swatch.skin { font-size: 0.6em; }
  input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); }
  input[type=color] { width: 40px; height: 34px; border: none; padding: 0; background: none; }
  .hint { color: var(--muted); font-size: 0.9em; }
  svg.pad { width: 140px; height: 140px; display: block; touch-action: none; cursor: crosshair;
            border-radius: 14px; border: 2px solid var(--line); }
  /* On a phone the controls are below the picture, so the picture is
     kept small and pinned at the top: a change shows while you make it. */
  @media (max-width: 760px) {
    body { padding-top: 8px; }
    h1 { display: none; }
    .stage { top: 0; z-index: 1; background: var(--bg); padding: 4px 0 8px; margin: 0 -16px; padding-inline: 16px; }
    svg#pic { max-height: 40vh; max-height: 40dvh; }
    .stage .hint { display: none; }
    .actions { margin-top: 4px; gap: 6px; flex-wrap: nowrap; }
    .actions button { padding: 4px 8px; font-size: 0.85em; white-space: nowrap; }
    .caption { margin-top: 2px; font-size: 1em; }
  }
  .formats { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center;
             margin-top: 8px; font-size: 13px; color: var(--muted); }
  .formats label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<h1>Dress Up</h1>
<div class="app">
  <div class="stage">
    <svg id="pic" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="caption" id="mood"></div>
    <div class="actions">
      <button class="big" id="surprise">🎲 Surprise me!</button>
      <button id="save" title="Saves the files checked below: a picture (.png), a drawing that prints at any size (.svg), and your friend's settings (.json) to load again later">💾 Save</button>
      <button id="load" title="Load a friend you saved (.json)">📂 Load</button>
      <input type="file" id="load-file" accept=".json,application/json" hidden>
      <button id="reset">↺ Start over</button>
    </div>
    <div class="formats" id="formats">
      <span>save as:</span>
      <label><input type="checkbox" value="png" checked> picture (.png)</label>
      <label><input type="checkbox" value="svg" checked> drawing (.svg)</label>
      <label><input type="checkbox" value="json" checked> settings (.json)</label>
    </div>
    <p class="hint" style="text-align:center">Drag the mouth or the eyebrows on the face, too!</p>
  </div>
  <div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
"use strict";

// ===================== STATE =====================

const DEFAULTS = {
  face:  { color: "#cfa000", size: 46, smile: 85, brow: 30, sick: 0, burst: 0, candy: 0,
           stars: false, hearts: false, xeyes: false, unibrow: true, eyes: 50, sides: 0,
           rays: 0, teeth: 0, open: 0,
           lightX: -0.6, lightY: -0.6, shine: "#ffffff", shineMix: 100, shineSize: 45,
           pupil: "#000000", iris: 0, irisColor: "#3b82f6", whites: 0, oval: 0, tilt: 0,
           faceW: 100, faceH: 100, alien: 0 },
  hair:  { style: "long", color: "#2b2b2b", length: 100 },
  body:  { neck: 22, neckW: 26, arms: 55, armLen: 95, armW: 16, legLen: 140, legW: 20 },
  shirt: { style: "tee", collar: "v", width: 60, length: 150, color: "#5b8bd0", pattern: "plain",
           patternSize: 14, patternColor: "auto" },
  hands: { style: "round", size: 14, color: "skin" },
  pants: { style: "long", color: "#34495e", pattern: "plain", patternSize: 14, patternColor: "auto" },
  shoes: { style: "sneaker", size: 100, color: "#c0392b" },
  costume: { kind: "none", fur: "#e8862a", marks: "#1f1a17", belly: "#f7ead8", eyes: "#e0a800",
             accent: "#e89aa0", furPattern: "stripes" },
};
const clone = o => JSON.parse(JSON.stringify(o));
let state = clone(DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem("dress-up-v1") || "null");
  if (saved) for (const k of Object.keys(DEFAULTS)) state[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
  // pants length moved to the legs (leg length)
  if (saved && saved.pants && saved.pants.length && !(saved.body && saved.body.legLen))
    state.body.legLen = saved.pants.length;
} catch (_) { /* no storage: start fresh */ }
function persist() { try { localStorage.setItem("dress-up-v1", JSON.stringify(state)); } catch (_) {} }

// ===================== HELPERS =====================

const idiv = (a, b) => Math.trunc(a / b);           // Hazel's Int division
const mod = (a, n) => a - idiv(a, n) * n;
const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));
const f1 = x => (Math.round(x * 10) / 10).toString();
const pts = ps => ps.map(([x, y]) => f1(x) + "," + f1(y)).join(" ");
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbToHex([r, g, b]) { return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join(""); }
const mix = (h, to, t) => { const a = hexToRgb(h), b = hexToRgb(to); return rgbToHex(a.map((v, i) => v + (b[i] - v) * t)); };
const darker = h => mix(h, "#000000", 0.45);
const lighter = h => mix(h, "#ffffff", 0.45);

function line(x1, y1, x2, y2, w, color, outline) {
  const l = (ww, c) => `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" ` +
                       `stroke="${c}" stroke-width="${f1(ww)}" stroke-linecap="round"/>`;
  return (outline ? l(w + 5, outline) : "") + l(w, color);
}
const poly = (ps, fill, stroke, sw = 2.5) =>
  `<polygon points="${pts(ps)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;

// A fill for a part: its color, or a pattern of it.
// A pattern's tile is 14 units drawn at `size`, its marks in `markColor`
// ("auto": a lighter shade of the cloth's own color).
function patternDef(id, color, kind, size = 14, markColor = "auto") {
  const lt = markColor === "auto" ? lighter(color) : markColor;
  const inner = {
    stripes: `<rect width="14" height="6" fill="${lt}"/>`,
    dots:    `<circle cx="7" cy="7" r="3" fill="${lt}"/>`,
    hearts:  `<text x="7" y="11" font-size="11" text-anchor="middle" fill="${lt}">♥</text>`,
    stars:   `<text x="7" y="11" font-size="11" text-anchor="middle" fill="${lt}">★</text>`,
  }[kind];
  if (!inner) return "";
  return `<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse" ` +
         `patternTransform="scale(${(size / 14).toFixed(3)})">` +
         `<rect width="14" height="14" fill="${color}"/>${inner}</pattern>`;
}
const fillOf = (id, color, kind) => (kind === "plain" ? color : `url(#${id})`);

// ===================== THE FACE (Kids' Choice, ported) =====================
// Drawn in its own units: 0..200 across, the head a circle of radius 80
// centered at (100, 110.6), its chin at (100, 190.6).

const PRESETS = [[220, 20, 60], [140, 190, 50], [170, 178, 186], [207, 160, 0]];
function family(hex) {
  const [r, g, b] = hexToRgb(hex);
  const d = PRESETS.map(([pr, pg, pb]) => (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);
  return d.indexOf(Math.min(...d));
}
function mood(f, brow, smile) {
  const up = brow < 50, smiling = smile >= 50;
  const table = [
    ["disgusted", "shocked", "mischievous", "angry"],
    ["sick", "relieved", "queasy", "grumpy"],
    ["curious", "puzzled", "scheming", "homesick"],
    ["happy", "worried", "determined", "sulky"],
  ][f];
  return table[(up ? 0 : 2) + (smiling ? 0 : 1)];
}

const mouthPath = v => `M60 150 Q100 ${110 + idiv(4 * v, 5)} 140 150`;
function lips(v, o) {
  const q = 110 + idiv(4 * v, 5), bend = q - 150, dir = bend < 0 ? -1 : 1;
  const extreme = Math.abs(bend), even = idiv(36 * o * (40 - extreme), 4000);
  const far = q + dir * even, near = q + idiv((150 - q) * o, 100) - dir * even;
  return far < near ? [far, near] : [near, far];
}
function openMouth(v, o) {
  if (o === 0) return mouthPath(v);
  const [upper, lower] = lips(v, o);
  return `M60 150 Q100 ${lower} 140 150 Q100 ${upper} 60 150 Z`;
}
const browPath = v => `M55 78 Q100 ${50 + idiv(2 * v, 5)} 145 78`;
function browPair(v) {
  const inner = 66 + idiv(v * 24, 100), top = Math.min(inner, 80) - 8;
  return `M48 80 Q68 ${top} 88 ${inner} M152 80 Q132 ${top} 112 ${inner}`;
}
const CRACK = "M38 60 L52 52 L66 63 L80 51 L94 63 L108 51 L122 63 L136 51 L150 62 L162 60";
const CONFETTI = ["deeppink", "orange", "dodgerblue", "limegreen", "gold", "mediumpurple", "red"];

function pieces(shown, burst, crackY = 60) {
  let s = "";
  for (let i = 0; i < 40 && i < shown; i++) {
    const x = 100 + idiv((mod(i * 53, 190) - 95) * burst, 100);
    const y = Math.round(crackY) - idiv((15 + mod(i * 29, 125)) * burst, 100);
    const spin = idiv(mod(i * 67, 360) * burst, 100);
    const kind = mod(i, 5);
    s += `<g transform="translate(${x} ${y}) rotate(${spin})">` + (kind < 3
      ? `<text font-size="${16 + mod(i * 7, 11)}" text-anchor="middle" dominant-baseline="middle">${["🍬", "🍭", "🍫"][kind]}</text>`
      : `<rect x="-6" y="-3" width="12" height="6" fill="${CONFETTI[mod(i, 7)]}"/>`) + "</g>";
  }
  return s;
}
// `angle` slants the eye about its middle (the eye angle, mirrored for
// the right eye by the caller).
// How far up the eyebrows go to clear the eyes: nothing at the usual
// sizes, and as far as big, tall or slanted eyes need -- above the head,
// cartoon style, if it comes to that. The eyes' top is found from the
// same sizes the eye is drawn with.
function browLift(F) {
  const r = 6 + idiv(F.eyes, 7);
  let reach;
  if (F.xeyes) reach = r;
  else if (F.stars || F.hearts) reach = r * 1.6;
  else {
    const irisR = F.iris > 0 ? r + F.iris * 0.25 : 0;
    const whiteR = irisR > 0 && F.whites > 0 ? irisR + F.whites * 0.25 : 0;
    const R = whiteR || irisR || r, k = 1 - 0.88 * F.oval / 100, t = F.tilt * Math.PI / 180;
    reach = Math.hypot(R * Math.sin(t), R * k * Math.cos(t));
  }
  // the brows' ends sit at y = 78; keep them 8 above the eyes' top
  return Math.max(0, reach - 14);
}
function eye(x, size, stars, hearts, xs, F, angle = 0) {
  const r = 6 + idiv(size, 7);
  const turned = inner => `<g transform="rotate(${f1(angle)} ${x} 100)">${inner}</g>`;
  const glyph = (g, gx, gy, gs) =>
    `<text x="${gx}" y="${gy}" font-size="${gs}" text-anchor="middle" dominant-baseline="central">${g}</text>`;
  if (xs) return turned(`<path d="M${x - r} ${100 - r} L${x + r} ${100 + r} M${x - r} ${100 + r} L${x + r} ${100 - r}" ` +
                 `stroke="black" stroke-width="${3 + idiv(r, 6)}" stroke-linecap="round"/>`);
  if (hearts) return turned(glyph("❤️", x, 100, r * 3) + (stars ? glyph("⭐", x + r, 100 - r, idiv(r * 3, 2)) : ""));
  if (stars) return turned(glyph("⭐", x, 100, r * 3));
  // A plain eye, as the eye emoji draws one: an eye white, around an
  // iris, around the pupil -- the white and iris only when chosen -- and
  // a shine, a small dot on the side the light comes from, colored
  // somewhere between the pupil's color and the shine color.
  const irisR = F.iris > 0 ? r + F.iris * 0.25 : 0;
  const whiteR = irisR > 0 && F.whites > 0 ? irisR + F.whites * 0.25 : 0;
  const outer = irisR || r;
  const dot = mix(F.pupil, F.shine, F.shineMix / 100);
  const dotR = r * F.shineSize / 150;
  // eye shape: 0 round, 100 a very narrow oval -- the whole eye squashed
  // top to bottom about its middle, then slanted
  const k = 1 - 0.88 * F.oval / 100;
  // The shine is placed in the picture's own frame, toward the light, so
  // both eyes shine from the same side however they are slanted or
  // squashed: the light's offset is taken into the eye's own (slanted,
  // unsquashed) frame, kept within half the eye, and brought back out.
  const t = angle * Math.PI / 180, cs = Math.cos(t), sn = Math.sin(t);
  const wx = F.lightX * outer * 0.5, wy = F.lightY * outer * 0.5;
  let ux = cs * wx + sn * wy, uy = (-sn * wx + cs * wy) / k;
  const len = Math.hypot(ux, uy), most = outer * 0.55;
  if (len > most) { ux *= most / len; uy *= most / len; }
  const dx = cs * ux - sn * uy * k, dy = sn * ux + cs * uy * k;
  const shineR = Math.min(dotR, outer * k * 0.45);
  return `<g transform="rotate(${f1(angle)} ${x} 100) translate(${x} 100) scale(1 ${k.toFixed(3)}) translate(${-x} -100)">` +
    (whiteR ? `<circle cx="${x}" cy="100" r="${f1(whiteR)}" fill="#ffffff" stroke="black" stroke-width="2"/>` : "") +
    (irisR ? `<circle cx="${x}" cy="100" r="${f1(irisR)}" fill="${F.irisColor}"/>` : "") +
    `<circle cx="${x}" cy="100" r="${r}" fill="${F.pupil}"/>` + "</g>" +
    (shineR > 0.3 ? `<circle cx="${f1(x + dx)}" cy="${f1(100 + dy)}" r="${f1(shineR)}" fill="${dot}"/>` : "");
}
function ray(cx, cy, r0, len, width, color, dx, dy) {
  if (len <= 0) return "";
  return `<line x1="${cx + idiv(r0 * dx, 100)}" y1="${cy + idiv(r0 * dy, 100)}" ` +
         `x2="${cx + idiv((r0 + len) * dx, 100)}" y2="${cy + idiv((r0 + len) * dy, 100)}" ` +
         `stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
}
const FAN = [[100, 100], [94, 134], [94, 66], [77, 164], [77, 36]];
function sideLines(v) {
  const shown = v === 0 ? 0 : 1 + idiv(v * 4, 100);
  const len = 8 + idiv(v * 35, 100), width = 2 + idiv(v, 25);
  const color = ["#999999", "#666666", "#333333", "black", "black"][Math.min(idiv(v, 26), 4)];
  return FAN.slice(0, shown).map(([dx, oy]) =>
    ray(100, 111, 86, len, width, color, dx, oy - 100) +
    ray(100, 111, 86, len, width, color, -dx, oy - 100)).join("");
}
const UP_FAN = [[100, 100], [134, 94], [66, 94], [164, 77], [36, 77], [187, 50], [13, 50]];
const raysUp = (len, width, crackY = 60) =>
  UP_FAN.map(([ox, up]) => ray(100, Math.round(crackY), 18, len, width, "orange", ox - 100, -up)).join("");
function teeth(n, upper, lower) {
  let s = "";
  for (let j = 1; j <= n; j++) {
    const d = n + 1, x = 60 + idiv(80 * j, d), up = j % 2 === 1;
    const q = up ? lower : upper;
    const y = 150 + idiv(2 * j * (d - j) * (q - 150), d * d);
    const tip = up ? y - 10 : y + 10;
    s += `<polygon points="${x - 6},${y} ${x + 6},${y} ${x},${tip}" fill="white" stroke="black" stroke-width="2"/>`;
  }
  return s;
}
const SICK = ["yellowgreen", "#c8c84a", "olivedrab", "#b5c22e"];
const BUMPS = [[8, 15, 7], [20, 40, 8], [30, 62, 8], [40, 88, 9], [50, 96, 8],
               [60, 88, 9], [70, 62, 8], [80, 40, 8], [92, 15, 7], [25, 12, 6]];
// Sickness, as in Kids' Choice, but the pile lands on the ground the
// friend stands on (`ground`, in face units) rather than under the chin.
function sickPile(s, mouthY, ground) {
  if (s <= 0) return "";
  const blob = (x, y, r, i) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${SICK[mod(i, 4)]}" stroke="#6b7a1f" stroke-width="1"/>`;
  // past 100 the pile keeps growing, at half speed
  const p = s > 100 ? 100 + idiv(s - 100, 2) : s > 30 ? idiv((s - 30) * 100, 70) : 0;
  // past 100 it spreads wider but no taller, so the friend is not buried
  const rx = (6 + idiv(p * 84, 100)) * 1.6, ry = (3 + idiv(Math.min(p, 100) * 42, 100)) * 1.6;
  const top = ground - ry;
  const reach = mouthY + idiv((top - mouthY) * Math.min(s, 40), 40);
  const size = 3 + idiv(s, 12);
  let out = `<path d="M100 ${mouthY} Q93 ${idiv(mouthY + reach, 2)} 100 ${reach}" fill="none" stroke="yellowgreen" ` +
            `stroke-width="${4 + idiv(s, 10)}" stroke-linecap="round"/>`;
  if (p > 0) {
    out += `<path d="M${100 - rx} ${ground} A${rx} ${ry} 0 0 1 ${100 + rx} ${ground} Z" fill="#a8b83a" stroke="#6b7a1f" stroke-width="2"/>`;
    BUMPS.forEach(([bx, by, br], i) =>
      out += blob(100 + (bx - 50) * 2 * rx / 100, ground - by * ry / 100, 1 + idiv(br * p, 100) * 1.6, i));
  }
  for (let j = 0; j < 6; j++)
    out += blob(100 + (j % 2 === 0 ? -4 : 4), mouthY + idiv((reach - mouthY) * (j + 1), 6), size - mod(j, 3), j);
  if (s >= 100)
    out += `<circle cx="84" cy="${ground - 38}" r="7"/><circle cx="116" cy="${ground - 38}" r="7"/>` +
           `<path d="M82 ${ground - 12} Q100 ${ground - 28} 118 ${ground - 12}" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>`;
  return out;
}

// ===================== HAIR (in face units) =====================
// The Shoes and Hair hairdos, each placed by its crown on the top of the
// head (100, 30.6) and scaled from that slide's head (radius 36) to this one.

const HAIRDOS = {
  short: { crown: [55, 84], pts: [[15,124],[13,98],[23,76],[41,68],[55,67],[69,68],[87,76],[97,98],[95,124]] },
  long:  { crown: [160, 84], pts: [[116,194],[114,104],[126,76],[146,67],[160,66],[174,67],[194,76],[206,104],[204,194],[184,188],[188,124],[160,84],[132,124],[136,188]] },
  curly: { crown: [265, 84], pts: [[221,120],[215,104],[221,90],[217,78],[229,70],[235,60],[249,62],[257,54],[265,60],[273,54],[281,62],[295,60],[301,70],[313,78],[309,90],[315,104],[309,120]] },
};
// Hair length, as a fraction of each style's usual length (1 = as drawn).
const hairLen = h => (h.length ?? 100) / 100;
// Curly hair hanging down from a side, at x, from y = 120 (the cap's
// edge, in the dos' units) to y = 120 + drop: a column of curls, as a
// wavy outer edge going down and a wavy inner edge coming back up.
function curlColumn(xOut, xIn, drop) {
  const n = Math.max(1, Math.round(drop / 12)), step = drop / n, out = [], back = [];
  for (let i = 1; i <= n; i++) {
    const y = 120 + i * step, bump = i % 2 ? 6 : -2;
    out.push([xOut - Math.sign(xIn - xOut) * bump, y - step / 2], [xOut, y]);
    back.unshift([xIn, y - step / 2], [xIn + Math.sign(xIn - xOut) * (i % 2 ? 2 : -3), y]);
  }
  const tipY = 120 + drop;
  return { down: out.concat([[(xOut + xIn) / 2, tipY + 6]]), up: back };
}
function hairSvg(h) {
  const k = 80 / 36, stroke = darker(h.color), L = hairLen(h);
  const fromPts = (d, pts) => pts.map(([x, y]) => [100 + (x - d.crown[0]) * k, 30.6 + (y - d.crown[1]) * k]);

      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.4;
        ps.push([rr * Math.cos(a), rr * Math.sin(a)]);
      }
      return g(poly(ps, c, st));
    }
    case "paw": {
      // a costume's paw: fur, with a pad and three toe pads
      const pad = h.pad;
      return g(`<circle r="${r * 1.15}" fill="${c}" stroke="${st}" stroke-width="2.5"/>` +
               `<ellipse cx="${-r * 0.15}" rx="${r * 0.42}" ry="${r * 0.5}" fill="${pad}"/>` +
               [[0.62, -0.6], [0.86, 0], [0.62, 0.6]].map(([px, py]) =>
                 `<circle cx="${r * px}" cy="${r * py}" r="${r * 0.22}" fill="${pad}"/>`).join(""));
    }
    case "claw": {
      // a furry paw with four hooked talons: each a curved, tapering
      // point, wide where it leaves the paw and sharp at the tip
      const talon = deg => {
        const t = deg * Math.PI / 180, dx = Math.cos(t), dy = Math.sin(t);
        const nx = -dy, ny = dx;                          // across the talon
        const R = r * 0.7, len = r * 1.4, w = r * 0.25, hook = r * 0.55;
        const P = (along, across) => `${f1(dx * along + nx * across)} ${f1(dy * along + ny * across)}`;
        return `<path d="M${P(R * 0.8, -w)} Q${P(R + len * 0.75, -w * 0.9)} ${P(R + len, hook)} ` +
               `Q${P(R + len * 0.45, w * 0.6)} ${P(R * 0.8, w)} Z" fill="#f4ecd6" stroke="#5c4a2e" stroke-width="2" stroke-linejoin="round"/>`;
      };
      return g([-62, -22, 18, 56].map(talon).join("") +
               `<ellipse cx="${r * 0.1}" rx="${r * 0.85}" ry="${r * 0.8}" fill="${c}" stroke="${st}" stroke-width="2.5"/>` +
               `<ellipse cx="${-r * 0.1}" cy="${r * 0.05}" rx="${r * 0.32}" ry="${r * 0.36}" fill="${st}" opacity="0.35"/>`);
    }
    case "human":
      // a palm, four fingers (the middle one longest) and a thumb
      return g(fingered(r, c, st, [
        { a: -36, len: 1.15, w: 0.25 }, { a: -12, len: 1.35, w: 0.26 }, { a: 12, len: 1.25, w: 0.25 },
        { a: 35, len: 1.0, w: 0.23 }, { a: -95, len: 0.85, w: 0.28, base: 0.5 }]));
    case "alien4":
      // four long, thin fingers spread wide, each with a round pad at its tip
      return g(fingered(r, c, st, [
        { a: -60, len: 1.5, w: 0.18, tip: 0.26 }, { a: -20, len: 1.75, w: 0.18, tip: 0.26 },
        { a: 20, len: 1.65, w: 0.18, tip: 0.26 }, { a: 62, len: 1.35, w: 0.18, tip: 0.26 }], 0.6));
    case "alien3":
      // three very long fingers with big round tips, like a tree frog's
      return g(fingered(r, c, st, [
        { a: -45, len: 1.9, w: 0.2, tip: 0.36 }, { a: 0, len: 2.15, w: 0.2, tip: 0.36 },
        { a: 45, len: 1.9, w: 0.2, tip: 0.36 }], 0.55));
  }
  return "";
}

let faceFrame = { tx: 0, ty: 0, s: 1 };   // where the face is, for dragging it

function draw() {
  const { face: F, body: B, shirt: SH, pants: P } = state;
  const skin = F.color, skinLine = darker(skin);
  // A costume: a suit is fur over everything below the hood; a falcon is
  // wings and a tail over the clothes.
  const C = costumeOn(), kind = state.costume.kind, suit = C && ANIMALS[kind].suit;
  const limb = suit ? C.fur : skin, limbLine = suit ? darker(C.fur) : skinLine;
  const w = SH.width, L = SH.length;
  const nw = Math.max(22, B.neckW / 2 + 6);           // the collar fits the neck

  // ARMS: from each shoulder, at the arms angle, to a hand.
  const a = B.arms * Math.PI / 180, armLen = B.armLen, armW = B.armW;
  const arms = [1, -1].map(side => {
    const A = [side * (w - 6), 8];
    return { side, A, H: [A[0] + side * armLen * Math.cos(a), A[1] + armLen * Math.sin(a)],
             angle: side > 0 ? B.arms : 180 - B.arms };
  });
  const sleeve = suit ? 0.97 : { tee: 0.38, long: 0.95, tank: 0 }[SH.style];

  // PANTS: their hips under the shirt's hem, their feet under the legs.
  const hw = w - 2, LL = B.legLen, fx = hw / 2 + 6, feetY = L + LL;
  // each pants leg is wide enough for the leg inside it
  const half = Math.max(hw / 2, B.legW / 2 + 6);
  const shoeSc = state.shoes.size / 100;
  const ground = feetY + (state.shoes.style === "bare" ? 18 : 30) * shoeSc;

  // HEAD: its chin on the top of the neck.
  const neckTop = -20 - B.neck;
  const s = F.size / 80;
  const ty = neckTop + 6 - (headChin(F) - 4) * s, tx = -100 * s;
  faceFrame = { tx, ty, s };

  // The picture's frame grows to hold everything.
  const handYs = arms.map(x => x.H[1]);
  // each hand's own reach past the end of its arm: big mittens and long
  // fingers stuck out of the frame (and out of the saved picture)
  const reach = handReach(suit ? { style: "paw", size: Math.max(state.hands.size, 12) } : state.hands) + 12;
  // room for big hair on a tall head, a lid blown far off, and candy
  // and hair, stretched with the head (it hangs and spreads in face units)
  const hr = C ? { top: 0, bottom: 0, half: 0 } : hairReach(state.hair);
  const hairY = y => HEAD_C + (y - HEAD_C) * F.faceH / 100;
  const faceTop = Math.min(-90, HEAD_C - 175 * F.faceH / 100, headCrown(F) + 50.6 - 1.4 * F.burst - 40, hairY(hr.top) - 20);
  const top = Math.min(ty + faceTop * s, ...handYs.map(y => y - Math.max(40, reach)));
  const pileP = F.sick > 100 ? 100 + (F.sick - 100) / 2 : F.sick > 30 ? (F.sick - 30) * 100 / 70 : 0;
  const pileRx = (6 + pileP * 84 / 100) * 1.6 * s;
  const bottom = Math.max(ground + 24, ty + hairY(hr.bottom) * s + 16, ...handYs.map(y => y + reach));
  const hairHalf = hr.half * (F.faceW / 100) * (1 + 0.12 * F.alien / 100) * s;
  const left = Math.min(-200, C ? -(w + 185) : -200, ...arms.map(x => x.H[0] - Math.max(40, reach)), ...arms.map(x => -x.H[0] - Math.max(40, reach)),
                        -(fx + half + 70), -(w + 40), -(pileRx + 20), -(B.neckW / 2 + 40), -(hairHalf + 20));
  const width = -2 * left;

  let svg = `<defs>${patternDef("pat-shirt", SH.color, SH.pattern, SH.patternSize, SH.patternColor)}${patternDef("pat-pants", P.color, P.pattern, P.patternSize, P.patternColor)}${C ? furDefs(C) : ""}</defs>`;
  svg += `<ellipse cx="0" cy="${f1(ground)}" rx="${f1(hw + 70)}" ry="12" fill="#000" opacity="0.08"/>`;

  // behind everything: a falcon's wings and tail, or a suit's tail
  if (kind === "falcon") svg += falconWings(C, w) + falconTail(C, hw, L, LL);
  else if (suit) svg += tailSvg(C, kind, hw, L);

  // legs, then shoes, then pants over both: long pants cover a boot's top
  for (const side of [1, -1]) svg += line(side * fx, L, side * fx, feetY, B.legW, limb, limbLine);
  const feet = suit ? { style: "paw", size: state.shoes.size, color: C.fur, pad: C.accent } : state.shoes;
  for (const side of [1, -1]) svg += shoeSvg(side * fx, feetY, side, feet, skin);
  const pf = suit ? "url(#pat-fur)" : fillOf("pat-pants", P.color, P.pattern);
  const ps = suit ? darker(C.fur) : darker(P.color);
  if (!suit && P.style === "skirt") {
    const sl = LL * 0.5;
    svg += `<path d="M${-hw} ${L - 10} L${hw} ${L - 10} L${hw + 30} ${L + sl} Q0 ${L + sl + 14} ${-hw - 30} ${L + sl} Z" ` +
           `fill="${pf}" stroke="${ps}" stroke-width="2.5" stroke-linejoin="round"/>`;
  } else {
    const len = !suit && P.style === "shorts" ? LL * 0.38 : LL;
    svg += poly([[-hw, L - 10], [hw, L - 10], [fx + half, L + len], [fx - half, L + len],
                 [0, L + Math.min(len * 0.3, 40)], [-(fx - half), L + len], [-(fx + half), L + len]], pf, ps);
  }

  // neck, behind the shirt so it shows in the collar
  svg += `<rect x="${-B.neckW / 2}" y="${neckTop}" width="${B.neckW}" height="${B.neck + 44}" rx="4" ` +
         `fill="${limb}" stroke="${limbLine}" stroke-width="2.5"/>`;

  // arms, sleeves and shirt
  const sf = suit ? "url(#pat-fur)" : fillOf("pat-shirt", SH.color, SH.pattern);
  const ss = suit ? darker(C.fur) : darker(SH.color);
  for (const { A, H } of arms) svg += line(A[0], A[1], H[0], H[1], armW, limb, limbLine);
  const sleeveEnd = ({ A, H }) => [A[0] + (H[0] - A[0]) * sleeve, A[1] + (H[1] - A[1]) * sleeve];
  if (sleeve > 0) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 14, ss); }
  const collar = { v: [[0, 18]], round: [[-nw * 0.7, -6], [0, -1], [nw * 0.7, -6]], flat: [] }[SH.collar];
  const shoulder = !suit && SH.style === "tank" ? [[nw + 12, -20], [w, 30]] : [[w + 4, -6], [w, 44]];
  const torso = [[-nw, -20], ...collar, [nw, -20], ...shoulder, [w + 2, L], [-(w + 2), L],
                 ...shoulder.map(([x, y]) => [-x, y]).reverse()];
  svg += poly(torso, sf, ss);
  if (suit)  // the suit's belly
    svg += `<ellipse cx="0" cy="${f1(L * 0.58)}" rx="${f1(w * 0.55)}" ry="${f1(L * 0.36)}" fill="${C.belly}"/>`;
  if (sleeve > 0) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 9, sf); }

  const hands = suit ? { style: "paw", size: Math.max(state.hands.size, 12), color: C.fur, pad: C.accent } : state.hands;
  for (const { side, H, angle } of arms) svg += handSvg(H[0], H[1], angle, side, hands, skin);

  // the face last, on top, in its own units
  const groundInFace = (ground - ty) / s;
  svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">${faceSvg(F, groundInFace)}</g>`;

  const pic = document.getElementById("pic");
  pic.setAttribute("viewBox", `${f1(left)} ${f1(top)} ${f1(width)} ${f1(bottom - top)}`);
  pic.innerHTML = svg;
  document.getElementById("mood").textContent = "feeling " + mood(family(F.color), F.brow, F.smile);
}

let tab = 0;
let syncs = [];   // each control's refresh, run after every change

function set(part, key, value) {
  state[part][key] = value;
  // choosing an animal dresses it in its natural colors
  if (part === "costume" && key === "kind" && ANIMALS[value]) Object.assign(state.costume, lookOf(value));
  changed();
}
function changed() { draw(); for (const f of syncs) f(); persist(); }

function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of [].concat(kids)) e.append(k);
  return e;
}

// Iris color and eye whites only mean something once there is an iris.
const SHOWN_WHEN = {
  "face.irisColor": f => f.iris > 0,
  "face.whites": f => f.iris > 0,
  "costume.fur": c => c.kind !== "none",
  "costume.furPattern": c => !!(ANIMALS[c.kind] && ANIMALS[c.kind].suit),
  "costume.marks": c => c.kind !== "none",
  "costume.belly": c => c.kind !== "none",
  "costume.eyes": c => c.kind !== "none",
  "costume.accent": c => c.kind !== "none",
  "hair.length": h => ["long", "curly", "pigtails", "spiky", "afro"].includes(h.style),
  "shirt.patternSize": c => c.pattern !== "plain",
  "shirt.patternColor": c => c.pattern !== "plain",
  "pants.patternSize": c => c.pattern !== "plain",
  "pants.patternColor": c => c.pattern !== "plain",
};

function control(part, [kind, key, label, ...rest]) {
  const val = el("span", { class: "val" });
  const box = el("div", { class: "ctl" }, [el("div", { class: "lbl" }, [label, val])]);
  if (kind === "range") {
    const [lo, hi] = rest;
    const input = el("input", { type: "range", min: lo, max: hi,
                                oninput: e => set(part, key, Number(e.target.value)) });
    box.append(input);
    syncs.push(() => { input.value = state[part][key]; val.textContent = state[part][key]; });
  } else if (kind === "toggle") {
    const b = el("button", { onclick: () => set(part, key, !state[part][key]) });
    box.querySelector(".lbl").textContent = "";
    box.append(b);
    syncs.push(() => { b.textContent = label + (state[part][key] ? ": on" : ": off");
                       b.setAttribute("aria-pressed", state[part][key]); });
  } else if (kind === "choice") {
    const row = el("div", { class: "row" });
    const bs = rest[0].map(([v, text]) => {
      const b = el("button", { onclick: () => set(part, key, v) }, text);
      row.append(b); return [v, b];
    });
    box.append(row);
    syncs.push(() => { for (const [v, b] of bs) b.setAttribute("aria-pressed", state[part][key] === v); });
  } else if (kind === "color") {
    const row = el("div", { class: "row" });
    const bs = rest[0].map(c => {
      const b = c === "skin" || c === "auto"
        ? el("button", { class: "swatch skin", title: c === "skin" ? "same as skin" : "a lighter shade",
                         onclick: () => set(part, key, c) }, c)
        : el("button", { class: "swatch", title: c, style: `background:${c}`, onclick: () => set(part, key, c) });
      row.append(b); return [c, b];
    });
    const pick = el("input", { type: "color", title: "any color",
                               oninput: e => set(part, key, e.target.value) });
    row.append(pick);
    box.append(row);
    syncs.push(() => {
      for (const [c, b] of bs) b.setAttribute("aria-pressed", state[part][key] === c);
      if (state[part][key].startsWith("#")) pick.value = state[part][key];
    });
  } else if (kind === "pad") {
    // A square to tap or drag: the sun marks where the light comes from,
    // and the shine sits on that side of each eye.
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "-1.2 -1.2 2.4 2.4");
    svg.setAttribute("class", "pad");
    svg.innerHTML = `<rect x="-1.2" y="-1.2" width="2.4" height="2.4" rx="0.2" fill="#87ceeb"/>` +
      `<circle r="0.45" fill="#f5c542" stroke="#333" stroke-width="0.04"/>` +
      `<circle cx="-0.15" cy="-0.08" r="0.07"/><circle cx="0.15" cy="-0.08" r="0.07"/>` +
      `<g id="sun"><circle r="0.16" fill="#fff59d" stroke="#f59e0b" stroke-width="0.05"/></g>`;
    const sun = svg.querySelector("#sun");
    const at = e => {
      const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
      const c = v => Math.round(Math.max(-1, Math.min(1, v)) * 100) / 100;
      state[part].lightX = c(p.x); state[part].lightY = c(p.y); changed();
    };
    let held = false;
    svg.addEventListener("pointerdown", e => { held = true; svg.setPointerCapture(e.pointerId); at(e); });
    svg.addEventListener("pointermove", e => { if (held) at(e); });
    svg.addEventListener("pointerup", () => { held = false; });
    svg.addEventListener("pointercancel", () => { held = false; });
    box.append(svg);
    syncs.push(() => sun.setAttribute("transform", `translate(${state[part].lightX} ${state[part].lightY})`));
  }
  const when = SHOWN_WHEN[part + "." + key];
  if (when) syncs.push(() => { box.hidden = !when(state[part]); });
  return box;
}

function showTab() {
  syncs = [];
  const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");
  tabs.replaceChildren(...TABS.map(([name], i) =>
    el("button", { "aria-pressed": i === tab, onclick: () => { tab = i; showTab(); } }, name)));
  const [, part, ctls] = TABS[tab];
  panel.replaceChildren(...ctls.map(c => control(part, c)));
  changed();
}

// ===================== SURPRISE, SAVE, START OVER =====================

const pick = xs => xs[Math.floor(Math.random() * xs.length)];
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
document.getElementById("surprise").addEventListener("click", () => {
  for (const [, part, ctls] of TABS)
    for (const [kind, key, , ...rest] of ctls) {
      if (kind === "range") state[part][key] = rnd(rest[2] ?? rest[0], rest[3] ?? rest[1]);
      else if (kind === "toggle") state[part][key] = Math.random() < 0.3;
      else if (kind === "choice") state[part][key] = pick(rest[0])[0];
      else if (kind === "color") state[part][key] = pick(rest[0]);
    }
  // keep the surprises friendly: mostly not sick, not exploded, a normal-ish head
  const F = state.face;
  if (Math.random() < 0.75) F.sick = 0;
  if (Math.random() < 0.6) { F.burst = 0; F.rays = 0; }
  // irises about 4 times in 10, and eye whites around about half of those
  F.iris = Math.random() < 0.4 ? rnd(15, 60) : 0;
  F.whites = F.iris > 0 && Math.random() < 0.5 ? rnd(10, 60) : 0;
  // now and then, an alien: a pointed head and slanted almond eyes
  const alien = Math.random() < 0.15;
  F.alien = alien ? rnd(50, 100) : 0;
  F.tilt = alien ? rnd(15, 35) : 0;
  if (alien) F.oval = rnd(45, 75);
  // and on their own, a somewhat alien head about 1 time in 5, and
  // slanted eyes, up or down, about 1 time in 4
  if (!alien && Math.random() < 0.2) F.alien = rnd(15, 70);
  if (!alien && Math.random() < 0.25) F.tilt = rnd(-20, 35);
  // a costume about 1 time in 4, in its natural colors
  state.costume.kind = Math.random() < 0.25 ? pick(Object.keys(ANIMALS)) : "none";
  if (ANIMALS[state.costume.kind]) Object.assign(state.costume, lookOf(state.costume.kind));
  changed();
});
document.getElementById("reset").addEventListener("click", () => { state = clone(DEFAULTS); changed(); });
// SAVE: up to three files with one name, stamped with the local date and time
// so each save is new: my-friend-2026-10-10-16-29-05.png, .svg and .json.
// The picture as it is drawn (.png), the drawing itself, which Firefox
// opens and which prints sharp at any size (.svg), and the settings, which
// Load brings back (.json).
function download(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
// which files Save writes: all three to start with; unchecking one is
// remembered on this device
const formatBoxes = [...document.querySelectorAll("#formats input")];
try {
  const off = JSON.parse(localStorage.getItem("dress-up-save-off") || "[]");
  for (const b of formatBoxes) b.checked = !off.includes(b.value);
} catch (_) {}
for (const b of formatBoxes) b.addEventListener("change", () => {
  try { localStorage.setItem("dress-up-save-off", JSON.stringify(formatBoxes.filter(x => !x.checked).map(x => x.value))); } catch (_) {}
});
const wanted = f => formatBoxes.some(b => b.value === f && b.checked);
document.getElementById("save").addEventListener("click", () => {
  if (!formatBoxes.some(b => b.checked)) { alert("Check at least one kind of file to save."); return; }
  const d = new Date(), two = n => String(n).padStart(2, "0");
  const name = `my-friend-${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}-` +
               `${two(d.getHours())}-${two(d.getMinutes())}-${two(d.getSeconds())}`;
  const pic = document.getElementById("pic");
  const vb = pic.viewBox.baseVal, scale = 1000 / vb.height;
  // a standalone copy at its own size; both the .svg and the .png keep a
  // transparent background
  const copy = pic.cloneNode(true);
  copy.setAttribute("width", Math.round(vb.width * scale));
  copy.setAttribute("height", 1000);
  const svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = Math.round(vb.width * scale); c.height = 1000;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    c.toBlob(blob => {
      if (wanted("png")) download(blob, name + ".png");
      if (wanted("svg")) download(new Blob([svgText], { type: "image/svg+xml" }), name + ".svg");
      if (wanted("json"))
        download(new Blob([JSON.stringify({ app: "dress-up", version: 1, saved: d.toISOString(), state }, null, 2)],
                          { type: "application/json" }), name + ".json");
    });
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
});
// LOAD: a saved .json (or a bare state object); anything it lacks keeps
// its default, so friends saved before a feature existed still load.
document.getElementById("load").addEventListener("click", () => document.getElementById("load-file").click());
document.getElementById("load-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const saved = data && data.state ? data.state : data;
    if (!saved || typeof saved !== "object") throw new Error("no settings in this file");
    const next = clone(DEFAULTS);
    for (const k of Object.keys(DEFAULTS)) next[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
    state = next;
    changed();
  } catch (err) {
    alert("That file didn't load: " + err.message);
  }
});

// ===================== DRAG THE MOUTH AND BROW =====================
// As in Kids' Choice: a press above the eyes grabs the brow, below them
// the mouth, and dragging down raises the value: a smile, or a glower.

let drag = null;
const pic = document.getElementById("pic");
function faceUnits(e) {
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(pic.getScreenCTM().inverse());
  return [(p.x - faceFrame.tx) / faceFrame.s, (p.y - faceFrame.ty) / faceFrame.s];
}
pic.addEventListener("pointerdown", e => {
  const [x, y] = faceUnits(e);
  if ((x - 100) ** 2 + (y - 110) ** 2 > 90 ** 2) return;
  const feature = y < 88 - browLift(state.face) ? "brow" : "smile";
  drag = { feature, v0: state.face[feature], y0: e.clientY };
  pic.setPointerCapture(e.pointerId);
});
// One step per screen pixel, however big the picture is drawn.
pic.addEventListener("pointermove", e => {
  if (!drag) return;
  state.face[drag.feature] = clamp(Math.round(drag.v0 + (e.clientY - drag.y0)), -100, 200);
  changed();
});
const letGo = () => { drag = null; };
pic.addEventListener("pointerup", letGo);
pic.addEventListener("pointercancel", letGo);

showTab();
</script>
</body>
</html>
