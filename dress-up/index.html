<title>Messed Up Dress Up</title>
<style>
  :root { --ink: #222; --muted: #666; --line: #d6d6d6; --paper: #fffdf7; --bg: #f3f0ff;
          --panel: #ffffff; --accent: #7c3aed; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #aaa; --line: #444; --paper: #fffdf7; --bg: #1d1a26;
            --panel: #29253a; --accent: #a78bfa; --accent-ink: #1d1a26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; }
  /* over the picture, centered on it (at the window's edge it hung far out
     to the left of a picture centered in its column) */
  h1 { margin: 0 0 10px; font-size: 1.6em; letter-spacing: 0.02em; text-align: center; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px;
         max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: sticky; top: 8px; align-self: start; }
  /* The picture, its caption and buttons always fit on the screen, so the
     picture stays in view while the controls scroll. */
  svg#pic { display: block; width: 100%; height: auto;
            max-height: calc(100vh - 195px); max-height: calc(100dvh - 195px);
            background: var(--paper); border-radius: 18px; border: 2px solid var(--line);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .caption { text-align: center; margin-top: 6px; font-size: 1.2em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 2px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 6px 12px; }
  button.big { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
               font-weight: 600; padding: 8px 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tabs button { font-weight: 600; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ctl.master .name { font-weight: 700; }
  .lfo-chip { font-size: 0.75em; padding: 1px 8px; margin-left: auto; margin-right: 8px; }
  .ctl.master.mixed input, .ctl.master.mixed .name { opacity: 0.45; }
  .ctl.master.mixed .val { font-style: italic; color: var(--muted); }
  .tabs .repo-chip { align-self: center; padding: 3px 9px; border: 1px dashed var(--line); border-radius: 12px;
                     color: var(--muted); font-size: 0.8em; text-decoration: none; }
  .tabs .repo-chip:hover, .tabs .repo-chip:focus-visible { color: var(--ink); border-color: var(--muted); }
  .panel { background: var(--panel); border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); }
  .ctl { margin: 10px 0; }
  .ctl > .lbl { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .ctl > .lbl .val { color: var(--muted); font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* a menu for each hand, mirrored about a line down the middle */
  .ctl.pair:not([hidden]) { display: flex; }
  .pair > .side { flex: 1 1 0; min-width: 0; }
  .pair > .side:first-child { padding-right: 10px; }
  .pair > .side:last-child { padding-left: 10px; border-left: 2px dashed var(--line); }
  .pair > .side > .lbl { font-weight: 600; margin-bottom: 4px; }
  .pair > .side:last-child > .lbl { text-align: right; }
  .pair > .side:last-child .row { justify-content: flex-end; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid var(--line); }
  .swatch[aria-pressed=true] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .swatch.skin { font-size: 0.6em; }
  input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); }
  input[type=color] { width: 40px; height: 34px; border: none; padding: 0; background: none; }
  .hint { color: var(--muted); font-size: 0.9em; }
  /* the figure's place in its scene: the stage in small, the figure a box */
  svg.place { display: block; width: 100%; max-width: 240px; height: auto; touch-action: none; cursor: crosshair;
              border-radius: 10px; border: 2px solid var(--line); }
  svg.pad { width: 140px; height: 140px; display: block; touch-action: none; cursor: crosshair;
            border-radius: 14px; border: 2px solid var(--line); }
  /* On a phone the controls are below the picture, so the picture is
     kept small and pinned at the top: a change shows while you make it. */
  @media (max-width: 760px) {
    body { padding-top: 8px; }
    h1 { display: none; }
    .stage { top: 0; z-index: 1; background: var(--bg); padding: 4px 0 8px; margin: 0 -16px; padding-inline: 16px; }
    svg#pic { max-height: 40vh; max-height: 40dvh; }
    .stage .hint { display: none; }

  }
  .formats { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center;

     half-faded pins, each a layer of its own, paint over the full screen) */
  body.big .stage { z-index: 20; }

  body.big .pic-wrap { position: fixed; inset: 0; z-index: 10; background: var(--bg); padding: 8px;
                      display: flex; flex-direction: column; gap: 8px; }
  body.big svg#pic { width: 100%; height: 0; flex: 1 1 auto; max-height: none; }
  body.big .max-btn { top: 16px; right: 16px; }
  /* the music's quick mute, at the picture's other top corner */
  .mute-btn { position: absolute; top: 8px; left: 8px; padding: 0 9px; font-size: 1.3em; line-height: 1.45;

  body.big .mute-btn { top: 16px; left: 16px; }
  /* back through the last doorway, after a trip through one */
  .back-btn { position: absolute; bottom: 8px; left: 8px; padding: 0 10px; font-size: 1.15em; line-height: 1.6;
              background: var(--panel); opacity: 0.92; }
  body.big .back-btn { bottom: auto; top: 16px; left: 66px; }
  .ctl > p.now { margin: 0; color: var(--muted); }
  /* the mixing board: a strip for each part, the whole tune's first */
  .mixer { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 4px; }
  .mixer p.now { margin: 0; color: var(--muted); }
  .strip { border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; font-size: 0.85em; }
  .strip.master { border-style: dashed; }
  .strip.lfo { border-style: dotted; }

  @media (max-width: 520px) { .mixer .quad { grid-template-columns: minmax(0, 1fr); } }
  /* a set of chips in a dashed box of its own, with its name (the music's

  .chipset + .chipset { margin-top: 6px; }
  .chipset > .cap { color: var(--muted); font-size: 0.85em; margin-bottom: 4px; }

  .ctlgroup > .ctl { margin: 8px 0; }
  .ctlgroup.here { border-style: solid; border-color: var(--accent); }

  /* a throw is held down: no text selection or long-press menu on a tablet */

  .knob { display: grid; grid-template-columns: 6.2em 1fr 3.8em; align-items: center; gap: 4px; }
  .knob input[type=range] { height: 22px; }
  .knob .val { color: var(--muted); text-align: right; font-size: 0.9em; }

  .ctl .pos { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; margin-top: 4px; }
  .ctl .where { font-weight: 600; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .ctl .when { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }

  .marks span { height: 14px; border-radius: 4px; background: var(--line); color: var(--muted); font-size: 10px; line-height: 14px; text-align: center; overflow: hidden; }
  .marks span.on { background: var(--accent); color: var(--accent-ink); }

  .hud-btn { display: none; position: absolute; top: 16px; right: 66px; padding: 0 9px; font-size: 1.3em;
             line-height: 1.45; background: var(--panel); opacity: 0.9; }
  body.big .hud-btn { display: block; }
  /* (below the picture, which shrinks to make room: it never covers the
     figure or its face) */
  .hud { flex: 0 0 auto; max-height: 40vh; overflow: auto; border-radius: 14px;
         display: flex; flex-wrap: wrap; gap: 0 18px; padding: 6px 16px 10px;
         background: rgba(24, 20, 36, 0.86); color: #fff; }
  .hud[hidden] { display: none; }
  .hud .ctl { flex: 1 1 220px; margin: 6px 0; }
  .hud .ctl > .lbl .val { color: #ddd; }
  .hud .empty { color: #ddd; padding: 8px 0; }
  .pin { border: none; background: none; padding: 0; margin-right: 6px; font-size: 0.85em; opacity: 0.3;
         cursor: pointer; vertical-align: baseline; }
  .pin[aria-pressed=true] { opacity: 1; }
  /* in the HUD, an eye on each slider folds it away to its name, and back
     (it stays pinned) */
  .eye { border: none; background: none; padding: 0; margin-right: 6px; font-size: 0.95em; cursor: pointer; }
  .eye[aria-pressed=false] { opacity: 0.45; }
  .hud .ctl.min { flex: 0 0 auto; }
  .hud .ctl.min input, .hud .ctl.min .val { display: none; }
  .hud .ctl.min > .lbl { margin: 0; }
  .hud svg.place { max-width: 130px; }
  .hud .ctl.min svg.place { display: none; }
  /* a doorway into another scene (a picture, a window, a tree house, a
     door) glows under the pointer; a click goes through it */
  #bg .portal { cursor: pointer; }
  #bg .portal:hover { filter: drop-shadow(0 0 3px #fffbe0) drop-shadow(0 0 9px #ffd23f) brightness(1.08); }
/* A fairy's wings flap, and their stars twinkle, by CSS, not SVG
   animation: a drag pauses the picture's SVG animations (see pointerdown),
   and the wings go on flapping through it, to fly. Each redraw starts them
   in step with the clock (fairyPhase), so they never restart mid-flap. */
@keyframes fairy-flap-l { 50% { transform: rotate(9deg); } }
@keyframes fairy-flap-r { 50% { transform: rotate(-9deg); } }
@keyframes fairy-twinkle { 50% { opacity: 0.2; } }

<script>
"use strict";

// ===================== STATE =====================

// Each tree house's own colors, for the kinds of house that have them: a

const HOUSE_COLOR_DEFAULTS = {
  cat: { catFur: "#1f1f22", catWhite: "#ffffff", catEyes: "#c6d43a" },
  fancy: { fancyWalls: "#d9c3e6", fancyRoof: "#6a4c93", fancyTrim: "#ffffff" },
  craftsman: { craftWalls: "#9aa982", craftRoof: "#5a3e2b", craftTrim: "#f4efe6", craftGable: "#c9b27a" },
};
// A figure's usual size in each background, a share of its full size: as
// big as the scene's things make sense beside it (small by a waterfall or
// a tree house, bigger by a couch). 100 on the size slider is this, in
// whatever scene: the slider grows or shrinks the friend from the place's
// own usual size. (Before 0.0.21, 100 was the full size everywhere: a
// friend saves which it was sized in, figUnit; see upgradeFigSize.)
const SCENE_FIG = { forest: 0.45, underwater: 0.45, beach: 0.45, witch: 0.4, cemetery: 0.45, lake: 0.45, house: 0.35,
                    treehouse: 0.3, treeroom: 0.65, livingroom: 0.7, witchroom: 0.6, healerroom: 0.6, fairyforest: 0.4, clearing: 0.45, mountains: 0.45,
                    waterfall: 0.37, campsite: 0.3, tent: 0.5, cave: 0.4, woodpath: 0.45, castle: 0.35, castleroom: 0.55, imagination: 0.3 };
const sceneFig = kind => SCENE_FIG[kind] ?? 0.45;
// The three castles, N's, M's and D's, each with its own settings: how many
// levels (1 to 5), its stone, how many trees grow round it, and how wide
// its moat is (and so its drawbridge), from none to very wide. The forest
// clearing shows the one picked, far off; its own scene shows it up close.
const CASTLES = [["N", "🏰 N's castle", "#e53935"], ["M", "🏰 M's castle", "#f2c12e"], ["D", "🏰 D's castle", "#3b82f6"]];
const CASTLE_DEFAULTS = { N: { levels: 3, stone: "#b8b8c4", trees: 6, moat: 100 },
                          M: { levels: 4, stone: "#e2c9a0", trees: 10, moat: 60 },
                          D: { levels: 5, stone: "#7c8b6f", trees: 16, moat: 72 } };
const CASTLE_STONES = ["#b8b8c4", "#e2c9a0", "#8a8f98", "#e8e4da", "#c98f7a", "#7c8b6f", "#5a5f6e"];
// a castle's banners and flags: two colors of its owner's, used in turn,

const CASTLE_FLAG_COLORS = ["#e53935", "#f2c12e", "#3b82f6", "#22c55e", "#6a2c91", "#f472b6", "#f97316", "#ffffff", "#1f1f22"];
const CASTLE_FLAG_DEFAULTS = { N: ["#e53935", "#ffffff"], M: ["#f2c12e", "#6a2c91"], D: ["#6a2c91", "#22c55e"] };
// (each castle's own to start with: how its flags' two colors go, and its roofs; D's chosen by D, 2026-10-15)
const CASTLE_FLAG_STYLE_DEFAULTS = { N: "alternate", M: "alternate", D: "stripes" };
const CASTLE_ROOF_DEFAULTS = { N: "#3b5ea8", M: "#3b5ea8", D: "#7c3aed" };
const CASTLE_FLAG_STYLES = [["alternate", "↔️ in turn"], ["stripes", "▥ stripes"], ["checkers", "▦ checkers"]];
// a castle's carpets (the hallway's, the king's room's)
const CASTLE_CARPETS = ["#a3122a", "#1e3a8a", "#14532d", "#6a2c91", "#7c2d12", "#d4a017", "#1f1f22"];
// Each castle has two color themes, A and B, each its two colors, how they
// go (in turn, stripes, checkers) and a carpet color; each room takes one
// (its banners, shields and carpet), so two hallways or two king's rooms
// can look different. A is the castle's own (its flags outside too); B
// starts as A with its two colors swapped and its carpet in A's second
// color; rooms take A and B by turns to start with (odd rooms A).
const CARPET_COLORS = [...new Set([...CASTLE_CARPETS, ...CASTLE_FLAG_COLORS])];
const THEMES = [["A", "🎨 theme A"], ["B", "🎨 theme B"]];
// where the hallway's far end, the foot of a spiral staircase, leads: the
// castle's first spiral staircase room, a room of its own choosing, or nowhere
// A castle is rooms by number, each with its own exits. A hallway's: up to
// four doors in its walls, each to the outside or to a room by its number
// (its own too), and the stairs at its far end. By default, its first door
// leads out and the others to the castle's other rooms in turn.
// (a castle's rooms by number, as choices: only those it has)
const castleRoomCount = (b, id) => Math.max(1, Math.min(6, Math.round(b["castleRooms" + id] ?? CASTLE_ROOMS[id].length)));
const roomChoices = id => [1, 2, 3, 4, 5, 6].map(n => [String(n), b => `${roomLabel(castleOf({ ...b, castle: id }).rooms[n - 1] ?? "king").split(" ")[0]} room ${n}`, b => n <= castleRoomCount(b, id)]);
const hallDoorDests = id => [["out", "🏰 out of the castle"], ...roomChoices(id)];
const hallEnds = id => [["auto", "🌀 the first spiral stairs"], ...roomChoices(id), ["none", "🧱 nowhere"]];
const hallDoorKey = (id, n, j) => "castleHallDoor" + n + "_" + j + id;
const hallDoorDefault = (n, j) => j === 1 ? "out" : String([1, 2, 3, 4, 5, 6].filter(m => m !== n)[j - 2]);
const CASTLE_ROOFS = ["#3b5ea8", "#b91c1c", "#2f6e3a", "#5a5f6e", "#7c3aed", "#c2410c", "#1f2937"];
// A castle's rooms: up to six, each in a style. The styles are by who made
// them up (N's, M's and D's), and any castle may use any of them. A trap
// room's two pits drop into the castle's dungeons.
const ROOM_STYLES = [["N", "N's rooms", [["king", "👑 king's room"], ["greenhouse", "🌿 greenhouse"], ["trap", "🕳️ trap room"],
                                          ["dungeon1", "🗝️ dungeon"], ["dungeon2", "⛓️ deep dungeon"], ["hallway", "🕯️ hallway"]]],
                    ["more", "more rooms", [["catroom", "🐈 cat room"]]]];
// the rooms whose exits are their own (K.hall): a hallway's doors and stairs; the

// us; each of these rooms also takes a color theme
const SIDE_DOOR_ROOMS = ["king", "catroom"], OWN_EXIT_ROOMS = ["hallway", ...SIDE_DOOR_ROOMS];
// The cat room's cats: the castle's own, up to eight, each with its fur, its
// tuxedo white (or none), its eyes, how it is (sitting, asleep, walking), where
// in the room it is, its size, and its wag: with an LFO (in time with the
// music) or its own, and how far into the wag it starts, each its own (at
// random to begin with), so no two wag together
const CAT_FURS = ["#1f1f22", "#6f6f7d", "#e8862a", "#6b4226", "#ffffff", "#d9b38c", "#8b5cf6"];
const CAT_WHITES = ["#ffffff", "off", "#f7ead8", "#ffd1dc", "#c0c0c0", "#1f1f22"];
const CAT_EYES = ["#c6d43a", "#e0a800", "#3b82f6", "#22c55e", "#f28c28"];
const CAT_POSES = [["sit", "🐈 sitting"], ["sleep", "😴 curled up asleep"], ["walk", "🐾 walking"]];
const CAT_SPOTS = [["fire", "🔥 by the fire"], ["treeL", "🌳 on the left cat tree"], ["walkway", "🌉 on the high walkway"], ["window", "🪟 in the window seat"],
                   ["treeR", "🌳 on the right cat tree"], ["basket", "🧺 in the basket"], ["shelfL", "🪵 on the left shelf"], ["shelfR", "🪵 on the right shelf"],
                   ["mantel", "🕯️ on the mantel"], ["rug", "🧶 on the rug"], ["box", "📦 in the box"], ["bridge", "🪢 on the rope bridge"]];
const CAT_ROOM_CATS = [
  { fur: "#e8862a", white: "#ffffff", eyes: "#22c55e", pose: "sleep", spot: "fire", offset: 17 },
  { fur: "#1f1f22", white: "#ffffff", eyes: "#c6d43a", pose: "sit", spot: "treeL", offset: 62 },
  { fur: "#6f6f7d", white: "off", eyes: "#e0a800", pose: "walk", spot: "walkway", offset: 38 },
  { fur: "#ffffff", white: "off", eyes: "#3b82f6", pose: "sit", spot: "window", offset: 85 },
  { fur: "#6b4226", white: "#f7ead8", eyes: "#f28c28", pose: "sit", spot: "treeR", offset: 9 },
  { fur: "#6f6f7d", white: "#ffffff", eyes: "#22c55e", pose: "sleep", spot: "basket", offset: 51 },
  { fur: "#1f1f22", white: "off", eyes: "#e0a800", pose: "sit", spot: "box", offset: 74 },
  { fur: "#d9b38c", white: "#ffffff", eyes: "#3b82f6", pose: "walk", spot: "bridge", offset: 29 }];
const CAT_ROOM_COUNT = 6;
const catKey = (id, j, what) => "castleCat" + j + what + id;
const CASTLE_ROOM_CHOICES = ROOM_STYLES.flatMap(([, , list]) => list);
const roomLabel = st => (CASTLE_ROOM_CHOICES.find(([v]) => v === st) || [st, st])[1];
// skeletons and skulls: none unless asked for, room by room (0 up to what
// the room's drawing has); the dungeons are the rooms that have them
const ROOM_BONES = { dungeon1: 2, dungeon2: 4 };
const roomBonesKey = (id, n, st) => "castleBones" + n + id + st;
const CASTLE_ROOMS = { N: ["king", "greenhouse", "trap", "dungeon1", "dungeon2"], M: ["greenhouse", "king"], D: ["king", "trap", "dungeon1"] };
const castleOf = o => {
  const id = CASTLE_DEFAULTS[o.castle] ? o.castle : "N", d = CASTLE_DEFAULTS[id];
  const fl = CASTLE_FLAG_DEFAULTS[id], flagA = o["castleFlagA" + id] ?? fl[0];
  return { id, flag: flagA, flagA, flagB: o["castleFlagB" + id] ?? fl[1],
           flagStyle: CASTLE_FLAG_STYLES.some(([v]) => v === o["castleFlagStyle" + id]) ? o["castleFlagStyle" + id] : CASTLE_FLAG_STYLE_DEFAULTS[id],
           roof: o["castleRoof" + id] ?? CASTLE_ROOF_DEFAULTS[id], carpet: o["castleCarpet" + id] ?? CASTLE_CARPETS[0],
           themeB: { flagA: o["castleFlagA_B" + id] ?? fl[1], flagB: o["castleFlagB_B" + id] ?? fl[0], carpet: o["castleCarpet_B" + id] ?? fl[1],
                     flagStyle: CASTLE_FLAG_STYLES.some(([v]) => v === o["castleFlagStyle_B" + id]) ? o["castleFlagStyle_B" + id] : CASTLE_FLAG_STYLE_DEFAULTS[id], theme: "B" },
           roomTheme: [1, 2, 3, 4, 5, 6].map(n => ["A", "B"].includes(o["castleRoomTheme" + n + id]) ? o["castleRoomTheme" + n + id] : n % 2 ? "A" : "B"),
           // each room's own exits, when it is a hallway (castleWays)
           hall: [1, 2, 3, 4, 5, 6].map(n => ({
             doors: [...Array(Math.max(0, Math.min(4, Math.round(o["castleHallDoors" + n + id] ?? 3))))].map((_, j) => String(o[hallDoorKey(id, n, j + 1)] ?? hallDoorDefault(n, j + 1))),
             end: String(o["castleHallEnd" + n + id] ?? "auto") })),
           levels: Math.max(1, Math.min(5, Math.round(o["castleLevels" + id] ?? d.levels))),
           stone: o["castleStone" + id] ?? d.stone, trees: Math.max(0, Math.round(o["castleTrees" + id] ?? d.trees)),
           moat: Math.max(0, (o["castleMoat" + id] ?? d.moat) / 100),
           rooms: [...Array(Math.max(1, Math.min(6, Math.round(o["castleRooms" + id] ?? CASTLE_ROOMS[id].length))))].map((_, i) => {
             const st = o["castleRoom" + (i + 1) + id] ?? CASTLE_ROOMS[id][i] ?? "king";
             return CASTLE_ROOM_CHOICES.some(([v]) => v === st) ? st : "king"; }),
           bones: [1, 2, 3, 4, 5, 6].map(n => Object.fromEntries(Object.entries(ROOM_BONES).map(([st, most]) =>
             [st, Math.max(0, Math.min(most, Math.round(o[roomBonesKey(id, n, st)] ?? 0)))]))),
           // its cats, who live in its cat room (or rooms)
           cats: CAT_ROOM_CATS.slice(0, Math.max(0, Math.min(8, Math.round(o["castleCats" + id] ?? CAT_ROOM_COUNT)))).map((d, i) => {
             const v = w => o[catKey(id, i + 1, w)];
             return { fur: v("Fur") ?? d.fur, white: v("White") ?? d.white, eyes: v("Eyes") ?? d.eyes,
                      pose: CAT_POSES.some(([p]) => p === v("Pose")) ? v("Pose") : d.pose,
                      spot: CAT_SPOTS.some(([p]) => p === v("Spot")) ? v("Spot") : d.spot, size: Math.max(20, Math.min(300, v("Size") ?? 100)),
                      lfo: LFO_NAMES.includes(v("Lfo")) ? v("Lfo") : "none", offset: Math.max(0, Math.min(99, v("Offset") ?? d.offset)) }; }) };
};
// the fill for a castle's i-th flag or banner: its two colors in turn, or

// ===================== HELPERS =====================

const idiv = (a, b) => Math.trunc(a / b);           // Hazel's Int division
const mod = (a, n) => a - idiv(a, n) * n;
const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));
const f1 = x => (Math.round(x * 10) / 10).toString();
const pts = ps => ps.map(([x, y]) => f1(x) + "," + f1(y)).join(" ");
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbToHex([r, g, b]) { return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join(""); }
const mix = (h, to, t) => { const a = hexToRgb(h), b = hexToRgb(to); return rgbToHex(a.map((v, i) => v + (b[i] - v) * t)); };
const darker = h => mix(h, "#000000", 0.45);
const lighter = h => mix(h, "#ffffff", 0.45);

function line(x1, y1, x2, y2, w, color, outline) {
  const l = (ww, c) => `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" ` +
                       `stroke="${c}" stroke-width="${f1(ww)}" stroke-linecap="round"/>`;
  return (outline ? l(w + 5, outline) : "") + l(w, color);
}
const poly = (ps, fill, stroke, sw = 2.5) =>
  `<polygon points="${pts(ps)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;

// A fill for a part: its color, or a pattern of it.
// A pattern's tile is 14 units drawn at `size`, its marks in `markColor`
// ("auto": a lighter shade of the cloth's own color).
function webTile(c) {
  // eight threads out from the middle to the outer ring, and four rings
  // across them, each sagging a little toward the middle between threads;
  // the webs stop short of each other
  const ends = [[0, 0], [7, 0], [14, 0], [14, 7], [14, 14], [7, 14], [0, 14], [0, 7]];
  const at = ([x, y], k) => [7 + (x - 7) * k, 7 + (y - 7) * k];
  let d = ends.map(e => `M7 7 L${at(e, 0.95).map(f1).join(" ")}`).join(" ");
  for (const f of [0.3, 0.55, 0.78, 0.95]) {
    d += " M" + at(ends[0], f).map(f1).join(" ");
    for (let i = 1; i <= 8; i++) {
      const a = ends[i - 1], b = ends[i % 8], m = at([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], f * 0.9);
      d += ` Q${f1(m[0])} ${f1(m[1])} ${at(b, f).map(f1).join(" ")}`;
    }
  }
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="0.25"/>`;
}
// One spider web, as the Hazel slide draws it: eight straight threads out
// from (cx, cy), r long, and three rings across them, straight between
// threads, at 35%, 65% and 95% of the way out.
function spiderWeb(cx, cy, r, c) {
  const at = (f, i) => [cx + f * r * Math.cos(i * Math.PI / 4), cy + f * r * Math.sin(i * Math.PI / 4)];
  let d = [0, 1, 2, 3, 4, 5, 6, 7].map(i => `M${f1(cx)} ${f1(cy)} L${at(1, i).map(f1).join(" ")}`).join(" ");
  for (const f of [0.35, 0.65, 0.95])
    d += " M" + [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => at(f, i).map(f1).join(" ")).join(" L");
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function patternDef(id, color, kind, size = 14, markColor = "auto") {
  const lt = markColor === "auto" ? lighter(color) : markColor;
  const inner = {
    stripes: `<rect width="14" height="6" fill="${lt}"/>`,
    dots:    `<circle cx="7" cy="7" r="3" fill="${lt}"/>`,
    hearts:  `<text x="7" y="11" font-size="11" text-anchor="middle" fill="${lt}">♥</text>`,
    stars:   `<text x="7" y="11" font-size="11" text-anchor="middle" fill="${lt}">★</text>`,
    // a spider web: eight threads out from the middle, and three rings
    // across them, each sagging a little toward the middle between threads
    web:     webTile(lt),
  }[kind];
  if (!inner) return "";
  return `<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse" ` +
         `patternTransform="scale(${(size / 14).toFixed(3)})">` +

const PRESETS = [[220, 20, 60], [140, 190, 50], [170, 178, 186], [207, 160, 0]];
// A colour anywhere in the range of human skin, pale to very dark: an
// orange-ish hue, some colour but not a vivid one. Generous on purpose.
function isSkin([r, g, b]) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max < 20 || max === min) return false;
  const s = (max - min) / max;
  const h = max === r ? 60 * ((g - b) / (max - min)) : max === g ? 120 + 60 * ((b - r) / (max - min))
    : 240 + 60 * ((r - g) / (max - min));
  return h >= 3 && h <= 55 && s >= 0.12 && s <= 0.85;
}
// Which row of feelings: every skin tone has the everyday ones (the
// cartoon yellow's row), so a skin colour never changes the feeling; an
// unnatural colour (red, green, grey) has its own silly ones.
function family(hex) {
  // the witch's green has a row of its own: witchy, never sick
  if (hex.toLowerCase() === WITCH_SKIN) return 4;
  const [r, g, b] = hexToRgb(hex);
  if (isSkin([r, g, b])) return 3;
  const d = PRESETS.map(([pr, pg, pb]) => (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);
  return d.indexOf(Math.min(...d));
}

    ["sick", "relieved", "queasy", "grumpy"],
    ["curious", "puzzled", "scheming", "homesick"],
    ["happy", "worried", "determined", "sulky"],
    ["witchy", "spooked", "cackling", "hexed"],

}

  const forehead = upper * reach / (usual * 1.25);
  return Math.max(0, forehead - upper, eyeNeed(F, -1) - upper);
}
// ...and how far its bottom half grows: the eyes stay 8 inside the
// outline below them too (eyeNeed). A deep mouth may want more
// (mouthDrop); the head takes the larger of the two.
function headDrop(F) {
  const lower = 80 * (F.faceH / 100) * (1 + 0.25 * F.alien / 100);
  return Math.max(mouthDrop(F), eyeNeed(F, 1) - lower);
}
// The head's height as a stretch of the round head, for what is drawn
// over it (hair, a hood): the face height, and the top half's growth.
const headH = F => F.faceH / 100 + eyeLift(F) / 80;
function headPoints(F) {
  const W = headWidth(F), H = F.faceH / 100, a = F.alien / 100, pts = [], drop = headDrop(F), lift = eyeLift(F);
  for (let i = 0; i < 72; i++) {
    const t = i * Math.PI / 36, c = Math.cos(t), sn = Math.sin(t);
    const sx = c * (1 + a * (sn < 0 ? 0.12 : -0.85 * sn));
    const sy = sn * (1 + a * (sn > 0 ? 0.25 : 0.05));
    pts.push([100 + 80 * W * sx, HEAD_C + 80 * H * sy + (sn > 0 ? drop : lift) * sn]);

}
// Where the head's outline crosses the line y = Y: its left and right x.
function acrossAt(pts, Y) {
  const xs = [];
  pts.forEach(([x1, y1], i) => {
    const [x2, y2] = pts[(i + 1) % pts.length];
    if ((y1 - Y) * (y2 - Y) <= 0 && y1 !== y2) xs.push(x1 + (x2 - x1) * (Y - y1) / (y2 - y1));

const headChin = F => HEAD_C + 80 * (F.faceH / 100) * (1 + 0.25 * F.alien / 100) + headDrop(F);
const headCrown = F => HEAD_C - 80 * (F.faceH / 100) * (1 + 0.05 * F.alien / 100) - eyeLift(F);
// The head's stretch, for the hair: hair drawn for the round head is
// stretched the same way about the head's center.
const hairStretch = F =>
  `translate(100 ${HEAD_C}) scale(${(headWidth(F) * (1 + 0.12 * F.alien / 100)).toFixed(3)} ` +
  `${headH(F).toFixed(3)}) translate(-100 ${-HEAD_C})`;

// What sits on top of the head (hair, or a costume's hood) when the head
// explodes: it flies off with the lid, tilting as the lid does, and higher
// than the lid, more so the bigger the explosion, as if they were coming
// apart. (Empty when the head is whole.)
function topFlies(F) {
  const b = F.burst;

  const lift = idiv(b * 7, 10) + idiv(b * 4, 10), tilt = idiv(b, 4);

// (with parts, its three layers apart: what is under the eyes, the eyes,

// see-through on its own; see VISIBILITY)
function faceSvg(F, ground, parts = false) {
  const b = F.burst, k = F.candy, r = F.rays, o = F.open;
  const rayLen = r === 0 ? 0 : idiv((15 + idiv(r * 6, 10)) * b, 100);
  const shown = k * b >= 2500 ? 40 : idiv(k * b * 40, 2500);
  const lift = idiv(b * 7, 10), tilt = idiv(b, 4);
  const [upper, lower] = lips(F.smile, o);
  const LY = faceLayout(F);
  // The head, and when it explodes, split along a crack into a lid and
  // the rest: the same outline twice, clipped above and below the crack.
  const pts = headPoints(F);
  const d = "M" + pts.map(([x, y]) => f1(x) + " " + f1(y)).join(" L") + " Z";
  const crackY = HEAD_C - 50.6 * F.faceH / 100;
  const [xl, xr] = acrossAt(pts, crackY);
  const crack = CRACK.replace(/(-?[\d.]+) (-?[\d.]+)/g, (_, x, y) =>
    f1(xl + (Number(x) - 38) * (xr - xl) / 124) + " " + f1(crackY + Number(y) - 60));
  const part = (clip = "") => `<path d="${d}" fill="${F.color}" stroke="black" stroke-width="3"${clip}/>`;
  const clips = `<clipPath id="above-crack"><rect x="-2000" y="-4000" width="4200" height="${f1(4000 + crackY)}"/></clipPath>` +
                `<clipPath id="below-crack"><rect x="-2000" y="${f1(crackY)}" width="4200" height="4000"/></clipPath>`;
  // Eyes slant about their own middles, mirror images of each other:
  // tilt up and the outer corners rise, for almond alien eyes.
  const C = costumeOn(), kind = state.costume.kind;
  const hoodClips = C ? `<clipPath id="hood-brim"><rect x="-200" y="-400" width="600" height="454"/></clipPath>` +
                        `<clipPath id="hood-inside"><ellipse ${hoodEllipse(F)}/></clipPath>` : "";
  const under = `<defs>${clips}${hoodClips}</defs>` +
    (C ? `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${hoodBack(C, kind, F)}</g></g>` : "") +
    sideLines(F.sides) +
    (b > 0 ? part(' clip-path="url(#below-crack)"') : part()) +
    raysUp(rayLen, 3 + idiv(r, 25), crackY) +
    (b > 0 ? `<g transform="translate(0 ${-lift}) rotate(${-tilt} 100 ${f1(crackY)})">${part(' clip-path="url(#above-crack)"')}</g>` : "") +
    (C ? `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${hoodFront(C, kind, F)}</g></g>` : "") +
    pieces(shown, b, crackY) +
    (b > 0 ? `<path d="${crack}" fill="none" stroke="black" stroke-width="2"/>` : "");
  const eyes = `<g transform="translate(0 ${f1(LY.eyeY - 100)})">` +
      eye(100 - LY.eyeDX, F.eyes, F.stars, F.hearts, F.xeyes, F, F.tilt) +
      eye(100 + LY.eyeDX, F.eyes, F.stars, F.hearts, F.xeyes, F, -F.tilt) + `</g>`;
  const over = noseSvg(F) +
    // the brows spread with the eyes (their path's points, so the line
    // keeps its width)
    `<path d="${(F.unibrow ? browPath(F.brow) : browPair(F.brow)).replace(/(-?[\d.]+) (-?[\d.]+)/g, (_, x, y) =>
        f1(100 + (Number(x) - 100) * LY.bx) + " " + f1(Number(y) + LY.eyeY - 100 - browLift(F)))}" ` +
      `stroke="black" fill="none" stroke-width="${F.unibrow ? 7 : 6}" stroke-linecap="round"/>` +
    // the mouth, at its place and grown with the head
    `<g transform="translate(100 ${f1(LY.mouthY)}) scale(${LY.mx.toFixed(3)} ${LY.my.toFixed(3)}) translate(-100 -150)">` +
    mouthSvg(F, o, upper, lower) +
    sickPile(F.sick, 150 + idiv(lower - 150, 2), 150 + (ground - LY.mouthY) / LY.my) + `</g>`;
  return parts ? { under, eyes, over } : under + eyes + over;
}

// ===================== THE GHOST =====================
// A ghost, like the 👻 emoji but the friend's full size: a sheet over all
// of them, domed over the head, falling to a wavy hem just above the feet,
// its sleeves along the arms (as they are held) ending in round nubs; a
// few soft folds. Ragged (0 to 100): the hem's scallops turn into torn
// points of every length, and the edges fray. Its eyes where the friend's
// are, in the friend's own eye style (none, one in the middle, two, or a
// third in the middle of the forehead, like the three-eyed smiley on the
// poster for the movie Evolution), or, hidden, plain black holes as the
// emoji's; an "o" of a mouth. In body units; returns the sheet, the eyes
// and the mouth apart, for the visibility panel's parts.
const GHOST_COLORS = ["#f4f1ea", "#ffffff", "#e5e7eb", "#c4b5fd", "#a7f3d0", "#fde68a", "#fbcfe8", "#1f1f22"];
function ghostSvg(G, { F, tx, ty, s, w, L, feetY, arms, armW }) {
  const col = G.ghostColor || GHOST_COLORS[0], ln = darker(col), rag = Math.max(0, Math.min(1, (G.ghostRagged ?? 30) / 100));
  const rnd = (i, t) => { const v = Math.sin(i * 12.9898 + t * 78.233) * 43758.5453; return v - Math.floor(v); };
  const LY = faceLayout(F), at = (x, y) => [tx + x * s, ty + y * s];
  const [hcx, hcy] = at(100, HEAD_C), R = 80 * s * Math.max(headWidth(F) * (1 + 0.12 * F.alien / 100), headH(F)) + 14;
  const hemY = feetY - 8, half = Math.max(w + 45, R * 1.25), n = rag < 0.35 ? 5 : 4 + Math.round(3 * rag);
  // the outline: up the left side, over the dome, down the right side, then
  // the hem back from right to left in scallops (or torn points)
  const side = (sd, k) => { const pts = []; const top = hcy, bot = hemY - 4;
    for (let i = 0; i <= 8; i++) { const u = i / 8, y = top + (bot - top) * u, x = hcx + sd * (R + (half - R) * Math.pow(u, 1.4)) + sd * rag * 7 * (rnd(i + k, 3) - 0.5) * (u > 0.1 ? 1 : 0);
      pts.push([x, y]); }
    return pts; };
  const left = side(-1, 0).reverse(), right = side(1, 20);
  let d = `M${left.map(([x, y]) => f1(x) + " " + f1(y)).join(" L")} A${f1(R)} ${f1(R)} 0 0 1 ${f1(right[0][0])} ${f1(right[0][1])} L${right.slice(1).map(([x, y]) => f1(x) + " " + f1(y)).join(" L")}`;
  const x0 = right[right.length - 1][0], x1 = left[0][0], step = (x0 - x1) / n;
  for (let i = 1; i <= n; i++) {
    const a = x0 - (i - 1) * step, b = x0 - i * step, m = (a + b) / 2;
    // (smooth: round waves, as the emoji's; ragged: torn points, each its
    // own length and lean, longer the more ragged)
    if (rag < 0.35) d += ` Q${f1(m)} ${f1(hemY + 34 * (1 - rag))} ${f1(b)} ${f1(hemY - 4)}`;
    else { const deep = 20 + 50 * rag * (0.35 + 0.65 * rnd(i, 7)), lean = (rnd(i, 8) - 0.5) * step * 0.5, notch = i < n ? 10 + 22 * rag * rnd(i, 9) : 0;
      d += ` L${f1(m + lean)} ${f1(hemY + deep)} L${f1(b)} ${f1(hemY - 4 - notch)}`; }
  }
  d += " Z";
  // the sleeves, along the arms, behind the body, with round ends
  const sleeves = arms.map(({ A, H }) => `<line x1="${f1(A[0])}" y1="${f1(A[1])}" x2="${f1(H[0])}" y2="${f1(H[1])}" stroke="${ln}" stroke-width="${f1(armW + 30)}" stroke-linecap="round"/>` +
    `<line x1="${f1(A[0])}" y1="${f1(A[1])}" x2="${f1(H[0])}" y2="${f1(H[1])}" stroke="${col}" stroke-width="${f1(armW + 25)}" stroke-linecap="round"/>`).join("");
  // folds: soft lines down the sheet
  const folds = [-0.55, -0.15, 0.3, 0.62].map((u, i) => { const x = hcx + u * half * 0.8;
    return `<path d="M${f1(x)} ${f1(hcy + R * 0.6 + 20 * rnd(i, 5))} Q${f1(x + 14 * (rnd(i, 6) - 0.5))} ${f1((hcy + hemY) / 2)} ${f1(x + u * 18)} ${f1(hemY - 6)}" fill="none" stroke="${ln}" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>`; }).join("");
  const sheet = sleeves + `<path d="${d}" fill="${col}" stroke="${ln}" stroke-width="3" stroke-linejoin="round"/>` + folds;
  // the eyes: where the friend's are, in the friend's style, or black holes
  const count = Math.max(0, Math.min(3, Number(G.ghostEyes ?? 2))), hide = !!G.ghostHideEyes;
  const spots = count === 0 ? [] : count === 1 ? [[100, LY.eyeY]] : [[100 - LY.eyeDX, LY.eyeY], [100 + LY.eyeDX, LY.eyeY]];
  if (count === 3) spots.push([100, LY.eyeY - 2 * eyeHalfH(F) - 10]);
  const eyes = spots.map(([x, y], i) => hide
    ? `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(Math.max(7, eyeHalfW(F) * 0.7))}" ry="${f1(Math.max(10, eyeHalfH(F) * 1.05))}" fill="#1f1f22"/>`
    : `<g transform="translate(0 ${f1(y - 100)})">${eye(x, F.eyes, F.stars, F.hearts, F.xeyes, F, i === 1 && count > 1 ? -F.tilt : F.tilt)}</g>`).join("");
  const inFace = t => `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">${t}</g>`;
  const mouth = `<ellipse cx="100" cy="${f1(LY.mouthY - 4)}" rx="14" ry="19" fill="#1f1f22"/>`;
  return { sheet, eyes: inFace(eyes), mouth: inFace(mouth) };
}

// ===================== COSTUMES =====================
// An animal costume: a hood with the animal's face on its brim, above the
// wearer's own face, and either a full-body suit -- fur, paws, a belly and
// a tail -- or, for the falcon, wings worn on the back and a barred tail.
// Choosing an animal dresses it in its natural colors (see set()).
const ANIMALS = {
  tiger:  { suit: true,  fur: "#e8862a", marks: "#1f1a17", belly: "#f7ead8", eyes: "#e0a800", accent: "#e89aa0", furPattern: "stripes" },
  cat:    { suit: true,  fur: "#1f1f22", marks: "#3a3a40", belly: "#2e2e33", eyes: "#c6d43a", accent: "#f4a0b0", furPattern: "none" },
  lion:   { suit: true,  fur: "#d9a441", marks: "#8a4b1c", belly: "#f1d9a8", eyes: "#c88a1e", accent: "#5a3a2a", furPattern: "none" },
  bear:   { suit: true,  fur: "#6b4226", marks: "#4a2c17", belly: "#b08458", eyes: "#2b1a10", accent: "#1d1410", furPattern: "none" },
  falcon: { suit: false, fur: "#55616d", marks: "#23282e", belly: "#f2ece0", eyes: "#1a1410", accent: "#f2c230", furPattern: "none" },
  raccoon: { suit: true, fur: "#8d9096", marks: "#26262a", belly: "#e4e1da", eyes: "#3b2a1a", accent: "#26262a", furPattern: "none" },
  bobcat: { suit: true,  fur: "#c79a68", marks: "#4b3020", belly: "#f3e6cf", eyes: "#d9a520", accent: "#d98a8a", furPattern: "spots" },
  leopard: { suit: true, fur: "#e3b04b", marks: "#2b1d12", belly: "#f7ecd3", eyes: "#9bbf3a", accent: "#c97a7a", furPattern: "rosettes", spot: "auto" },
  eagle:  { suit: false, fur: "#4a3222", marks: "#2a1a10", belly: "#ffffff", eyes: "#f2c230", accent: "#f2b705", furPattern: "none" },
  // a black jaguar: nearly black, its rosettes just showing
  jaguar: { suit: true, fur: "#1e1c22", marks: "#3d3944", belly: "#2b2830", eyes: "#d4c23a", accent: "#3a363f", furPattern: "rosettes", spot: "auto" },
  cheetah: { suit: true, fur: "#e8b54a", marks: "#1c1410", belly: "#f8eed8", eyes: "#c88a1e", accent: "#2a1d14", furPattern: "spots" },
  // a grey wolf: tall pointed ears, a bushy tail with a dark tip, claws
  wolf: { suit: true, fur: "#8b8f97", marks: "#3f4249", belly: "#e8e6e1", eyes: "#e0a020", accent: "#1d1d1f", furPattern: "none" },
  // a deer, spotted like a fawn: antlers, long ears, a short white tail,
  // hooves
  deer: { suit: true, fur: "#a8682f", marks: "#fbf3e4", belly: "#f3e3c3", eyes: "#3b2414", accent: "#2a1a10", furPattern: "spots" },
  // a whole falcon suit: feathers all over, wings on the arms, talons
  falconsuit: { suit: true, fur: "#55616d", marks: "#23282e", belly: "#f2ece0", eyes: "#1a1410", accent: "#f2c230", furPattern: "none" },
  // and a bald eagle's: dark brown feathers, white head and tail
  eaglesuit: { suit: true, fur: "#4a3222", marks: "#2a1a10", belly: "#ffffff", eyes: "#f2c230", accent: "#f2b705", furPattern: "none" },
};
// cats (pointed ears, a triangle nose) and birds (no suit: wings and a tail)
const FELINE = { cat: 1, tiger: 1, bobcat: 1, leopard: 1, cheetah: 1, jaguar: 1 };
const BIRDS = { falcon: 1, eagle: 1, falconsuit: 1, eaglesuit: 1 };
// the bird suits: feathers all over, wings on the arms, talons
const BIRD_SUIT = { falconsuit: 1, eaglesuit: 1 };
// the bald eagle's head (hat or suit): white, with its beak
const eagleHead = kind => kind === "eagle" || kind === "eaglesuit";
const isBird = kind => !!BIRDS[kind];
// the falcon's head (hat or suit): its hood, moustache and face
const falconHead = kind => kind === "falcon" || kind === "falconsuit";
const lookOf = kind => { const { suit, ...look } = ANIMALS[kind]; return look; };
const costumeOn = () => (ANIMALS[state.costume.kind] ? state.costume : null);

// Fur: the fur color with little tufts, and stripes, spots or patches in
// the markings color. Feathers: the feather color with curved bars.
// A rosette's middle: "auto" is a warm brown mixed into the fur, "off"
// leaves the fur showing through (just the broken ring), or any color.
const rosetteMiddle = C =>
  !C.spot || C.spot === "auto" ? mix(C.fur, "#7a4a10", 0.35) : C.spot === "off" ? "none" : C.spot;
function furDefs(C, kind) {
  if (BIRD_SUIT[kind])   // feathers: the color with curved bars, all over
    return `<pattern id="pat-fur" width="24" height="12" patternUnits="userSpaceOnUse">` +
      `<rect width="24" height="12" fill="${C.fur}"/>` +
      `<path d="M0 9 Q6 6 12 9 Q18 12 24 9" stroke="${C.marks}" stroke-width="2.5" fill="none"/></pattern>` +
      `<pattern id="pat-bars" width="24" height="12" patternUnits="userSpaceOnUse">` +
      `<rect width="24" height="12" fill="${C.fur}"/>` +
      `<path d="M0 9 Q6 6 12 9 Q18 12 24 9" stroke="${C.marks}" stroke-width="2.5" fill="none"/></pattern>`;
  const tuft = mix(C.fur, "#000000", 0.3), m = C.marks;
  const marks = {
    // (stripes are not tiled: wrapStripes draws them on each part)
    spots:   `<circle cx="10" cy="10" r="4.5" fill="${m}"/><circle cx="30" cy="28" r="4" fill="${m}"/><circle cx="28" cy="8" r="2.5" fill="${m}"/>`,
    patches: `<ellipse cx="12" cy="14" rx="11" ry="8" fill="${m}"/><ellipse cx="34" cy="34" rx="9" ry="7" fill="${m}"/>`,
    // a leopard's rosettes: broken rings with a darker middle
    rosettes: [[11, 12, 5.5], [31, 30, 5]].map(([x, y, r]) =>
      `<circle cx="${x}" cy="${y}" r="${r}" fill="${rosetteMiddle(C)}" stroke="${m}" stroke-width="2.4" stroke-dasharray="5 2.6"/>`).join("") +
      `<circle cx="31" cy="9" r="2.2" fill="${m}"/><circle cx="9" cy="31" r="2" fill="${m}"/>`,
  }[C.furPattern] || "";
  return `<pattern id="pat-fur" width="40" height="40" patternUnits="userSpaceOnUse">` +
    `<rect width="40" height="40" fill="${C.fur}"/>${marks}` +
    `<path d="M5 22 q2 -4 4 0 M24 16 q2 -4 4 0 M14 36 q2 -4 4 0 M33 5 q2 -4 4 0" stroke="${tuft}" ` +
    `stroke-width="1.3" fill="none" opacity="0.7"/></pattern>` +
    `<pattern id="pat-bars" width="24" height="12" patternUnits="userSpaceOnUse">` +
    `<rect width="24" height="12" fill="${C.fur}"/>` +
    `<path d="M0 9 Q6 6 12 9 Q18 12 24 9" stroke="${m}" stroke-width="2.5" fill="none"/></pattern>`;
}

// WRAPPED STRIPES, a striped suit's (a tiger's, as Daniel Tiger wears
// them): each stripe comes round from the back, over a part's outline,
// and tapers to a point before the part's middle -- never across it.
const wrapStripes = C => C && C.furPattern === "stripes" && ANIMALS[state.costume.kind].suit &&
                         !BIRD_SUIT[state.costume.kind];
// One stripe from b (on or past the outline) to its tip t, w wide where it
// starts, bowed a little.
function stripe(b, t, w, color) {
  const dx = t[0] - b[0], dy = t[1] - b[1], d = Math.hypot(dx, dy) || 1;
  const nx = -dy / d * w / 2, ny = dx / d * w / 2, mx = (b[0] + t[0]) / 2, my = (b[1] + t[1]) / 2;
  return `<path d="M${f1(b[0] + nx)} ${f1(b[1] + ny)} Q${f1(mx + nx * 0.9)} ${f1(my + ny * 0.9)} ${f1(t[0])} ${f1(t[1])} ` +
         `Q${f1(mx - nx * 0.4)} ${f1(my - ny * 0.4)} ${f1(b[0] - nx)} ${f1(b[1] - ny)} Z" fill="${color}"/>`;
}
// Stripes on a limb, a band W wide from A to E: in from both edges every
// so often, from `from` along it, each ending short of the middle line by
// 15% of the half-width (a limb is narrow: shorter, they barely showed),
// and a little further along than it starts, so the two sides make a
// shallow V pointing down the limb.
function limbStripes(A, E, W, color, id, from = 0) {
  const dx = E[0] - A[0], dy = E[1] - A[1], len = Math.hypot(dx, dy);
  if (len < 1) return "";
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux, h = W / 2, gap = Math.max(18, W * 0.9);
  const at = (t, k) => [A[0] + ux * t + nx * k, A[1] + uy * t + ny * k];
  const band = [at(0, h), at(len, h), at(len, -h), at(0, -h)];
  let s = `<clipPath id="${id}"><polygon points="${pts(band)}"/></clipPath><g clip-path="url(#${id})">`;
  for (let t = from + gap * 0.6; t < len - gap * 0.4; t += gap)
    for (const side of [1, -1]) s += stripe(at(t, side * (h + 4)), at(t + gap * 0.2, side * h * 0.15), gap * 0.5, color);
  return s + `</g>`;
}
// Stripes on the body, in from both sides, every 24 down it, sloping a
// little down toward the middle; the belly, drawn over them, hides their
// tips, so they end before the middle.
function torsoStripes(outline, w, L, color) {
  let s = `<clipPath id="torso-stripes"><polygon points="${pts(outline)}"/></clipPath><g clip-path="url(#torso-stripes)">`;
  for (let y = 14; y < L - 10; y += 24)
    for (const side of [1, -1]) s += stripe([side * (w + 10), y], [side * w * 0.42, y + 7], 10, color);
  return s + `</g>`;
}
// Stripes on the legs (the suit's legs, one shape from the waist): on
// each leg, in from its outer edge and, below the crotch, its inner one,
// each ending short of the leg's middle line by 30% of the way.
function legStripes(outline, hw, fx, half, L, LL, crotch, color) {
  let s = `<clipPath id="leg-stripes"><polygon points="${pts(outline)}"/></clipPath><g clip-path="url(#leg-stripes)">`;
  for (let y = L + 14; y < L + LL - 8; y += 24)
    for (const side of [1, -1]) {

      const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.6 + len * 0.35, mx = tx + Math.cos(a) * len * 0.5, my = ty + Math.sin(a) * len * 0.7 - 10 * k;

    [[-1, -20], [-1, -38], [1, -26], [1, -46]].map(([e, yy]) => `<path d="M${e * 34} ${yy} L${e * 8} ${yy + 6}" stroke="#cfe8c0" stroke-width="3" stroke-linecap="round" opacity="0.9"/>`).join("") +
    `<ellipse cx="-10" cy="-50" rx="3" ry="5" fill="#cfe8c0"/><ellipse cx="12" cy="-36" rx="3" ry="5" fill="#cfe8c0"/></g>`;

    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len * 0.7, mx = x + Math.cos(a) * len * 0.6, my = y + Math.sin(a) * len - 10 * s;
    let fr = `<path d="M${P(x, y)} Q${P(mx, my)} ${P(ex, ey)}" fill="none" stroke="#2f7d32" stroke-width="${f1(2 * s)}"/>`;

      fr += `<ellipse cx="${f1(qx)}" cy="${f1(qy)}" rx="${f1(6 * s * (1 - u * 0.6))}" ry="${f1(2.2 * s)}" transform="rotate(${f1(a * 57.3 + 90)} ${f1(qx)} ${f1(qy)})" fill="${leaf[(f + j) % 5]}"/>`; }

  // a hibiscus bush: a mound of leaves, red and pink flowers with gold centers

         `<path d="M${P(x - 10 * k, y - 50 * k)} L${P(x, y - 90 * k)} L${P(x + 10 * k, y - 50 * k)} Z" fill="#ec4899"/><path d="M${P(x - 4 * k, y - 60 * k)} L${P(x + 14 * k, y - 82 * k)} L${P(x + 8 * k, y - 56 * k)} Z" fill="#f472b6"/>`;

  t += `<path d="M${P(-W * 0.2, floor + 190 * k)} h${f1(40 * k)} v${f1(-30 * k)} h${f1(-40 * k)} Z" fill="#5b8fb9"/><path d="M${P(-W * 0.2 + 40 * k, floor + 170 * k)} l${f1(30 * k)} ${f1(-20 * k)}" stroke="#5b8fb9" stroke-width="${f1(5 * k)}"/>` +

// the ways out of a room: the castle (out), and its other rooms; a trap
// room has its one doorway; a dungeon only its ladder up to the trap room
// the hallway's stretches, from its opening to its far end: few enough that
// the far end, the spiral stairs, stands above the friend's head
const HALL_STRETCHES = 4;
// the archway at the hallway's far end: its outline, and its box
function hallFarArch(c) {
  const { k } = c, { floor, top, bw, vy } = roomFrame(c), f = 1 / (1 + HALL_STRETCHES * 0.8), Y = y => vy + (y - vy) * f;
  const fl = Y(floor), tp = Y(top), x1 = bw * f * 0.55, x0 = -x1, r = x1, aTop = tp + (fl - tp) * 0.12;
  return { d: `M${P2(x0, fl)} V${f1(aTop + r)} A${f1(r)} ${f1(r)} 0 0 1 ${P2(x1, aTop + r)} V${f1(fl)} Z`, x0, x1, top: aTop, fl };
}
// A door in the hallway's side wall (sd: -1 left, 1 right), seen down the
// hallway in perspective, as a hand-painted adventure game draws one: its
// near and far edges at depths z0 and z1 along the wall (each at the
// cross-section 1 / (1 + z), as hallwaySvg's are), its arch rising between
// them, planks running up it, an iron ring; the hallway's dark over it, its
// sign above it facing us
// The cat room: a big, cozy wooden room for the castle's cats. Honey plank
// walls over dark wainscot, a beamed ceiling and a lantern, a stone
// fireplace with a fire (a portrait of a royal cat over its mantel), a
// window seat under the evening sky, two tall cat trees, shelves stepping up
// the side walls to a high walkway across the back, a rope bridge across the
// room, a big braided rug in the room's colors, and all a cat keeps: bowls,
// a basket, a box, yarn, a toy mouse, a feather on a string. Its cats are
// the castle's own (castleOf's cats), each where its setting puts it.
// The places in it, shared by the room's drawing and its cats': a point
// (X, Y) on the back wall's plane, brought z toward us (z < 0), as drawn
function catRoomPlaces(c) {
  const { k } = c, { floor, top, bw, vy } = roomFrame(c), wh = floor - top;
  const at = (X, Y, z = 0) => { const f = 1 / (1 + z); return [X * f, vy + (Y - vy) * f]; };
  const Yh = h => floor - h * wh, FX = -0.44 * bw, WX = 0.42 * bw, TX = 0.8 * bw;
  const spot = (X, Y, z, edge, span, lift = 0) => { const f = 1 / (1 + z), [x, y] = at(X, Y, z); return { x, y: y - lift * k * f, f, z, edge, span: span * f }; };
  // the rope bridge: across the room from wall to wall, sagging in the middle
  const BZ = -0.42, bf = 1 / (1 + BZ), [bxa, bya] = at(-bw, Yh(0.7), BZ), ymid = at(0, Yh(0.66), BZ)[1], byc = 2 * ymid - bya;
  const deck = u => [bxa * (1 - 2 * u), (1 - u) * (1 - u) * bya + 2 * u * (1 - u) * byc + u * u * bya];
  const [bx, by] = deck(0.31);
  const spots = {
    fire: spot(FX - 0.12 * bw, floor, -0.17, false, 0.08 * bw), treeL: spot(-TX, Yh(0.56), -0.02, true, 0.03 * bw),
    walkway: spot(0.3 * bw, Yh(0.84), -0.035, true, 0.3 * bw), window: spot(WX - 0.1 * bw, Yh(0.24), -0.05, true, 0.1 * bw),
    treeR: spot(TX, Yh(0.56), -0.02, true, 0.03 * bw), basket: spot(-0.7 * bw, floor, -0.3, false, 0.02 * bw, 9),
    shelfL: spot(-0.965 * bw, Yh(0.76), -0.25, true, 0.02 * bw), shelfR: spot(0.965 * bw, Yh(0.76), -0.25, true, 0.02 * bw),
    mantel: spot(FX + 0.13 * bw, Yh(0.36), -0.05, true, 0.06 * bw), rug: spot(0.42 * bw, floor, -0.3, false, 0.14 * bw),
    box: spot(0.55 * bw, floor, -0.45, false, 0.02 * bw, 12), bridge: { x: bx, y: by, f: bf, z: BZ - 0.001, edge: true, span: 0.05 * bw * bf } };
  // the bridge's drawing: rope rails, planks along the deck, ropes down to it

    let t = rail(-3 * kf, 3 * kf);
    for (let j = 0; j <= 40; j++) { const [x, y] = deck(j / 40), [xn, yn] = deck(Math.min(1, j / 40 + 0.012)), a = Math.atan2(yn - y, xn - x) * 180 / Math.PI;

    `<circle cx="${f1(x1 - W * 0.12)}" cy="${f1(y0 + H * 0.12)}" r="${f1(30 * k)}" fill="#fff6c8"/>`);
  // the high clouds, behind the peaks
  s += SEP + part("mt-clouds-high", [c.F, clouds], () => [...Array(Math.ceil(clouds / 2))].map((_, i) =>
    driftingCloud(x0 + W * (0.1 + 0.8 * R(i, 320)), y0 + H * (0.06 + 0.12 * R(i, 321)), k * (0.6 + 0.4 * R(i, 322)), i)).join(""));
  // the peaks, three ranges, far to near, snow on the far ones
  s += OPEN(`<g transform="translate(0 ${f1(valley)}) scale(1 ${peaks.toFixed(3)}) translate(0 ${f1(-valley)})">`) + part("mt-peaks", c.F, () => {
    let t = "";
    [[0, "#b6c6dc", 330, 9, true], [1, "#8ea3c0", 250, 7, true], [2, "#6d8296", 170, 6, false]].forEach(([r, fill, hgt, n, snow]) => {
      const base = valley + r * 12 * k, pts = [[x0 - pad, base]];
      for (let i = 0; i <= n; i++) {
        const x = x0 - 60 * k + (W + 120 * k) * i / n + 30 * k * (R(i + r * 10, 323) - 0.5);
        pts.push([x - (W / n) * 0.45, base - hgt * k * (0.35 + 0.3 * R(i + r * 10, 324))], [x, base - hgt * k * (0.75 + 0.25 * R(i + r * 10, 325))]);
      }
      pts.push([x1 + pad, base], [x1 + pad, base + 60 * k], [x0 - pad, base + 60 * k]);
      t += `<polygon points="${pts.map(([x, y]) => P2(x, y)).join(" ")}" fill="${fill}"/>`;
      if (snow) for (let i = 2; i < pts.length - 3; i += 2) {
        const [px, py] = pts[i], [lx, ly] = pts[i - 1], [rx, ry] = pts[i + 1];
        t += snowCap(px, py, lx, ly, rx, ry, 0.24 * (base - py), i + r * 20);
      }
    });
    return t;
  }) + CLOSE;
  // far below: a lake and a village by it (or not)
  if (lake) s += SEP + part("mt-lake", c.F, () => `<ellipse cx="${f1(W * 0.18)}" cy="${f1(valley + 22 * k)}" rx="${f1(120 * k)}" ry="${f1(14 * k)}" fill="#5aa9e0"/>` +
    `<ellipse cx="${f1(W * 0.18)}" cy="${f1(valley + 20 * k)}" rx="${f1(90 * k)}" ry="${f1(6 * k)}" fill="#bfe3f5" opacity="0.6"/>` +
    [...Array(7)].map((_, i) => { const x = W * 0.18 - 150 * k + i * 16 * k, y = valley + 18 * k + 6 * k * R(i, 326);
      return `<rect x="${f1(x)}" y="${f1(y - 7 * k)}" width="${f1(10 * k)}" height="${f1(7 * k)}" fill="#f4efe6"/><polygon points="${P2(x - 1 * k, y - 7 * k)} ${P2(x + 5 * k, y - 12 * k)} ${P2(x + 11 * k, y - 7 * k)}" fill="${["#c0392b", "#8a5a32", "#3b5ea8"][i % 3]}"/>`; }).join(""));
  // the low clouds, in front of the peaks
  s += SEP + part("mt-clouds-low", [c.F, clouds], () => [...Array(Math.floor(clouds / 2))].map((_, i) =>
    driftingCloud(x0 + W * (0.05 + 0.9 * R(i, 327)), valley - (40 + 90 * R(i, 328)) * k, k * (0.8 + 0.5 * R(i, 329)), i + 2)).join(""));
  // the near slope: grass, rocks, the trail winding off uphill
  s += SEP + part("mt-slope", c.F, () => {
    let t = `<defs>${PINE_DEF}</defs>` + land(valley + 40 * k, 14, "#8fb35a", 0.8) + land(g - 30 * k, 6, "#7aa34e", 1.6);
    const L = [], Rr = [];
    for (let i = 0; i <= 20; i++) {
      const u = i / 20, y = y1 + 10 * k - (y1 - valley - 50 * k) * u, x = W * 0.05 * Math.sin(u * 5) - W * 0.25 * u * u, w = (90 - 80 * u) * k;
      L.push(P2(x - w / 2, y)); Rr.push(P2(x + w / 2, y));
    }
    t += `<polygon points="${[...L, ...Rr.reverse()].join(" ")}" fill="#c9a774"/>`;
    for (let i = 0; i < 9; i++) {
      const x = side(i) * (W * 0.18 + W * 0.28 * R(i, 330)), y = g - 10 * k + 70 * k * R(i, 331), r = (12 + 20 * R(i, 332)) * k;
      t += rockSvg(x, y, r, 330 + i, ["#8a8a8a", "#9c9c9c", "#7a7a7a"][i % 3]) + grassTuft(x + r * 1.3, y + 2 * k, 14 * k, 340 + i, "#6f9a48", 1.8 * k);
    }
    for (let i = 0; i < 8; i++) t += use("bg-pine", side(i) * (W * 0.36 + W * 0.14 * R(i, 333)), g + 30 * k * R(i, 334), k * (0.9 + 0.5 * R(i, 335)), k * (0.9 + 0.5 * R(i, 335)),
      ` color="${["#2f6e3a", "#3a7d44", "#285e33"][i % 3]}"`);
    return t;
  });
  // the signpost by the trail: to the falls, and to the camp
  s += SEP + part("mt-sign", c.F, () => signpost(-W * 0.2, g + 10 * k, k, [["💦 falls", "waterfall", -1], ["🏕️ camp", "campsite", 1], ["🌲 woods", "woodpath", 1]]));
  // birds, circling high up
  s += SEP + part("mt-birds", [c.F, birds], () => [...Array(birds)].map((_, i) => {
    const cx = x0 + W * (0.2 + 0.6 * R(i, 336)), cy = y0 + H * (0.15 + 0.15 * R(i, 337)), rx = (50 + 40 * R(i, 338)) * k, ry = rx * 0.35;
    return `<path d="M${f1(-12 * k)} 0 Q${f1(-6 * k)} ${f1(-7 * k)} 0 0 Q${f1(6 * k)} ${f1(-7 * k)} ${f1(12 * k)} 0" fill="none" stroke="#333" stroke-width="${f1(2.5 * k)}">` +
           `<animateMotion path="M${P(cx - rx, cy)} A${f1(rx)} ${f1(ry)} 0 1 1 ${P(cx + rx, cy)} A${f1(rx)} ${f1(ry)} 0 1 1 ${P(cx - rx, cy)}" dur="${(9 + 5 * R(i, 339)).toFixed(1)}s" repeatCount="indefinite"/></path>`;
  }).join(""));
  return s;
}

// The jungle waterfall: a mossy cliff, the water falling (streaks running
// down it), a pool below with ripples, mist rising, big-leaved trees,
// vines swaying, parrots, flowers.
// The jungle waterfall's time of day (its own, so the cave behind it sees
// the same): day, or a tint over everything at sunset and at night, the
// moon out at night; and how fast its water falls (100 = the usual)
const FALL_TINT = { day: ["#ffffff", 0], sunset: ["#9a3412", 0.25], night: ["#0b1030", 0.55] };
const fallTimeOf = o => FALL_TINT[o.fallTime] ? o.fallTime : "day", fallRateOf = o => Math.max(0.1, (o.fallRate ?? 100) / 100);
function waterfallScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, land, o, side } = c;
  const fw = (o.fallWidth ?? 100) / 100, vines = o.vines ?? 8, mist = (o.mist ?? 60) / 100, parrots = o.parrots ?? 2, rate = fallRateOf(o), time = fallTimeOf(o);
  const top = y0 + H * 0.12, pool = g - 70 * k;
  let s = SEP + part("wf-back", c.F, () => {
    let t = `<defs>${grad("bg-sky", "#9fd8c8", "#e8fff4", y0, g)}</defs>` + all("url(#bg-sky)");
    // the far jungle: layers of leaf pads, a crown here and there standing up
    // out of them (the shared leafy tree)
    t += `<defs>${leafyTreeDef("bg-jungle-tree", 81, { wide: 1.3 })}</defs>`;
    for (const [row, fill, yb, n] of [[0, "#5f9a6a", y0 + H * 0.3, 16], [1, "#3f8050", y0 + H * 0.42, 14]])
      for (let i = 0; i < n; i++) {
        const x = x0 - 20 * k + (W + 40 * k) * i / (n - 1), r = (40 + 25 * R(i + row * 20, 340)) * k, y = yb + 10 * k * R(i, 341);
        t += `<rect x="${f1(x - r)}" y="${f1(y)}" width="${f1(2 * r)}" height="${f1(H)}" fill="${fill}"/>` +
             padSvg(Math.floor(R(i + row * 30, 342) * 8), x, y + r * 0.3, (r / 95) * (R(i, 343) < 0.5 ? -1 : 1), r / 70, fill) +
             padSvg(Math.floor(R(i + row * 30, 344) * 8), x + r * 0.3, y - r * 0.2, (r / 130), r / 90, mix(fill, "#ffffff", 0.08));
        if (R(i + row * 40, 345) < 0.25) t += use("bg-jungle-tree", x, y + r * 0.6, r * 3 / 330, r * 3 / 330, ` color="${fill}"`);
      }
    // the cliff, mossy, the falls' lip at its top
    t += `<path d="M${P(-W * 0.34, pool)} L${P(-W * 0.3, top + 40 * k)} Q${P(-W * 0.2, top - 10 * k)} ${P(-W * 0.06, top)} L${P(W * 0.08, top)} Q${P(W * 0.22, top - 12 * k)} ${P(W * 0.3, top + 30 * k)} L${P(W * 0.36, pool)} Z" fill="#6e6a62"/>`;
    for (let i = 0; i < 14; i++) {
      const x = -W * 0.3 + W * 0.62 * R(i, 342), y = top + 20 * k + (pool - top - 40 * k) * R(i, 343);
      t += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1((14 + 14 * R(i, 344)) * k)}" ry="${f1(7 * k)}" fill="${i % 2 ? "#4f8a3a" : "#5c5850"}" opacity="0.85"/>`;
    }
    return t;
  });
  // the falls: a sheet of water, streaks running down it, foam at the lip
  // (a doorway: behind them is a cave, unseen from here)
  s += SEP + `<g class="portal" data-to="cave">` + part("wf-falls", [c.F, fw, rate], () => {
    const half = 60 * fw * k;
    let t = `<defs><linearGradient id="bg-falls" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ad7f0"/><stop offset="0.5" stop-color="#e6f8ff"/><stop offset="1" stop-color="#9ad7f0"/></linearGradient></defs>` +
            `<path d="M${P(-half, top)} L${P(half, top)} L${P(half * 1.25, pool)} L${P(-half * 1.25, pool)} Z" fill="url(#bg-falls)" opacity="0.95"/>`;
    const n = Math.max(4, Math.round(10 * fw));
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n, xa = -half + 2 * half * u, xb = -half * 1.25 + 2.5 * half * u, dash = (30 + 30 * R(i, 345)) * k, gap = (20 + 20 * R(i, 346)) * k;
      t += `<line x1="${f1(xa)}" y1="${f1(top)}" x2="${f1(xb)}" y2="${f1(pool)}" stroke="#ffffff" stroke-width="${f1((2 + 3 * R(i, 347)) * k)}" stroke-dasharray="${f1(dash)} ${f1(gap)}" opacity="0.8">` +
           `<animate attributeName="stroke-dashoffset" values="0;${f1(-(dash + gap) * 2)}" dur="${((0.6 + 0.4 * R(i, 348)) / rate).toFixed(2)}s" repeatCount="indefinite"/></line>`;
    }
    return t + `<ellipse cx="0" cy="${f1(top)}" rx="${f1(half * 1.1)}" ry="${f1(6 * k)}" fill="#ffffff" opacity="0.9"/>`;
  }) + `</g>`;
  // the pool, ripples spreading
  s += SEP + part("wf-pool", c.F, () => land(pool + 30 * k, 6, "#5f8a3a", 0.3) +
    `<ellipse cx="0" cy="${f1(pool + 30 * k)}" rx="${f1(W * 0.42)}" ry="${f1(55 * k)}" fill="#3f9ad0"/>` +
    `<ellipse cx="0" cy="${f1(pool + 24 * k)}" rx="${f1(W * 0.34)}" ry="${f1(36 * k)}" fill="#62b6e4"/>` +
    [0, 1, 2].map(i => `<ellipse cx="0" cy="${f1(pool + 6 * k)}" rx="${f1(60 * k)}" ry="${f1(10 * k)}" fill="none" stroke="#ffffff" stroke-width="${f1(2 * k)}">` +
      `<animate attributeName="rx" values="${f1(40 * k)};${f1(200 * k)}" dur="2.4s" begin="${(i * 0.8).toFixed(1)}s" repeatCount="indefinite"/>` +
      `<animate attributeName="ry" values="${f1(6 * k)};${f1(30 * k)}" dur="2.4s" begin="${(i * 0.8).toFixed(1)}s" repeatCount="indefinite"/>` +
      `<animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="${(i * 0.8).toFixed(1)}s" repeatCount="indefinite"/></ellipse>`).join("") +
    land(g + 20 * k, 4, "#4f8a3a", 1.1));
  // the mist at the falls' foot, billowing (as much as the slider says)
  if (mist > 0) s += SEP + part("wf-mist", [c.F, mist], () => `<defs><filter id="bg-mist" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${f1(14 * k)}"/></filter></defs>` +
    `<g filter="url(#bg-mist)" pointer-events="none">` + [...Array(Math.round(3 + 6 * mist))].map((_, i) => {
      const x = (R(i, 349) - 0.5) * 220 * k, y = pool - (10 + 60 * R(i, 350)) * k, r = (40 + 40 * R(i, 351)) * k;
      return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r * 0.55)}" fill="#ffffff" opacity="${(0.25 + 0.35 * mist).toFixed(2)}">` +
             `<animate attributeName="cy" values="${f1(y)};${f1(y - 30 * k)};${f1(y)}" dur="${(4 + 3 * R(i, 352)).toFixed(1)}s" repeatCount="indefinite"/>` +
             `<animate attributeName="opacity" values="${(0.15 + 0.3 * mist).toFixed(2)};${(0.35 + 0.4 * mist).toFixed(2)};${(0.15 + 0.3 * mist).toFixed(2)}" dur="${(3 + 2 * R(i, 353)).toFixed(1)}s" repeatCount="indefinite"/></ellipse>`;
    }).join("") + `</g>`);
  // big-leaved jungle trees either side, flowers at their feet
  s += SEP + part("wf-trees", c.F, () => {
    let t = "";
    for (const sd of [-1, 1]) {
      const tx = sd * W * 0.43, tb = g + 60 * k, tt = y0 + H * 0.18;
      t += `<path d="M${P(tx - 22 * k, tb)} Q${P(tx - 10 * k, (tb + tt) / 2)} ${P(tx - sd * 20 * k, tt)} L${P(tx - sd * 4 * k, tt)} Q${P(tx + 14 * k, (tb + tt) / 2)} ${P(tx + 22 * k, tb)} Z" fill="#6b4a2b"/>`;
      for (let j = 0; j < 9; j++) {
        const a = (-160 + j * 40) * Math.PI / 180, l = (110 + 50 * R(j, 354)) * k, ex = tx - sd * 20 * k + Math.cos(a) * l, ey = tt + Math.sin(a) * l * 0.7 + 30 * k;
        t += `<path d="M${P(tx - sd * 14 * k, tt)} Q${P((tx - sd * 14 * k + ex) / 2 + 10 * k, (tt + ey) / 2 - 40 * k)} ${P(ex, ey)} Q${P((tx - sd * 14 * k + ex) / 2 - 10 * k, (tt + ey) / 2 + 10 * k)} ${P(tx - sd * 14 * k, tt)} Z" ` +
             `fill="${["#2e8b3a", "#3fa34a", "#24753a"][j % 3]}" stroke="#1d5a2a" stroke-width="${f1(1.5 * k)}"/>`;
      }
      for (let j = 0; j < 4; j++) {   // flowers by the trunk
        const fx = tx - sd * (30 + 40 * j) * k, fy = g + (30 + 10 * j) * k;
        t += [0, 72, 144, 216, 288].map(a => `<ellipse cx="${f1(fx)}" cy="${f1(fy - 8 * k)}" rx="${f1(4 * k)}" ry="${f1(9 * k)}" fill="${["#ff4f6d", "#ff8c1a", "#f2c12e", "#e85dbe"][j]}" transform="rotate(${a} ${f1(fx)} ${f1(fy)})"/>`).join("") +
             `<circle cx="${f1(fx)}" cy="${f1(fy)}" r="${f1(3.5 * k)}" fill="#ffd23f"/>`;
      }
    }
    return t;
  });
  // vines hanging from the top, swaying
  s += SEP + part("wf-vines", [c.F, vines], () => [...Array(vines)].map((_, i) => {
    const x = x0 + W * (0.04 + 0.92 * R(i, 355)), len = (120 + 220 * R(i, 356)) * k;
    let d = `M${P(x, y0 - 10 * k)}`, leaves = "";
    for (let j = 1; j <= 8; j++) {
      const y = y0 - 10 * k + len * j / 8, xx = x + 10 * k * Math.sin(j * 1.1 + i);
      d += ` L${P(xx, y)}`;
      leaves += `<ellipse cx="${f1(xx + (j % 2 ? 7 : -7) * k)}" cy="${f1(y)}" rx="${f1(7 * k)}" ry="${f1(3.5 * k)}" fill="#3fa34a" transform="rotate(${j % 2 ? 30 : -30} ${f1(xx)} ${f1(y)})"/>`;
    }
    return `<g><animateTransform attributeName="transform" type="rotate" values="-3 ${f1(x)} ${f1(y0)};3 ${f1(x)} ${f1(y0)};-3 ${f1(x)} ${f1(y0)}" dur="${(4 + 2 * R(i, 357)).toFixed(1)}s" repeatCount="indefinite"/>` +
           `<path d="${d}" fill="none" stroke="#3f7a2a" stroke-width="${f1(3 * k)}"/>${leaves}</g>`;
  }).join(""));
  // parrots on the branches
  s += SEP + part("wf-parrots", [c.F, parrots], () => [...Array(parrots)].map((_, i) => {
    const sd = i % 2 ? 1 : -1, x = sd * (W * 0.32 - 30 * k * Math.floor(i / 2)), y = y0 + H * (0.3 + 0.08 * Math.floor(i / 2)), f = sd < 0 ? 1 : -1;
    return `<g ${tf(x, y, k * f, k)}><path d="M-6 0 Q-14 22 -4 40 L4 40 Q10 20 6 0 Z" fill="${["#e53935", "#2e86de", "#27ae60"][i % 3]}"/>` +
           `<path d="M-4 38 L-8 66 L0 50 L6 68 L4 38 Z" fill="${["#2e86de", "#f2c12e", "#e53935"][i % 3]}"/>` +
           `<circle cx="2" cy="-4" r="9" fill="${["#e53935", "#2e86de", "#27ae60"][i % 3]}"/><circle cx="5" cy="-6" r="2.5" fill="#ffffff"/><circle cx="5.5" cy="-6" r="1.2" fill="#111"/>` +
           `<path d="M9 -6 Q18 -4 12 4 Q10 0 9 -2 Z" fill="#f2c12e"/><path d="M-6 8 Q-18 20 -10 34" fill="none" stroke="#f2c12e" stroke-width="4"/></g>`;
  }).join(""));
  // a sign back to the trail
  if (time !== "day") s += SEP + part("wf-tint", [c.F, time], () => all(FALL_TINT[time][0]).replace("<rect ", `<rect pointer-events="none" opacity="${FALL_TINT[time][1]}" `) +
    (time === "night" ? `<circle cx="${f1(-W * 0.32)}" cy="${f1(y0 + H * 0.12)}" r="${f1(26 * k)}" fill="#fff6d6" opacity="0.95"/><circle cx="${f1(-W * 0.32 + 10 * k)}" cy="${f1(y0 + H * 0.12 - 6 * k)}" r="${f1(22 * k)}" fill="#0b1030" opacity="0.35"/>` : ""));
  s += SEP + part("wf-sign", c.F, () => signpost(W * 0.3, g + 40 * k, k, [["⛰️ trail", "mountains", 1]]));
  return s;
}

// The camp site: day, sunset or night; tents round a campfire (on or out,
// its flames as big as the slider says, in a group that grows them),
// sparks, and on the fire nothing, veggie sausages on sticks, or a pot of
// soup hanging over it, steaming.
// the tents, in the order they are put up: where each stands (a share of
// the width), its color (the same inside, see tentScene) and its door's side
const CAMP_TENTS = [{ u: -0.32, color: "#e8762c", sd: 1, name: "🟧 orange" }, { u: 0.33, color: "#3b7dd8", sd: -1, name: "🟦 blue" },
                    { u: -0.12, color: "#27ae60", sd: 1, name: "🟩 green" }];
const CAMP_SKY = { day: ["#5aa9e6", "#dff2ff"], sunset: ["#3a2a6a", "#f2a65a"], night: ["#0b1030", "#24305a"] };
// Stars in a night sky, as the place's settings say: their shape (dots, or
// stars of four, five, six or eight points, or a mix of them), their size
// on average (many small, a few big; 100 = the usual, up to huge), their
// brightness on average (the brightest with a soft glow), and how much the
// big bright ones twinkle: turning a little, growing and shrinking,
// glimmering (and the small ones blink, more with more twinkle).
const STAR_SHAPES = [["dot", "• dots"], ["four", "✦ four points"], ["five", "★ five points"], ["six", "✶ six points"],
                     ["eight", "✴ eight points"], ["mix", "🎲 a mix"]];
const STAR_TINTS = ["#ffffff", "#fff4d6", "#e2ebff", "#fffbe8"];
// a star's outline about (0, 0), its points r out
function starPath(shape, r) {
  if (shape === "four") {   // a sparkle: four points, its sides curving in
    const c = 0.14 * r;
    return `M0 ${f1(-r)} Q${f1(c)} ${f1(-c)} ${f1(r)} 0 Q${f1(c)} ${f1(c)} 0 ${f1(r)} Q${f1(-c)} ${f1(c)} ${f1(-r)} 0 Q${f1(-c)} ${f1(-c)} 0 ${f1(-r)} Z`;
  }
  // five or six points; eight, the four between them shorter
  const n = { five: 5, six: 6, eight: 8 }[shape], inner = { five: 0.42, six: 0.48, eight: 0.26 }[shape], pts = [];
  for (let i = 0; i < 2 * n; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * inner : shape === "eight" && i % 4 === 2 ? r * 0.58 : r;
    pts.push(`${f1(rr * Math.cos(a))} ${f1(rr * Math.sin(a))}`);
  }
  return "M" + pts.join(" L") + " Z";
}
// n stars over the box (xa..xb, ya..yb), at the scene's scale k; R and the
// seed place them (each its own size, brightness, tint and shape)
function starsSvg(o, n, xa, xb, ya, yb, k, R, seed) {
  const pick = STAR_SHAPES.some(([v]) => v === o.starShape) ? o.starShape : "mix";
  const size = (o.starSize ?? 100) / 100, bright = (o.starBright ?? 85) / 100, tw = (o.starTwinkle ?? 40) / 100;
  let t = `<defs><radialGradient id="bg-star-glow"><stop offset="0" stop-color="#fffbe8" stop-opacity="0.6"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient></defs>`;
  for (let i = 0; i < n; i++) {
    const x = xa + (xb - xa) * R(i, seed), y = ya + (yb - ya) * R(i, seed + 1), u = R(i, seed + 2);
    const f = 0.4 + 2.4 * u * u * u, op = Math.max(0.08, Math.min(1, bright * (0.55 + 0.9 * R(i, seed + 3))));

  const fy = back + 8 * k, ny = y1 - 6 * k, [na] = out(xa, fy, ny), [nb] = out(xb, fy, ny);
  const flap = (u) => [xa + (na - xa) * u, xb + (nb - xb) * u, fy + (ny - fy) * u];
  const [fa, fb, fyy] = flap(0.3);
  return `<path d="M${f1(xa)} ${f1(fy)} Q${f1((xa + xb) / 2)} ${f1(fy - 10 * k)} ${f1(xb)} ${f1(fy)} L${f1(nb)} ${f1(ny)} Q${f1((na + nb) / 2)} ${f1(ny + 14 * k)} ${f1(na)} ${f1(ny)} Z" ` +
         `fill="${color}" stroke="${darker(color)}" stroke-width="${f1(2.5 * k)}" stroke-linejoin="round"/>` +
         // the top folded back, lighter, and the zip down its side
         `<path d="M${f1(xa)} ${f1(fy)} Q${f1((xa + xb) / 2)} ${f1(fy - 10 * k)} ${f1(xb)} ${f1(fy)} L${f1(fb)} ${f1(fyy)} Q${f1((fa + fb) / 2)} ${f1(fyy + 8 * k)} ${f1(fa)} ${f1(fyy)} Z" fill="${mix(color, "#ffffff", 0.35)}"/>` +
         `<line x1="${f1(fb)}" y1="${f1(fyy)}" x2="${f1(nb)}" y2="${f1(ny)}" stroke="#d8d8d8" stroke-width="${f1(1.5 * k)}" stroke-dasharray="${f1(3 * k)} ${f1(2 * k)}"/>` +
         // a pillow at its far end
         `<ellipse cx="${f1((xa + xb) / 2)}" cy="${f1(fy + 2 * k)}" rx="${f1(Math.abs(xb - xa) * 0.38)}" ry="${f1(11 * k)}" fill="#f4f1ea" stroke="#c9c4b8" stroke-width="${f1(1.5 * k)}"/>`;

// The cave behind the waterfall: rock all round, stalactites dripping,
// crystals glowing on the walls, glowworms twinkling on the roof, bats
// asleep upside down and an old chest; and at its mouth the falls seen
// from behind, as wide and as misty as the waterfall's own sliders make
// them, the light coming through: a doorway back out.
function caveScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, o } = c;
  const fw = (o.fallWidth ?? 100) / 100, mist = (o.mist ?? 60) / 100, rate = fallRateOf(o), time = fallTimeOf(o);
  const floor = g - 50 * k, mt = y0 + H * 0.1, mh = W * 0.24, cw = Math.min(mh, 70 * fw * k);
  const mouth = `M${P(-mh, floor)} L${P(-mh * 0.96, mt + 90 * k)} Q${P(-mh * 0.75, mt)} ${P(0, mt - 8 * k)} Q${P(mh * 0.75, mt)} ${P(mh * 0.96, mt + 90 * k)} L${P(mh, floor)} Z`;
  let s = SEP + part("cave-rock", c.F, () => {
    let t = all("#2a2630");
    for (let i = 0; i < 60; i++) {
      const x = x0 + W * R(i, 380), y = y0 + H * R(i, 381), r = (20 + 50 * R(i, 382)) * k;
      t += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r * 0.6)}" fill="${R(i, 383) < 0.5 ? "#35303c" : "#221e27"}" opacity="0.8"/>`;
    }
    return t;
  });
  // the mouth: the light outside, the jungle blurred beyond, the curtain
  // of water falling across it, mist at its foot
  s += SEP + part("cave-mouth", [c.F, fw, mist, rate, time], () => {
    // (the light outside, by the falls' time of day)
    const sky = { day: ["#effcff", "#a9dcc6"], sunset: ["#ffe0b0", "#e8946a"], night: ["#4a5c88", "#1c2742"] }[time];
    let t = `<defs><clipPath id="bg-cave-mouth"><path d="${mouth}"/></clipPath>${grad("bg-cave-light", sky[0], sky[1], mt, floor)}` +
            `<linearGradient id="bg-cave-water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ad7f0"/><stop offset="0.5" stop-color="#e6f8ff"/><stop offset="1" stop-color="#9ad7f0"/></linearGradient>` +
            `<filter id="bg-cave-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${f1(10 * k)}"/></filter></defs>` +
            `<g class="portal" data-to="waterfall"><g clip-path="url(#bg-cave-mouth)">` +
            `<rect x="${f1(-mh)}" y="${f1(mt - 20 * k)}" width="${f1(2 * mh)}" height="${f1(floor - mt + 20 * k)}" fill="url(#bg-cave-light)"/>` +
            `<g filter="url(#bg-cave-blur)" opacity="0.6">` + [...Array(8)].map((_, i) => `<circle cx="${f1((R(i, 384) - 0.5) * 2 * mh)}" cy="${f1(mt + (floor - mt) * (0.2 + 0.6 * R(i, 385)))}" r="${f1((30 + 30 * R(i, 386)) * k)}" fill="${i % 2 ? "#3f8050" : "#5f9a6a"}"/>`).join("") + `</g>` +
            `<rect x="${f1(-mh)}" y="${f1(floor - 30 * k)}" width="${f1(2 * mh)}" height="${f1(30 * k)}" fill="#62b6e4" opacity="0.7"/>` +
            `<path d="M${P(-cw, mt - 20 * k)} L${P(cw, mt - 20 * k)} L${P(cw * 1.15, floor)} L${P(-cw * 1.15, floor)} Z" fill="url(#bg-cave-water)" opacity="0.85"/>`;
    const n = Math.max(4, Math.round(10 * fw));
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n, xa = -cw + 2 * cw * u, xb = -cw * 1.15 + 2.3 * cw * u, dash = (30 + 30 * R(i, 387)) * k, gap = (20 + 20 * R(i, 388)) * k;
      t += `<line x1="${f1(xa)}" y1="${f1(mt - 20 * k)}" x2="${f1(xb)}" y2="${f1(floor)}" stroke="#ffffff" stroke-width="${f1((2 + 3 * R(i, 389)) * k)}" stroke-dasharray="${f1(dash)} ${f1(gap)}" opacity="0.75">` +
           `<animate attributeName="stroke-dashoffset" values="0;${f1(-(dash + gap) * 2)}" dur="${((0.6 + 0.4 * R(i, 390)) / rate).toFixed(2)}s" repeatCount="indefinite"/></line>`;
    }
    if (mist > 0) t += `<g filter="url(#bg-cave-blur)">` + [...Array(Math.round(2 + 5 * mist))].map((_, i) => {
      const x = (R(i, 391) - 0.5) * 2 * mh, y = floor - (10 + 30 * R(i, 392)) * k, r = (30 + 30 * R(i, 393)) * k;
      return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r * 0.5)}" fill="#ffffff" opacity="${(0.25 + 0.4 * mist).toFixed(2)}">` +
             `<animate attributeName="cy" values="${f1(y)};${f1(y - 20 * k)};${f1(y)}" dur="${(4 + 3 * R(i, 394)).toFixed(1)}s" repeatCount="indefinite"/></ellipse>`;

      `<rect x="${f1(-mh)}" y="${f1(mt - 20 * k)}" width="${f1(2 * mh)}" height="${f1(floor - mt + 20 * k)}" fill="${FALL_TINT[time][0]}" opacity="${FALL_TINT[time][1]}" pointer-events="none"/>`;
    return t + `</g><path d="${mouth}" fill="none" stroke="#1a171f" stroke-width="${f1(8 * k)}" stroke-linejoin="round"/></g>`;

  // the light falling in through the water, the floor, wet by the mouth

    let t = `<path d="M${P(x0 - pad, floor + 10 * k)} Q${P(-W * 0.3, floor - 6 * k)} ${P(-mh, floor)} L${P(mh, floor)} Q${P(W * 0.3, floor - 6 * k)} ${P(x1 + pad, floor + 10 * k)} L${P(x1 + pad, y1 + pad)} L${P(x0 - pad, y1 + pad)} Z" fill="#3b3542"/>` +
            `<ellipse cx="0" cy="${f1(floor + 26 * k)}" rx="${f1(mh * 1.3)}" ry="${f1(22 * k)}" fill="#7fa3bd" opacity="0.25"/>`;
    for (let i = 0; i < 3; i++)
      t += `<polygon points="${P2(-cw * (0.8 - 0.6 * i), mt + 120 * k)} ${P2(-cw * (0.5 - 0.6 * i), mt + 120 * k)} ${P2(-W * (0.18 - 0.2 * i), y1 + pad)} ${P2(-W * (0.3 - 0.2 * i), y1 + pad)}" fill="#d8f4ff" opacity="0.08" pointer-events="none"/>`;
    for (let i = 0; i < 24; i++) {
      const x = x0 + W * R(i, 395), y = floor + 20 * k + (y1 - floor) * R(i, 396), r = (4 + 10 * R(i, 397)) * k;
      t += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r * 0.55)}" fill="${["#4a4452", "#2e2934", "#57505f"][i % 3]}"/>`;

    for (const [u, h, w] of [[-0.44, 90, 30], [-0.36, 50, 20], [0.4, 110, 34], [0.47, 60, 22]]) {

      t += `<path d="M${P(x - w * k, b)} Q${P(x - w * 0.3 * k, b - h * 0.6 * k)} ${P(x, b - h * k)} Q${P(x + w * 0.3 * k, b - h * 0.6 * k)} ${P(x + w * k, b)} Z" fill="#4a4352" stroke="#2a2630" stroke-width="${f1(2 * k)}"/>`;

  s += SEP + part("cave-roof", c.F, () => {
    let t = "";
    for (let i = 0; i < 16; i++) {
      const x = x0 + W * (i + 0.2 + 0.6 * R(i, 398)) / 16, len = (30 + 90 * R(i, 399)) * k, w = (10 + 16 * R(i, 400)) * k;
      if (Math.abs(x) < mh * 0.8) continue;
      t += `<path d="M${P(x - w, y0 - 20 * k)} L${P(x + w, y0 - 20 * k)} Q${P(x + w * 0.3, y0 + len * 0.6)} ${P(x, y0 + len)} Q${P(x - w * 0.3, y0 + len * 0.6)} ${P(x - w, y0 - 20 * k)} Z" fill="#4a4352"/>` +
           `<path d="M${P(x - w * 0.5, y0)} Q${P(x - w * 0.2, y0 + len * 0.6)} ${P(x, y0 + len)}" fill="none" stroke="#6a6274" stroke-width="${f1(2 * k)}"/>`;
      if (i % 5 === 1) t += `<circle cx="${f1(x)}" cy="${f1(y0 + len)}" r="${f1(2.5 * k)}" fill="#9ad7f0"><animate attributeName="cy" values="${f1(y0 + len)};${f1(floor + 20 * k)}" dur="1.2s" begin="${(i * 0.7).toFixed(1)}s" repeatCount="indefinite"/>` +
                            `<animate attributeName="opacity" values="1;1;0" dur="1.2s" begin="${(i * 0.7).toFixed(1)}s" repeatCount="indefinite"/></circle>`;
    }
    for (let i = 0; i < 40; i++) {
      const x = x0 + W * R(i, 401), y = y0 + H * 0.28 * R(i, 402);
      if (Math.abs(x) < mh && y > mt) continue;
      t += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1.6 * k)}" fill="#7dfcd2"${i % 3 ? "" : `><animate attributeName="opacity" values="1;0.2;1" dur="${(1.5 + 2 * R(i, 403)).toFixed(1)}s" repeatCount="indefinite"/></circle`}${i % 3 ? "/>" : ">"}`;
    }

  // gems all over the walls (not across the mouth, or on the floor), each
  // with its sparkle, drawn as the night sky's stars are and set the same
  // way (gemShape, gemSize, gemBright, gemTwinkle); and sparkles on the crystals

  s += SEP + part("cave-gems", [c.F, gems, o.gemShape, o.gemSize, o.gemBright, o.gemTwinkle], () => {
    let t = "", i = 0;
    for (let j = 0; i < gems && j < gems * 12; j++) {
