<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messed Up Dress Up</title>
<style>
  :root { --ink: #222; --muted: #666; --line: #d6d6d6; --paper: #fffdf7; --bg: #f3f0ff;
          --panel: #ffffff; --accent: #7c3aed; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #aaa; --line: #444; --paper: #fffdf7; --bg: #1d1a26;
            --panel: #29253a; --accent: #a78bfa; --accent-ink: #1d1a26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; }
  /* over the picture, centered on it (at the window's edge it hung far out
     to the left of a picture centered in its column) */
  h1 { margin: 0 0 10px; font-size: 1.6em; letter-spacing: 0.02em; text-align: center; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px;
         max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: sticky; top: 8px; align-self: start; }
  /* The picture, its caption and buttons always fit on the screen, so the
     picture stays in view while the controls scroll. */
  svg#pic { display: block; width: 100%; height: auto;
            max-height: calc(100vh - 195px); max-height: calc(100dvh - 195px);
            background: var(--paper); border-radius: 18px; border: 2px solid var(--line);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .caption { text-align: center; margin-top: 6px; font-size: 1.2em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 2px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 6px 12px; }
  button.big { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
               font-weight: 600; padding: 8px 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tabs button { font-weight: 600; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .panel { background: var(--panel); border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); }
  .ctl { margin: 10px 0; }
  .ctl > .lbl { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .ctl > .lbl .val { color: var(--muted); font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid var(--line); }
  .swatch[aria-pressed=true] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .swatch.skin { font-size: 0.6em; }
  input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); }
  input[type=color] { width: 40px; height: 34px; border: none; padding: 0; background: none; }
  .hint { color: var(--muted); font-size: 0.9em; }
  svg.pad { width: 140px; height: 140px; display: block; touch-action: none; cursor: crosshair;
            border-radius: 14px; border: 2px solid var(--line); }
  /* On a phone the controls are below the picture, so the picture is
     kept small and pinned at the top: a change shows while you make it. */
  @media (max-width: 760px) {
    body { padding-top: 8px; }
    h1 { display: none; }
    .stage { top: 0; z-index: 1; background: var(--bg); padding: 4px 0 8px; margin: 0 -16px; padding-inline: 16px; }
    svg#pic { max-height: 40vh; max-height: 40dvh; }
    .stage .hint { display: none; }
    .actions { margin-top: 4px; gap: 6px; flex-wrap: nowrap; }
    .actions button { padding: 4px 8px; font-size: 0.85em; white-space: nowrap; }
    .caption { margin-top: 2px; font-size: 1em; }
  }
  .formats { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center;
             margin-top: 8px; font-size: 13px; color: var(--muted); }
  .formats label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .saved { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .saved a { color: inherit; font-weight: 600; margin: 0 4px; }
  /* Full screen: the button at the picture's top right fills the window
     with the picture, the controls hidden; again (an X then) or Escape
     brings them back. */
  .pic-wrap { position: relative; }
  .max-btn { position: absolute; top: 8px; right: 8px; padding: 0 9px; font-size: 1.3em; line-height: 1.45;
             background: var(--panel); opacity: 0.9; }
  body.big { overflow: hidden; }
  /* (the sticky stage is its own stacking context: raised, or the panel's
     half-faded pins, each a layer of its own, paint over the full screen) */
  body.big .stage { z-index: 20; }
  body.big .app > :not(.stage) { visibility: hidden; }
  body.big .pic-wrap { position: fixed; inset: 0; z-index: 10; background: var(--bg); padding: 8px;
                      display: flex; flex-direction: column; gap: 8px; }
  body.big svg#pic { width: 100%; height: 0; flex: 1 1 auto; max-height: none; }
  body.big .max-btn { top: 16px; right: 16px; }
  /* In full screen, a heads-up display of chosen controls: hidden until
     its button is pressed; the scene's own controls and every pinned slider. */
  .hud-btn { display: none; position: absolute; top: 16px; right: 66px; padding: 0 9px; font-size: 1.3em;
             line-height: 1.45; background: var(--panel); opacity: 0.9; }
  body.big .hud-btn { display: block; }
  /* (below the picture, which shrinks to make room: it never covers the
     figure or its face) */
  .hud { flex: 0 0 auto; max-height: 40vh; overflow: auto; border-radius: 14px;
         display: flex; flex-wrap: wrap; gap: 0 18px; padding: 6px 16px 10px;
         background: rgba(24, 20, 36, 0.86); color: #fff; }
  .hud[hidden] { display: none; }
  .hud .ctl { flex: 1 1 220px; margin: 6px 0; }
  .hud .ctl > .lbl .val { color: #ddd; }
  .hud .empty { color: #ddd; padding: 8px 0; }
  .pin { border: none; background: none; padding: 0; margin-right: 6px; font-size: 0.85em; opacity: 0.3;
         cursor: pointer; vertical-align: baseline; }
  .pin[aria-pressed=true] { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <h1>Messed Up Dress Up</h1>
    <div class="pic-wrap">
      <svg id="pic" xmlns="http://www.w3.org/2000/svg"></svg>
      <button class="max-btn" id="max" title="Full screen" aria-label="Full screen">⤢</button>
      <button class="hud-btn" id="hud-btn" title="Show the pinned controls" aria-label="Show the pinned controls" aria-pressed="false">🎛️</button>
      <div class="hud" id="hud" hidden></div>
    </div>
    <div class="caption" id="mood"></div>
    <div class="actions">
      <button class="big" id="surprise">🎲 Surprise me!</button>
      <button id="save" title="Saves the files checked below: a picture (.png), a drawing that prints at any size (.svg), and your friend's settings (.json) to load again later">💾 Save</button>
      <button id="load" title="Load a friend you saved (.json)">📂 Load</button>
      <input type="file" id="load-file" accept=".json,application/json" hidden>
      <button id="reset">↺ Start over</button>
    </div>
    <div class="formats" id="formats">
      <span id="formats-label">save as:</span>
      <label><input type="checkbox" value="png" checked> picture (.png)</label>
      <label><input type="checkbox" value="svg" checked> drawing (.svg)</label>
      <label><input type="checkbox" value="json" checked> settings (.json)</label>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
    <p class="hint" style="text-align:center">Drag the mouth or the eyebrows on the face, too!</p>
  </div>
  <div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
"use strict";

// ===================== STATE =====================

const DEFAULTS = {
  face:  { color: "#cfa000", size: 46, smile: 85, brow: 30, sick: 0, burst: 0, candy: 0,
           stars: false, hearts: false, xeyes: false, unibrow: true, eyes: 50, sides: 0,
           rays: 0, teeth: 5, open: 0, teethStyle: "normal",
           tongue: "in", tongueLen: 100, tongueW: 100, tongueColor: "#e75480",
           lightX: -0.6, lightY: -0.6, shine: "#ffffff", shineMix: 100, shineSize: 45,
           pupil: "#000000", iris: 0, irisColor: "#3b82f6", whites: 0, oval: 0, tilt: 0,
           faceW: 100, faceH: 100, alien: 0, eyeGap: 38, noseView: "none", nose: "L", noseFront: "round", noseW: 100, noseH: 100,
           witchDir: "right", witchLen: 100, mouthSize: 100 },
  hair:  { style: "long", color: "#2b2b2b", length: 100 },
  body:  { neck: 22, neckW: 26, arms: 55, armLen: 95, armW: 16, legLen: 140, legW: 20 },
  shirt: { style: "tee", collar: "v", width: 60, length: 150, color: "#5b8bd0", pattern: "plain",
           patternSize: 14, patternColor: "auto" },
  hands: { style: "round", leftStyle: "same", size: 14, color: "skin", fingers: 5, alienFingers: 3, clawLen: 100, clawCount: 4, starPoints: 5, starAngle: 0,
           mittenAngle: 0, clawAngle: 0, humanAngle: 0, alienAngle: 0 },
  pants: { style: "long", color: "#34495e", pattern: "plain", patternSize: 14, patternColor: "auto", skirtLen: 50 },
  undies: { on: false, style: "trunks", top: false, color: "#3b82f6", pattern: "plain", patternSize: 14,
            patternColor: "auto" },
  shoes: { style: "sneaker", size: 100, color: "#c0392b" },
  // the figure's size and place in a background scene (dragged there)
  background: { kind: "none", figSize: 100, figX: 0, figY: 0 },
  // the sliders pinned to the full-screen controls, as "part.key"
  hud: { pins: [] },
  costume: { kind: "none", fur: "#e8862a", marks: "#1f1a17", belly: "#f7ead8", eyes: "#e0a800",
             accent: "#e89aa0", furPattern: "stripes", spot: "auto",
             witchColor: "#6a2c91", webColor: "#3fae4a", trimColor: "#f28c28", witchCat: false, broom: false,
             catFur: "#1f1f22", catWhite: "#ffffff", catEyes: "#c6d43a", catNose: "#f4a0b0", catSize: 100, broomSize: 100, bootColor: "#1f1f22" },
};
const clone = o => JSON.parse(JSON.stringify(o));
// before the nose views: a nose was a shape (or "none"), a direction and
// one size
function upgradeFace(f, saved) {
  // before the teeth choice, teeth were the spikes, and 0 meant none
  if (saved && saved.teethStyle === undefined && saved.teeth !== undefined)
    f.teethStyle = saved.teeth > 0 ? "spikes" : "normal";
  if (!saved || saved.noseView !== undefined || saved.nose === undefined) return;
  f.noseView = saved.nose === "none" ? "none"
             : saved.noseDir === "left" ? "left" : saved.noseDir === "center" ? "front" : "right";
  f.nose = saved.nose === "none" ? "L" : saved.nose;
  f.noseFront = saved.nose === "angle" ? "pointed" : "round";
  if (saved.noseSize !== undefined) f.noseW = f.noseH = saved.noseSize;
}
// before the alien finger slider there were two alien styles
function upgradeHands(h) {
  if (h.style === "alien4" || h.style === "alien3") { h.alienFingers = h.style === "alien4" ? 4 : 3; h.style = "alien"; }
}
let state = clone(DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem("dress-up-v1") || "null");
  if (saved) for (const k of Object.keys(DEFAULTS)) state[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
  upgradeHands(state.hands);
  upgradeFace(state.face, saved.face);
  // pants length moved to the legs (leg length)
  if (saved && saved.pants && saved.pants.length && !(saved.body && saved.body.legLen))
    state.body.legLen = saved.pants.length;
} catch (_) { /* no storage: start fresh */ }
function persist() { try { localStorage.setItem("dress-up-v1", JSON.stringify(state)); } catch (_) {} }

// ===================== HELPERS =====================

const idiv = (a, b) => Math.trunc(a / b);           // Hazel's Int division
const mod = (a, n) => a - idiv(a, n) * n;
const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));
const f1 = x => (Math.round(x * 10) / 10).toString();
const pts = ps => ps.map(([x, y]) => f1(x) + "," + f1(y)).join(" ");
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbToHex([r, g, b]) { return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join(""); }
const mix = (h, to, t) => { const a = hexToRgb(h), b = hexToRgb(to); return rgbToHex(a.map((v, i) => v + (b[i] - v) * t)); };
const darker = h => mix(h, "#000000", 0.45);
const lighter = h => mix(h, "#ffffff", 0.45);

function line(x1, y1, x2, y2, w, color, outline) {
  const l = (ww, c) => `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" ` +
                       `stroke="${c}" stroke-width="${f1(ww)}" stroke-linecap="round"/>`;
  return (outline ? l(w + 5, outline) : "") + l(w, color);
}
const poly = (ps, fill, stroke, sw = 2.5) =>
  `<polygon points="${pts(ps)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;

// A fill for a part: its color, or a pattern of it.
// A pattern's tile is 14 units drawn at `size`, its marks in `markColor`
// ("auto": a lighter shade of the cloth's own color).
function webTile(c) {
  // eight threads out from the middle to the outer ring, and four rings
  // across them, each sagging a little toward the middle between threads;
  // the webs stop short of each other
  const ends = [[0, 0], [7, 0], [14, 0], [14, 7], [14, 14], [7, 14], [0, 14], [0, 7]];
  const at = ([x, y], k) => [7 + (x - 7) * k, 7 + (y - 7) * k];
  let d = ends.map(e => `M7 7 L${at(e, 0.95).map(f1).join(" ")}`).join(" ");
  for (const f of [0.3, 0.55, 0.78, 0.95]) {
    d += " M" + at(ends[0], f).map(f1).join(" ");
    for (let i = 1; i <= 8; i++) {
      const a = ends[i - 1], b = ends[i % 8], m = at([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], f * 0.9);
      d += ` Q${f1(m[0])} ${f1(m[1])} ${at(b, f).map(f1).join(" ")}`;
    }
  }
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="0.25"/>`;
}
function patternDef(id, color, kind, size = 14, markColor = "auto") {
  const lt = markColor === "auto" ? lighter(color) : markColor;
  const inner = {
    stripes: `<rect width="14" height="6" fill="${lt}"/>`,
    dots:    `<circle cx="7" cy="7" r="3" fill="${lt}"/>`,
    hearts:  `<text x="7" y="11" font-size="11" text-anchor="middle" fill="${lt}">♥</text>`,
    stars:   `<text x="7" y="11" font-size="11" text-anchor="middle" fill="${lt}">★</text>`,
    // a spider web: eight threads out from the middle, and three rings
    // across them, each sagging a little toward the middle between threads
    web:     webTile(lt),
  }[kind];
  if (!inner) return "";
  return `<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse" ` +
         `patternTransform="scale(${(size / 14).toFixed(3)})">` +
         `<rect width="14" height="14" fill="${color}"/>${inner}</pattern>`;
}
const fillOf = (id, color, kind) => (kind === "plain" ? color : `url(#${id})`);

// ===================== THE FACE (Kids' Choice, ported) =====================
// Drawn in its own units: 0..200 across, the head a circle of radius 80
// centered at (100, 110.6), its chin at (100, 190.6).

const PRESETS = [[220, 20, 60], [140, 190, 50], [170, 178, 186], [207, 160, 0]];
// A colour anywhere in the range of human skin, pale to very dark: an
// orange-ish hue, some colour but not a vivid one. Generous on purpose.
function isSkin([r, g, b]) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max < 20 || max === min) return false;
  const s = (max - min) / max;
  const h = max === r ? 60 * ((g - b) / (max - min)) : max === g ? 120 + 60 * ((b - r) / (max - min))
    : 240 + 60 * ((r - g) / (max - min));
  return h >= 3 && h <= 55 && s >= 0.12 && s <= 0.85;
}
// Which row of feelings: every skin tone has the everyday ones (the
// cartoon yellow's row), so a skin colour never changes the feeling; an
// unnatural colour (red, green, grey) has its own silly ones.
function family(hex) {
  // the witch's green has a row of its own: witchy, never sick
  if (hex.toLowerCase() === WITCH_SKIN) return 4;
  const [r, g, b] = hexToRgb(hex);
  if (isSkin([r, g, b])) return 3;
  const d = PRESETS.map(([pr, pg, pb]) => (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);
  return d.indexOf(Math.min(...d));
}
function mood(f, brow, smile) {
  const up = brow < 50, smiling = smile >= 50;
  const table = [
    ["disgusted", "shocked", "mischievous", "angry"],
    ["sick", "relieved", "queasy", "grumpy"],
    ["curious", "puzzled", "scheming", "homesick"],
    ["happy", "worried", "determined", "sulky"],
    ["witchy", "spooked", "cackling", "hexed"],
  ][f];
  return table[(up ? 0 : 2) + (smiling ? 0 : 1)];
}

const mouthPath = v => `M60 150 Q100 ${110 + idiv(4 * v, 5)} 140 150`;
// The lips' two control points (the mouth's top and bottom curves), for a
// smile v and an opening o. Closed, both are the smile's own curve. A smile
// (or a flat mouth) opens like a D: its top flattens to a straight line and
// stops there, and its bottom drops deeper the more it opens. A frown opens
// the other way up: the bottom flattens and the top rises.
function lips(v, o) {
  const q = 110 + idiv(4 * v, 5), gap = Math.round(o * 0.4), t = Math.min(1, o / 100);
  const [u, l] = q >= 150
    ? [Math.round(q + (150 - q) * t), q + gap]
    : [q - gap, Math.round(q + (150 - q) * t)];
  return [Math.min(u, l), Math.max(u, l)];
}
function openMouth(v, o) {
  if (o === 0) return mouthPath(v);
  const [upper, lower] = lips(v, o);
  return `M60 150 Q100 ${lower} 140 150 Q100 ${upper} 60 150 Z`;
}
const browPath = v => `M55 78 Q100 ${50 + idiv(2 * v, 5)} 145 78`;

// THE NOSE: lines between the eyes and the mouth, from the bridge's top at
// (100, 106) down, in a box of nose width x nose height (30 x 30 face units
// at 100). Seen from the SIDE it is an L or a < in one of a few curves,
// pointing right (the letter L) or left (a backwards L); from the FRONT,
// both sides of the bridge, the nostrils, and the tip between them. Paths
// are in nose units: x across (+ = the way it points), y down, 1 = the
// box's height.
const NOSES = {
  // tilted so the bottom, where the nostril would be, sits near the middle
  L:     "M0.16 0 L-0.1 1 L0.16 1",
  angle: "M0 0 L0.55 0.72 L0.08 1",
  soft:  "M0.22 0 Q-0.12 0.9 0.02 1 Q0.24 1.04 0.26 0.82",
  hook:  "M0 0 Q0.8 0.45 0.55 0.95 Q0.35 1.08 0.12 0.9",     // "bulbous"
  // a witch's: long, out to the side, hooked down at the tip (and warts:
  // NOSE_WARTS)
  witch: "M0.06 0 Q0.85 0.3 1.45 0.86 Q1.3 1 1 0.96 Q0.55 0.93 0.22 1.02 Q0.06 1.06 0.04 0.96",
};
// a witch nose's warts: where, in the nose's units, and how big (wartR)
const NOSE_WARTS = [[0.6, 0.5, 0.16], [1.12, 0.84, 0.12], [0.36, 0.84, 0.11]];
// from the front: one side of the bridge flaring into a nostril that curls
// back up (drawn twice, mirrored), and the tip, drawn once between them
const FRONT_NOSES = {
  pointed: "M0.08 0.05 L0.26 0.72 Q0.42 0.88 0.28 1 Q0.16 1.06 0.07 0.94",
  round:   "M0.1 0.05 Q0.12 0.55 0.24 0.74 Q0.4 0.9 0.26 1.01 Q0.15 1.07 0.07 0.95",
};
const NOSE_TIP = "M-0.07 0.95 Q0 1.1 0.07 0.95";
// The top of the mouth, in face units: its lips are quadratic curves from
// (60, 150) to (140, 150), so a curve's highest point is halfway between
// the corners' y and its control's.
const lipTop = c => Math.min(150, 75 + c / 2) - 2.5;   // (less half the lip's line)
function mouthTopAsDrawn(F) {
  return lipTop(F.open === 0 ? 110 + idiv(4 * F.smile, 5) : lips(F.smile, F.open)[0]);
}
// WHERE THE FEATURES GO, for the head's width and height: a bigger head
// spreads the eyes, brows, nose and mouth apart (by 60% of its stretch) and
// grows the mouth, which has no size control of its own. Then the mouth
// moves down for three things: opening, which grows the mouth downward
// from where its closed top was; the nose, which the mouth's top as drawn
// must clear (a short nose never moves it); and the eyes, which it clears
// by 8 wherever they are above it (big eyes close together, never the
// usual ones). The head's lower half stretches by however far the mouth
// moved (`stretch`).
function faceLayout(F) {
  const kx = 1 + 0.6 * (F.faceW / 100 - 1), ky = 1 + 0.6 * (F.faceH / 100 - 1);
  // The eyes keep the eye gap between them, edge to edge, however big,
  // narrow or slanted they are, and however wide the face: each middle is
  // half the gap and the eye's own half-width from the face's middle
  // line. The default gap, 38, puts the default eyes where they always
  // were, 32 out. The brows go with the eyes.
  const eyeY = HEAD_C + (100 - HEAD_C) * ky, eyeDX = F.eyeGap / 2 + eyeHalfW(F);
  // (but never past the eyes' outer edges, or a wide gap pushed them out
  // of the face: the brow is 45 to a side, a pair 52)
  const bx = Math.min(eyeDX / 32, Math.max(1, (eyeDX + eyeHalfW(F)) / (F.unibrow ? 45 : 52)));
  const noseTop = eyeY + 6;
  const nose = F.noseView && F.noseView !== "none";
  const uh = 30 * F.noseH / 100, uw = 30 * F.noseW / 100;
  const mouthY0 = HEAD_C + (150 - HEAD_C) * ky;

// ===================== UNDERWEAR AND SWIMSUITS =====================
// Cartoon garments over a plain body shape, in body units (as the shirt

  ` L-9 ${f1(L + 34)} Q${f1(-hw * 0.3)} ${f1(L + 12)} ${f1(-hw)} ${f1(L + 9)}`;

             line(-hw - 1, L - 8, hw + 1, L - 8, 4, st);

      return P([[-hw, L - 8], [hw, L - 8], [fx + half, L + 20], [fx - half * 0.3, L + 32], [0, L + 26],

// x1 and y0 to y1, and the figure stands on the ground at y = g, in the
// middle. Sizes are in k, a 700th of the frame's height, so a scene looks
// the same however big the figure's frame; its sky and ground run well
// past the frame (a blown lid can widen it). Things stand off to the
// sides, where the figure is not.
function backgroundSvg(kind, x0, y0, x1, y1, g) {
  const W = x1 - x0, H = y1 - y0, k = H / 700, pad = Math.max(W, H);
  // the same "random" every time, for a scene that holds still
  const R = (i, j = 0) => { const v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return v - Math.floor(v); };
  const P = (x, y) => `${f1(x)} ${f1(y)}`;
  const grad = (id, a, b, ya, yb) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${f1(ya)}" x2="0" y2="${f1(yb)}">` +
    `<stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const all = fill => `<rect x="${f1(x0 - pad)}" y="${f1(y0 - pad)}" width="${f1(W + 2 * pad)}" height="${f1(H + 2 * pad)}" fill="${fill}"/>`;
  // ground from y = at (a gentle wave) down past the frame
  const land = (at, amp, fill, phase = 0) => {
    let d = `M${P(x0 - pad, at)}`;
    for (let i = 0; i <= 12; i++) {
      const x = x0 - pad + (W + 2 * pad) * i / 12;
      d += ` Q${P(x - (W + 2 * pad) / 24, at + amp * k * Math.sin(i * 1.7 + phase))} ${P(x, at)}`;
    }
    return `<path d="${d} L${P(x1 + pad, y1 + pad)} L${P(x0 - pad, y1 + pad)} Z" fill="${fill}"/>`;
  };
  const side = i => (i % 2 ? 1 : -1);
  let s = "";
  if (kind === "forest") {
    s += `<defs>${grad("bg-sky", "#a9dcf0", "#eef8e2", y0, g)}</defs>` + all("url(#bg-sky)");
    s += land(g - 150 * k, 30, "#b5dc98", 0.5);
    // the far wood: rows of pines
    for (const [row, base, col] of [[0, g - 110 * k, ["#4f8f5a", "#5c9c63"]], [1, g - 60 * k, ["#2f6b3a", "#3c7d45"]]])
      for (let i = 0, x = x0 - 50 * k; x < x1 + 50 * k; i++, x += (row ? 52 : 40) * k) {
        const h = (row ? 210 : 150) * k * (0.8 + 0.4 * R(i, row)), b = base + 20 * k * R(i, row + 2), w = h * 0.42;
        s += `<rect x="${f1(x - 4 * k)}" y="${f1(b - 10 * k)}" width="${f1(8 * k)}" height="${f1(14 * k)}" fill="#5d3f24"/>` +
             `<polygon points="${P(x, b - h)} ${P(x + w / 2, b - 4 * k)} ${P(x - w / 2, b - 4 * k)}" fill="${col[i % 2]}"/>`;
      }
    // sunshafts, slanting down through the trees onto the meadow
    for (let j = 0; j < 4; j++) {
      const xt = x0 + W * (0.12 + 0.2 * j), xb = -W * 0.12 + j * W * 0.09;
      s += `<polygon points="${P(xt, y0 - pad * 0.1)} ${P(xt + 50 * k, y0 - pad * 0.1)} ${P(xb + 110 * k, g + 20 * k)} ${P(xb - 20 * k, g + 20 * k)}" ` +
           `fill="#fff6bf" opacity="0.32"/>`;
    }
    // the meadow, brightest in the middle where the figure stands
    s += land(g - 30 * k, 10, "#86c95f", 2.1) +
         `<ellipse cx="0" cy="${f1(g + 20 * k)}" rx="${f1(W * 0.42)}" ry="${f1(70 * k)}" fill="#a6e07a"/>`;
    for (let i = 0; i < 26; i++) {
      const x = x0 + W * R(i, 5), y = g - 20 * k + 110 * k * R(i, 6), c = ["#ff6fa5", "#ffd23f", "#ffffff", "#b388ff"][i % 4];
      s += [0, 72, 144, 216, 288].map(a => `<circle cx="${f1(x + 5 * k * Math.cos(a * Math.PI / 180))}" cy="${f1(y + 5 * k * Math.sin(a * Math.PI / 180))}" r="${f1(3.6 * k)}" fill="${c}"/>`).join("") +
           `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(2.6 * k)}" fill="#f2a900"/>`;
    }
    // big round trees at the sides, nearest of all
    for (let i = 0; i < 4; i++) {
      const sd = side(i), x = sd * Math.max(W / 2 - (i < 2 ? 70 : 200) * k, 170 * k), b = g + (i < 2 ? 60 : 30) * k;
      const sc = i < 2 ? 1.15 : 0.9, cy = b - 270 * k * sc;
      s += `<path d="M${P(x - 18 * k * sc, b)} Q${P(x - 10 * k * sc, b - 120 * k * sc)} ${P(x - 12 * k * sc, cy)} L${P(x + 12 * k * sc, cy)} ` +
           `Q${P(x + 10 * k * sc, b - 120 * k * sc)} ${P(x + 18 * k * sc, b)} Z" fill="#6b4728" stroke="#4a301a" stroke-width="${f1(2 * k)}"/>`;
      for (const [dx, dy, r, c] of [[-60, 10, 70, "#2e7d32"], [60, 10, 70, "#2e7d32"], [0, -50, 85, "#388e3c"],
                                    [-45, -40, 60, "#43a047"], [45, -45, 60, "#43a047"], [0, 30, 65, "#33873a"]])
        s += `<circle cx="${f1(x + dx * k * sc)}" cy="${f1(cy + dy * k * sc)}" r="${f1(r * k * sc)}" fill="${c}"/>`;
    }
  } else if (kind === "underwater") {
    s += `<defs>${grad("bg-sea", "#6fd6f2", "#0b4f7a", y0, y1)}</defs>` + all("url(#bg-sea)");
    for (let j = 0; j < 5; j++) {
      const xt = x0 + W * (0.05 + 0.22 * j);
      s += `<polygon points="${P(xt, y0 - pad * 0.1)} ${P(xt + 60 * k, y0 - pad * 0.1)} ${P(xt + 10 * k + W * 0.08, g)} ${P(xt - 50 * k + W * 0.08, g)}" ` +
           `fill="#ffffff" opacity="0.1"/>`;
    }
    // far rocks, then the sandy bottom
    s += land(g - 70 * k, 40, "#2f6f8f", 1.2) + land(g - 18 * k, 8, "#e6d29a", 0.3);
    for (let i = 0; i < 30; i++)
      s += `<circle cx="${f1(x0 + W * R(i, 9))}" cy="${f1(g - 5 * k + 120 * k * R(i, 10))}" r="${f1(2.2 * k)}" fill="#c9b27a"/>`;
    // seaweed swaying up from the bottom, along both sides (behind the
    // wreck and the table)
    for (let i = 0; i < 12; i++) {
      const x = side(i) * (W * 0.16 + W * 0.33 * R(i, 12)), b = g + 40 * k * R(i, 13), h = (140 + 110 * R(i, 14)) * k;
      let d = `M${P(x, b)}`;
      for (let j = 1; j <= 4; j++) d += ` Q${P(x + (j % 2 ? 1 : -1) * 22 * k, b - h * (j - 0.5) / 4)} ${P(x, b - h * j / 4)}`;
      s += `<path d="${d}" fill="none" stroke="${i % 2 ? "#2e8b57" : "#3cb371"}" stroke-width="${f1(8 * k)}" stroke-linecap="round"/>`;
    }
    // a shipwreck on the left, half sunk in the sand, its mast broken
    {
      const x = Math.min(x0 + W * 0.2, -230 * k), y = g - 10 * k, X = (a, b) => P(x + a * k, y + b * k);
      s += `<g transform="rotate(-9 ${P(x, y)})">` +
           `<path d="M${X(-160, -40)} L${X(150, -64)} Q${X(150, 10)} ${X(110, 30)} L${X(-120, 40)} Q${X(-160, 10)} ${X(-160, -40)} Z" ` +
           `fill="#6d4c2f" stroke="#3e2a18" stroke-width="${f1(4 * k)}"/>` +
           [-20, 0, 20].map(d => `<path d="M${X(-150, -20 + d)} L${X(140, -42 + d)}" stroke="#4e3420" stroke-width="${f1(2.5 * k)}"/>`).join("") +
           [-90, -40, 10, 60].map(a => `<circle cx="${f1(x + a * k)}" cy="${f1(y - (16 + a * 0.08) * k)}" r="${f1(9 * k)}" fill="#1d3a4a" stroke="#c9a14a" stroke-width="${f1(2.5 * k)}"/>`).join("") +
           `<line x1="${f1(x + 10 * k)}" y1="${f1(y - 52 * k)}" x2="${f1(x + 30 * k)}" y2="${f1(y - 250 * k)}" stroke="#5a3d24" stroke-width="${f1(11 * k)}" stroke-linecap="round"/>` +
           `<polygon points="${X(32, -240)} ${X(110, -205)} ${X(70, -150)} ${X(90, -120)} ${X(26, -110)}" fill="#d8cfae" opacity="0.85"/>` +
           `<line x1="${f1(x + 25 * k)}" y1="${f1(y - 200 * k)}" x2="${f1(x + 95 * k)}" y2="${f1(y - 165 * k)}" stroke="#5a3d24" stroke-width="${f1(6 * k)}"/>` +
           `</g>` + `<ellipse cx="${f1(x - 20 * k)}" cy="${f1(y + 40 * k)}" rx="${f1(190 * k)}" ry="${f1(34 * k)}" fill="#e6d29a"/>`;
    }
    // a picnic table on the right, a shark sitting at each end
    {
      const x = Math.max(x1 - W * 0.22, 230 * k), y = g + 30 * k, X = (a, b) => P(x + a * k, y + b * k);
      const shark = sd => {
        // sitting up, facing the table: a grey body with a white belly, a
        // fin on its back, a tail at its feet, an eye and a toothy grin
        const cx = x + sd * 128 * k, cy = y - 92 * k, T = (a, b) => P(cx + sd * a * k, cy + b * k);
        return `<path d="M${T(14, 64)} Q${T(-30, 92)} ${T(-56, 72)} L${T(-20, 58)} Z" fill="#7d8ea0" stroke="#4d5b69" stroke-width="${f1(2.5 * k)}"/>` +
          `<path d="M${T(-12, -70)} Q${T(30, -78)} ${T(30, -30)} Q${T(26, 30)} ${T(10, 66)} Q${T(-30, 60)} ${T(-34, 10)} Q${T(-40, -50)} ${T(-12, -70)} Z" ` +
          `fill="#8b9cad" stroke="#4d5b69" stroke-width="${f1(3 * k)}"/>` +
          `<path d="M${T(26, -40)} Q${T(22, 20)} ${T(8, 60)} Q${T(-4, 20)} ${T(4, -40)} Z" fill="#eef3f6"/>` +
          `<path d="M${T(-30, -10)} L${T(-62, -24)} L${T(-34, 18)} Z" fill="#7d8ea0" stroke="#4d5b69" stroke-width="${f1(2.5 * k)}"/>` +
          `<circle cx="${f1(cx + sd * 10 * k)}" cy="${f1(cy - 48 * k)}" r="${f1(6 * k)}" fill="#ffffff"/>` +
          `<circle cx="${f1(cx + sd * 12 * k)}" cy="${f1(cy - 48 * k)}" r="${f1(3 * k)}" fill="#111"/>` +
          `<path d="M${T(4, -30)} Q${T(18, -20)} ${T(28, -32)}" fill="#fff" stroke="#333" stroke-width="${f1(2 * k)}"/>` +
          [6, 13, 20].map(a => `<path d="M${T(a, -30 + (a - 4) * 0.1)} l${f1(sd * 3 * k)} ${f1(5 * k)} l${f1(sd * 3 * k)} ${f1(-5 * k)}" fill="#fff" stroke="#999" stroke-width="${f1(0.8 * k)}"/>`).join("");
      };
      s += [-70, 70].map(a => `<line x1="${f1(x + a * k)}" y1="${f1(y - 60 * k)}" x2="${f1(x + a * 1.2 * k)}" y2="${f1(y)}" stroke="#7a5230" stroke-width="${f1(8 * k)}"/>`).join("") +
           `<rect x="${f1(x - 120 * k)}" y="${f1(y - 34 * k)}" width="${f1(240 * k)}" height="${f1(10 * k)}" fill="#8b5a2b"/>` +
           shark(-1) + shark(1) +
           `<rect x="${f1(x - 100 * k)}" y="${f1(y - 74 * k)}" width="${f1(200 * k)}" height="${f1(16 * k)}" fill="#8b5a2b" stroke="#5a3a1c" stroke-width="${f1(2 * k)}"/>`;
      for (let i = 0; i < 10; i++)
        s += `<rect x="${f1(x - 100 * k + i * 20 * k)}" y="${f1(y - 80 * k)}" width="${f1(20 * k)}" height="${f1(8 * k)}" fill="${i % 2 ? "#ffffff" : "#e53935"}"/>`;
      s += `<ellipse cx="${f1(x - 40 * k)}" cy="${f1(y - 84 * k)}" rx="${f1(18 * k)}" ry="${f1(5 * k)}" fill="#ffffff" stroke="#bbb" stroke-width="${f1(1.5 * k)}"/>` +
           `<path d="M${X(-52, -88)} Q${X(-40, -100)} ${X(-28, -88)} Z" fill="#f2b84b"/>` +
           `<ellipse cx="${f1(x + 40 * k)}" cy="${f1(y - 84 * k)}" rx="${f1(18 * k)}" ry="${f1(5 * k)}" fill="#ffffff" stroke="#bbb" stroke-width="${f1(1.5 * k)}"/>` +
           `<ellipse cx="${f1(x + 40 * k)}" cy="${f1(y - 90 * k)}" rx="${f1(12 * k)}" ry="${f1(6 * k)}" fill="#e57373"/>`;
    }
    // fish, and bubbles rising
    for (let i = 0; i < 4; i++) {
      const x = x0 + W * (0.1 + 0.8 * R(i, 15)), y = y0 + (g - y0) * (0.15 + 0.4 * R(i, 16)), sd = side(i);
      s += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(18 * k)}" ry="${f1(9 * k)}" fill="${["#ff9f1c", "#ffd23f", "#ff6f91", "#7bdff2"][i]}"/>` +
           `<polygon points="${P(x - sd * 16 * k, y)} ${P(x - sd * 30 * k, y - 9 * k)} ${P(x - sd * 30 * k, y + 9 * k)}" fill="${["#ff9f1c", "#ffd23f", "#ff6f91", "#7bdff2"][i]}"/>` +
           `<circle cx="${f1(x + sd * 9 * k)}" cy="${f1(y - 2 * k)}" r="${f1(2 * k)}" fill="#111"/>`;
    }
    for (let i = 0; i < 16; i++)
      s += `<circle cx="${f1(x0 + W * R(i, 17))}" cy="${f1(y0 + (g - y0) * R(i, 18))}" r="${f1((3 + 6 * R(i, 19)) * k)}" fill="none" stroke="#ffffff" stroke-width="${f1(1.5 * k)}" opacity="0.7"/>`;
  } else if (kind === "beach") {
    const sea = g - 170 * k, shore = g - 55 * k;
    s += `<defs>${grad("bg-sky", "#5fbdf2", "#d6f0ff", y0, sea)}${grad("bg-ocean", "#1f86c4", "#4cc0e6", sea, shore)}</defs>` + all("url(#bg-sky)");
    // the sun, high on the right
    const sx = x1 - W * 0.16, sy = y0 + H * 0.14;
    s += [...Array(12)].map((_, i) => { const a = i * Math.PI / 6;
      return `<line x1="${f1(sx + 58 * k * Math.cos(a))}" y1="${f1(sy + 58 * k * Math.sin(a))}" x2="${f1(sx + 82 * k * Math.cos(a))}" y2="${f1(sy + 82 * k * Math.sin(a))}" ` +
             `stroke="#ffd23f" stroke-width="${f1(6 * k)}" stroke-linecap="round"/>`; }).join("") +
         `<circle cx="${f1(sx)}" cy="${f1(sy)}" r="${f1(46 * k)}" fill="#ffd23f"/>`;
    // the ocean next to the sand, waves on it and foam at its edge
    s += `<rect x="${f1(x0 - pad)}" y="${f1(sea)}" width="${f1(W + 2 * pad)}" height="${f1(shore - sea + 20 * k)}" fill="url(#bg-ocean)"/>`;
    for (let i = 0; i < 14; i++) {
      const x = x0 + W * R(i, 20), y = sea + (shore - sea) * (0.15 + 0.7 * R(i, 21));
      s += `<path d="M${P(x - 16 * k, y)} Q${P(x - 8 * k, y - 6 * k)} ${P(x, y)} Q${P(x + 8 * k, y - 6 * k)} ${P(x + 16 * k, y)}" fill="none" stroke="#ffffff" stroke-width="${f1(2.5 * k)}" opacity="0.8"/>`;
    }
    s += land(shore - 4 * k, 6, "#ffffff", 0.9) + land(shore + 4 * k, 6, "#f3dca5", 1.4);
    // palm trees at the sides
    for (const sd of [-1, 1]) {
      const bx = sd * Math.max(W / 2 - 60 * k, 200 * k), by = g + 40 * k, tx = bx - sd * 70 * k, ty = g - 340 * k;
      s += `<path d="M${P(bx, by)} Q${P(bx + sd * 10 * k, g - 180 * k)} ${P(tx, ty)}" fill="none" stroke="#9b6b3c" stroke-width="${f1(20 * k)}" stroke-linecap="round"/>`;
      for (let j = 1; j < 9; j++) {
        const t = j / 9, qx = (1 - t) * (1 - t) * bx + 2 * t * (1 - t) * (bx + sd * 10 * k) + t * t * tx,
              qy = (1 - t) * (1 - t) * by + 2 * t * (1 - t) * (g - 180 * k) + t * t * ty;
        s += `<line x1="${f1(qx - 9 * k)}" y1="${f1(qy)}" x2="${f1(qx + 9 * k)}" y2="${f1(qy + 4 * k)}" stroke="#7a522c" stroke-width="${f1(2.5 * k)}"/>`;
      }
      for (const a of [-160, -125, -90, -55, -20, 15, 160, 195]) {
        const r = a * Math.PI / 180, ex = tx + 120 * k * Math.cos(r), ey = ty + 80 * k * Math.sin(r) + 40 * k;
        s += `<path d="M${P(tx, ty)} Q${P(tx + 70 * k * Math.cos(r), ty + 60 * k * Math.sin(r) - 30 * k)} ${P(ex, ey)} ` +
             `Q${P(tx + 50 * k * Math.cos(r), ty + 40 * k * Math.sin(r) - 4 * k)} ${P(tx, ty)} Z" fill="#2e9d4a" stroke="#1f6e33" stroke-width="${f1(2 * k)}"/>`;
      }
      s += [[-8, 10], [8, 12], [0, 20]].map(([dx, dy]) => `<circle cx="${f1(tx + dx * k)}" cy="${f1(ty + dy * k)}" r="${f1(9 * k)}" fill="#6b4a2b"/>`).join("");
    }
    // a striped umbrella over a beach chair on each side
    for (const [sd, ca, cb] of [[-1, "#e53935", "#ffffff"], [1, "#1e88e5", "#ffd23f"]]) {
      const x = sd * Math.max(W / 2 - 210 * k, 150 * k), b = g + 20 * k, top = [x + sd * 16 * k, b - 230 * k];
      s += `<line x1="${f1(x)}" y1="${f1(b)}" x2="${P(...top).replace(" ", '" y2="')}" stroke="#d8d8d8" stroke-width="${f1(5 * k)}"/>`;
      for (let j = 0; j < 6; j++) {
        const a0 = Math.PI + j * Math.PI / 6, a1 = a0 + Math.PI / 6;
        const p0 = [top[0] + 120 * k * Math.cos(a0), top[1] + 26 * k + 40 * k * Math.sin(a0) * 0], p1 = [top[0] + 120 * k * Math.cos(a1), top[1] + 26 * k];
        s += `<path d="M${P(...top)} L${P(p0[0], top[1] + 26 * k)} Q${P((p0[0] + p1[0]) / 2, top[1] + 38 * k)} ${P(...p1)} Z" fill="${j % 2 ? cb : ca}" stroke="#555" stroke-width="${f1(1.2 * k)}"/>`;
      }
      // the chair: a striped back leaning away, a seat, and its legs
      const cx = x + sd * 30 * k, cy = b - 10 * k;
      s += `<polygon points="${P(cx - 40 * k, cy - 34 * k)} ${P(cx + 40 * k, cy - 34 * k)} ${P(cx + 34 * k, cy - 18 * k)} ${P(cx - 34 * k, cy - 18 * k)}" fill="${ca}" stroke="#555" stroke-width="${f1(1.5 * k)}"/>` +
           `<polygon points="${P(cx - 34 * k, cy - 34 * k)} ${P(cx + 34 * k, cy - 34 * k)} ${P(cx + 40 * k, cy - 92 * k)} ${P(cx - 28 * k, cy - 92 * k)}" fill="${cb}" stroke="#555" stroke-width="${f1(1.5 * k)}"/>` +
           [-1, 0, 1].map(j => `<line x1="${f1(cx + j * 22 * k)}" y1="${f1(cy - 34 * k)}" x2="${f1(cx + j * 22 * k + 6 * k)}" y2="${f1(cy - 92 * k)}" stroke="${ca}" stroke-width="${f1(7 * k)}"/>`).join("") +
           [-36, 36].map(dx => `<line x1="${f1(cx + dx * k)}" y1="${f1(cy - 20 * k)}" x2="${f1(cx + dx * 1.1 * k)}" y2="${f1(cy)}" stroke="#777" stroke-width="${f1(3 * k)}"/>`).join("");
    }
    // blankets on the sand, striped
    for (const [sd, ca, cb, dy] of [[-1, "#8e44ad", "#ffd23f", 70], [1, "#2ecc71", "#ffffff", 95]]) {
      const x = sd * W * 0.2, y = g + dy * k, w = 150 * k, h = 42 * k;
      for (let j = 0; j < 6; j++)
        s += `<polygon points="${P(x - w / 2 + j * w / 6 + 14 * k, y - h)} ${P(x - w / 2 + (j + 1) * w / 6 + 14 * k, y - h)} ${P(x - w / 2 + (j + 1) * w / 6, y)} ${P(x - w / 2 + j * w / 6, y)}" fill="${j % 2 ? cb : ca}"/>`;
    }
    // a sand castle on each side of the figure, towers, a door and a flag
    for (const sd of [-1, 1]) {
      const x = sd * Math.max(W * 0.3, 120 * k), y = g + 45 * k, c = "#e2bd6e", ln = "#b08a43";
      const tower = (tx, w, h) => `<rect x="${f1(tx - w / 2)}" y="${f1(y - h)}" width="${f1(w)}" height="${f1(h)}" fill="${c}" stroke="${ln}" stroke-width="${f1(2 * k)}"/>` +
        [-1, 0, 1].map(j => `<rect x="${f1(tx + j * w / 3 - w / 8)}" y="${f1(y - h - 8 * k)}" width="${f1(w / 4)}" height="${f1(9 * k)}" fill="${c}" stroke="${ln}" stroke-width="${f1(1.5 * k)}"/>`).join("");
      s += tower(x, 80 * k, 46 * k) + tower(x - 34 * k, 26 * k, 74 * k) + tower(x + 34 * k, 26 * k, 74 * k) + tower(x, 30 * k, 92 * k) +
           `<path d="M${P(x - 9 * k, y)} L${P(x - 9 * k, y - 16 * k)} Q${P(x, y - 26 * k)} ${P(x + 9 * k, y - 16 * k)} L${P(x + 9 * k, y)} Z" fill="#9a7638"/>` +
           `<line x1="${f1(x)}" y1="${f1(y - 100 * k)}" x2="${f1(x)}" y2="${f1(y - 132 * k)}" stroke="#555" stroke-width="${f1(2 * k)}"/>` +
           `<polygon points="${P(x, y - 132 * k)} ${P(x + sd * 22 * k, y - 125 * k)} ${P(x, y - 118 * k)}" fill="#e53935"/>`;
    }
  }
  return s;
}

let faceFrame = { tx: 0, ty: 0, s: 1 };
// the figure's size and place in its scene (k about its feet, at y = g),
// and the scene's frame: for dragging the figure, and the face in it
let figureT = { k: 1, dx: 0, dy: 0, g: 0 }, sceneFrame = { left: -200, top: -200, right: 200, bottom: 200, ground: 0 };   // where the face is, for dragging it

function draw() {
  const { face: F, body: B } = state;
  let { shirt: SH, pants: P } = state;
  const skin = F.color, skinLine = darker(skin);
  // A costume: a suit is fur over everything below the hood; a falcon is
  // wings and a tail over the clothes.
  const C = costumeOn(), kind = state.costume.kind, suit = C && ANIMALS[kind].suit;
  const limb = suit ? C.fur : skin, limbLine = suit ? darker(C.fur) : skinLine;
  // A witch: a long dress -- long sleeves, a long skirt with a ragged hem
  // -- in the hat's color with a spider web on it; striped stockings; a
  // pointed hat; and, if chosen, a cat on her shoulder and a broom in her
  // hand. Her own hair and face show.
  const witch = kind === "witch", WC = state.costume;
  if (witch) {
    SH = { ...SH, style: "long", color: WC.witchColor, pattern: "web", patternSize: 96, patternColor: WC.webColor };
    P = { ...P, style: "dress", skirtLen: 72, color: WC.witchColor, pattern: "web", patternSize: 96, patternColor: WC.webColor };
  }
  const w = SH.width, L = SH.length;
  const nw = Math.max(22, B.neckW / 2 + 6);           // the collar fits the neck

  // ARMS: from each shoulder, at the arms angle, to a hand.
  const a = B.arms * Math.PI / 180, armLen = B.armLen, armW = B.armW;
  const arms = [1, -1].map(side => {
    const A = [side * (w - 6), 8];
    return { side, A, H: [A[0] + side * armLen * Math.cos(a), A[1] + armLen * Math.sin(a)],
             angle: side > 0 ? B.arms : 180 - B.arms };
  });
  // no clothes: underwear or a swimsuit instead of the shirt and pants
  // (a full animal suit still covers everything)
  const U = state.undies, undies = U.on && !suit && !witch;
  const sleeve = suit ? 0.97 : undies ? 0 : { tee: 0.38, long: 0.95, tank: 0 }[SH.style];

  // PANTS: their hips under the shirt's hem, their feet under the legs.
  const hw = w - 2, LL = B.legLen, fx = hw / 2 + 6, feetY = L + LL;
  // each pants leg is wide enough for the leg inside it
  const half = Math.max(hw / 2, B.legW / 2 + 6);
  const shoeSc = state.shoes.size / 100;
  const ground = feetY + (state.shoes.style === "bare" ? 18 : 30) * shoeSc;

  // HEAD: its chin on the top of the neck.
  const neckTop = -20 - B.neck;
  const s = F.size / 80;
  const ty = neckTop + 6 - (headChin(F) - 4) * s, tx = -100 * s;
  faceFrame = { tx, ty, s };

  // The picture's frame grows to hold everything.
  const handYs = arms.map(x => x.H[1]);
  // each hand's own reach past the end of its arm: big mittens and long
  // fingers stuck out of the frame (and out of the saved picture)
  // (a falcon suit's wing reaches past the hand by about an arm's length)
  // (either hand's: the left may wear its own style)
  const reach = BIRD_SUIT[kind] ? B.armLen * 1.4 + 50
    : (suit ? handReach(suitHands(C, kind))
            : Math.max(handReach(state.hands), handReach({ ...state.hands, style: leftHand(state.hands) }))) + 12;
  // room for big hair on a tall head, a lid blown far off, and candy
  // and hair, stretched with the head (it hangs and spreads in face units)
  const hr = C ? { top: 0, bottom: 0, half: 0 } : hairReach(state.hair);
  const hairY = y => HEAD_C + (y - HEAD_C) * headH(F);
  const flying = F.burst > 0 ? idiv(F.burst * 7, 10) + idiv(F.burst * 4, 10) + 40 : 0;   // see topFlies
  const faceTop = Math.min(-90, HEAD_C - 175 * headH(F), headCrown(F) + 50.6 - 1.4 * F.burst - 40,
                           hairY(hr.top) - 40 - flying, (C ? (kind === "deer" ? -140 : -90) : 0) - flying,
                           witch ? hairY(-130) - 20 - flying : 0);
  // (a broom stands 120 above the hand that holds it, its bristles 66 below)
  const broomH = witch && WC.broom ? arms[0].H : null;
  // (and a cat on the shoulder, 64 above where it sits and 42 below, its
  // tail out 34 to the side, all times its size)
  const kb = (state.costume.broomSize ?? 100) / 100, catK = witch && WC.witchCat ? (WC.catSize ?? 100) / 100 : 0;
  const top = Math.min(ty + faceTop * s, ...handYs.map(y => y - Math.max(40, reach)), broomH ? broomH[1] - 140 * kb : 0,
                       catK ? -9 - 70 * catK : 0);
  const pileP = F.sick > 100 ? 100 + (F.sick - 100) / 2 : F.sick > 30 ? (F.sick - 30) * 100 / 70 : 0;
  const pileRx = (6 + pileP * 84 / 100) * 1.6 * s;
  // and a long skirt or dress, which can reach past the feet
  const skirtHem = !suit && !undies && (P.style === "skirt" || P.style === "dress")
    ? L + LL * (P.skirtLen ?? 50) / 100 + 30 : 0;
  let bottom = Math.max(ground + 24, ty + hairY(hr.bottom) * s + 16, ...handYs.map(y => y + reach), skirtHem,
                          broomH ? broomH[1] + 140 * kb : 0, catK ? -9 + 46 * catK : 0);
  const hairHalf = hr.half * headWidth(F) * (1 + 0.12 * F.alien / 100) * s;
  let left = Math.min(-200, C ? -(w + 185) : -200, ...arms.map(x => x.H[0] - Math.max(40, reach)), ...arms.map(x => -x.H[0] - Math.max(40, reach)),
                        -(fx + half + 70), -(fx + (FOOT_REACH[witch ? "witchboot" : state.shoes.style] ?? 76) * shoeSc + 20), -(w + 40), -(pileRx + 20), -(B.neckW / 2 + 40), -(hairHalf + 20),
                        -((80 + (C ? (kind === "deer" ? 60 : 30) : witch ? 50 : 0)) * headWidth(F) * (1 + 0.12 * F.alien / 100) * s + 20),
                        broomH ? -(Math.abs(broomH[0]) + 60 * kb) : 0,
                        catK ? -(w - 4) - 24 * catK : 0, catK ? -(-(w - 4) + 40 * catK) : 0);
  // a background is a scene, wider than it is tall, with room at the
  // sides for its trees, wreck, table or palms, and in front of the feet
  // for its flowers, sand castles and blankets
  if (state.background.kind !== "none") {
    bottom = Math.max(bottom, ground + 0.16 * (bottom - top));
    left = Math.min(left, -0.675 * (bottom - top));
  }
  const width = -2 * left;

  let svg = `<defs>${patternDef("pat-shirt", SH.color, SH.pattern, SH.patternSize, SH.patternColor)}${patternDef("pat-pants", P.color, P.pattern, P.patternSize, P.patternColor)}` +
            `${patternDef("pat-undies", U.color, U.pattern, U.patternSize, U.patternColor)}${C ? furDefs(C, kind) : ""}</defs>`;
  // the background first, behind everything, its ground at the feet
  const BG = state.background, scened = BG.kind !== "none";
  if (scened)
    svg += `<g id="bg">${backgroundSvg(BG.kind, left, top, -left, bottom, ground)}</g>`;
  // and in a scene, the figure at its own size (about its feet) and place,
  // where it was dragged
  figureT = scened ? { k: (BG.figSize ?? 100) / 100, dx: BG.figX ?? 0, dy: BG.figY ?? 0, g: ground }
                   : { k: 1, dx: 0, dy: 0, g: ground };
  sceneFrame = { left, top, right: -left, bottom, ground };
  svg += `<g id="figure" transform="translate(${f1(figureT.dx)} ${f1(figureT.dy + ground)}) scale(${figureT.k.toFixed(3)}) translate(0 ${f1(-ground)})">`;
  svg += `<ellipse cx="0" cy="${f1(ground)}" rx="${f1(hw + 70)}" ry="12" fill="#000" opacity="0.08"/>`;
  // behind everything: long hair's back layer, in the face's frame
  if (!C) svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">` +
                 `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${hairBackSvg(state.hair)}</g></g></g>`;

  // behind everything: a falcon's wings and tail, or a suit's tail
  // (a bald eagle's: plain dark brown wings and a white tail)
  if (kind === "falcon") svg += falconWings(C, w) + falconTail(C, hw, L, LL);
  else if (kind === "eagle") svg += falconWings(C, w, C.fur) + falconTail(C, hw, L, LL, C.belly);
  else if (kind === "falconsuit") svg += falconTail(C, hw, L, LL, "url(#pat-fur)");
  else if (kind === "eaglesuit") svg += falconTail(C, hw, L, LL, C.belly);
  else if (suit) svg += tailSvg(C, kind, hw, L);

  // legs, then shoes, then pants over both: long pants cover a boot's top
  for (const side of [1, -1]) svg += line(side * fx, L, side * fx, feetY, B.legW, limb, limbLine);
  if (witch)   // striped stockings
    for (const side of [1, -1])
      svg += `<line x1="${f1(side * fx)}" y1="${f1(L)}" x2="${f1(side * fx)}" y2="${f1(feetY)}" stroke="${WC.trimColor}" ` +
             `stroke-width="${f1(B.legW)}" stroke-dasharray="9 9"/>`;
  const feet = BIRD_SUIT[kind] ? { style: "talons", size: state.shoes.size }
             : kind === "deer" ? { style: "hoof", size: state.shoes.size }
             : witch ? { style: "witchboot", size: state.shoes.size, color: WC.bootColor ?? "#1f1f22" }
             : suit ? { style: "paw", size: state.shoes.size, color: C.fur, pad: C.accent } : state.shoes;
  // (a falcon suit's talons are yellow, like a falcon's feet)
  for (const side of [1, -1]) svg += shoeSvg(side * fx, feetY, side, feet, BIRD_SUIT[kind] ? C.accent : skin);
  const pf = suit ? "url(#pat-fur)" : fillOf("pat-pants", P.color, P.pattern);
  const ps = suit ? darker(C.fur) : darker(P.color);
  if (undies) {
    // no clothes: plain skin from the waist to the tops of the legs, and
    // over it the underwear or swimsuit bottom
    svg += poly([[-hw, L - 10], [hw, L - 10], [fx + half, L + 34], [fx - half, L + 34], [0, L + 14],
                 [-(fx - half), L + 34], [-(fx + half), L + 34]], limb, limbLine);
    svg += undiesBottom(U, hw, fx, half, L, LL);
  } else if (!suit && (P.style === "skirt" || P.style === "dress")) {
    // a skirt flares a little; a dress flares more as it gets longer and
    // has a scalloped hem. The length is a share of the legs' length.
    const sl = LL * (P.skirtLen ?? 50) / 100;
    if (P.style === "skirt")
      svg += `<path d="M${-hw} ${L - 10} L${hw} ${L - 10} L${f1(hw + 30)} ${f1(L + sl)} Q0 ${f1(L + sl + 14)} ${f1(-hw - 30)} ${f1(L + sl)} Z" ` +
             `fill="${pf}" stroke="${ps}" stroke-width="2.5" stroke-linejoin="round"/>`;
    else {
      const fl = hw + 26 + sl * 0.25, n = witch ? 9 : 6;
      let d = `M${-hw} ${L - 10} L${hw} ${L - 10} L${f1(fl)} ${f1(L + sl)}`;
      for (let i = 1; i <= n; i++) {
        const x0 = fl - (i - 1) * 2 * fl / n, x1 = fl - i * 2 * fl / n;
        // (a witch's hem is ragged: points, not scallops)
        d += witch ? ` L${f1((x0 + x1) / 2)} ${f1(L + sl + 18)} L${f1(x1)} ${f1(L + sl)}`
                   : ` Q${f1((x0 + x1) / 2)} ${f1(L + sl + 16)} ${f1(x1)} ${f1(L + sl)}`;
      }
      svg += `<path d="${d} Z" fill="${pf}" stroke="${ps}" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
  } else {
    const len = !suit && P.style === "shorts" ? LL * 0.38 : LL;
    const legs = [[-hw, L - 10], [hw, L - 10], [fx + half, L + len], [fx - half, L + len],
                  [0, L + Math.min(len * 0.3, 40)], [-(fx - half), L + len], [-(fx + half), L + len]];
    svg += poly(legs, pf, ps);
    if (wrapStripes(C)) svg += legStripes(legs, hw, fx, half, L, len, Math.min(len * 0.3, 40), C.marks);
  }

  // neck, behind the shirt so it shows in the collar
  svg += `<rect x="${-B.neckW / 2}" y="${neckTop}" width="${B.neckW}" height="${B.neck + 44}" rx="4" ` +
         `fill="${limb}" stroke="${limbLine}" stroke-width="2.5"/>`;

  // arms, sleeves and shirt
  const sf = suit ? "url(#pat-fur)" : fillOf("pat-shirt", SH.color, SH.pattern);
  const ss = suit ? darker(C.fur) : darker(SH.color);
  // (a falcon suit's arms are inside its wings, drawn after the body)
  const winged = !!BIRD_SUIT[kind];
  if (!winged) for (const { A, H } of arms) svg += line(A[0], A[1], H[0], H[1], armW, limb, limbLine);
  const sleeveEnd = ({ A, H }) => [A[0] + (H[0] - A[0]) * sleeve, A[1] + (H[1] - A[1]) * sleeve];
  if (sleeve > 0 && !winged) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 14, ss); }
  const collar = { v: [[0, 18]], round: [[-nw * 0.7, -6], [0, -1], [nw * 0.7, -6]], flat: [] }[SH.collar];
  const shoulder = !suit && SH.style === "tank" ? [[nw + 12, -20], [w, 30]] : [[w + 4, -6], [w, 44]];
  const torso = [[-nw, -20], ...collar, [nw, -20], ...shoulder, [w + 2, L], [-(w + 2), L],
                 ...shoulder.map(([x, y]) => [-x, y]).reverse()];
  const bareBody = [[-(w + 2), L + 2], [-w, 44], [-(w + 4), -6], [-nw, -20], [nw, -20], [w + 4, -6], [w, 44], [w + 2, L + 2]];
  if (undies) {
    // a plain body shape in skin, no collar, then the swimsuit or top on it
    // (outlined on every side but the bottom, so it runs on into the hips
    // without a line at the waist)
    const body = bareBody;
    svg += poly(body, limb, "none", 0) +
           `<polyline points="${pts(body)}" fill="none" stroke="${limbLine}" stroke-width="2.5" stroke-linejoin="round"/>`;
    svg += undiesTop(U, w, nw, hw, fx, L);
  } else svg += poly(torso, sf, ss);
  // a witch's belt round her waist, its buckle in the middle
  if (witch) {
    const bc = WC.bootColor ?? "#1f1f22";
    svg += `<rect x="${f1(-(w + 3))}" y="${f1(L - 16)}" width="${f1(2 * w + 6)}" height="12" fill="${bc}" stroke="${darker(bc)}" stroke-width="2"/>` +
           `<rect x="-11" y="${f1(L - 19)}" width="22" height="18" rx="2.5" fill="none" stroke="#f2c230" stroke-width="4"/>` +
           `<line x1="-3" y1="${f1(L - 10)}" x2="9" y2="${f1(L - 10)}" stroke="#f2c230" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  if (wrapStripes(C) && !undies) svg += torsoStripes(torso, w, L, C.marks);
  if (suit && kind !== "eaglesuit")  // the suit's belly (a bald eagle is brown all over)
    svg += `<ellipse cx="0" cy="${f1(L * 0.58)}" rx="${f1(w * 0.55)}" ry="${f1(L * 0.36)}" fill="${C.belly}"/>`;
  // the hair, in the face's frame: over the body and shirt, but under the
  // arms, which are drawn again over it (long or curly hair hangs beside
  // them), and behind the head
  if (!C)
    svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">` +
           `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${hairSvg(state.hair)}</g></g></g>`;

  if (winged) for (const arm of arms) svg += armWing(C, arm, armW);

  // the face, in its own units
  const groundInFace = (ground - ty) / s;
  svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">${faceSvg(F, groundInFace)}</g>`;
  // a witch's hat over it, stretched with the head as hair is (and flying
  // off with the lid); her cat on her shoulder
  if (witch) {
    svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})"><g transform="${topFlies(F)}">` +
           `<g transform="${hairStretch(F)}">${witchHat(WC)}</g></g></g>`;
    // (the cat grows or shrinks about where it sits)
    if (WC.witchCat)
      svg += `<g transform="translate(${f1(-(w - 4))} -9) scale(${((WC.catSize ?? 100) / 100).toFixed(3)}) translate(${f1(w - 4)} 9)">` +
             `${shoulderCat(w, WC)}</g>`;
  }

  // then the arms again, over the hair and the face: raised arms cross
  // the chin and cheeks in front of the head, not behind it
  // (only outside the body, where they showed before: the body still
  // covers their tops, outline and all)
  // (a bird suit's wings stay behind the face, or they would hide it)
  if (!winged) {
    svg += `<mask id="off-body" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">` +
           `<rect x="-5000" y="-5000" width="10000" height="10000" fill="white"/>` +
           `<polygon points="${pts(undies ? bareBody : torso)}" fill="black" stroke="black" stroke-width="3" stroke-linejoin="round"/></mask>` +
           `<g mask="url(#off-body)">`;
    for (const { A, H } of arms) svg += line(A[0], A[1], H[0], H[1], armW, limb, limbLine);
    if (sleeve > 0) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 14, ss); }
    svg += `</g>`;
    if (sleeve > 0) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 9, sf); }
    // (from past the shoulder, where the fur sleeve joins the body)
    if (wrapStripes(C))
      for (const arm of arms) svg += limbStripes(arm.A, sleeveEnd(arm), armW + 9, C.marks, `arm-stripes${arm.side}`, 22);
  }

  // a witch's broom, held in her right hand (on the picture's right)
  // (it grows or shrinks about the hand)
  if (broomH)
    svg += `<g transform="translate(${f1(broomH[0])} ${f1(broomH[1])}) scale(${kb.toFixed(3)}) translate(${f1(-broomH[0])} ${f1(-broomH[1])})">` +
           `${broomSvg(broomH, WC.trimColor)}</g>`;

  // and the hands last, in front of everything, the face too: raised
  // arms put them by the cheeks or over the eyes, not behind the head
  if (!winged) {
    const hands = suit ? suitHands(C, kind) : state.hands;
    for (const { side, H, angle } of arms) {
      // the hand on the left may wear a style of its own; a hand holding
      // the broom is closed round it, a round fist
      const own = !suit && side < 0 && hands.leftStyle && hands.leftStyle !== "same" ? { ...hands, style: hands.leftStyle } : hands;
      svg += handSvg(H[0], H[1], angle, side, broomH && side > 0 ? { ...own, style: "round" } : own, skin);
    }
  }
  svg += `</g>`;   // the figure

  const pic = document.getElementById("pic");
  pic.setAttribute("viewBox", `${f1(left)} ${f1(top)} ${f1(width)} ${f1(bottom - top)}`);
  pic.innerHTML = svg;
  // a blown lid tilts about the crack, and on a tall head its top (and
  // long hair or a hood's back below it) swings far out: frame what was
  // drawn, kept centred
  if (F.burst > 0) {
    // (the background runs past the frame on purpose: not counted)
    const bg = pic.querySelector("#bg");
    if (bg) bg.style.display = "none";
    const b = pic.getBBox(), l = Math.min(left, b.x - 12, -(b.x + b.width + 12));
    if (bg) bg.style.display = "";
    const t = Math.min(top, b.y - 12), btm = Math.max(bottom, b.y + b.height + 12);
    if (l < left || t < top || btm > bottom)
      pic.setAttribute("viewBox", `${f1(l)} ${f1(t)} ${f1(-2 * l)} ${f1(btm - t)}`);
  }
  document.getElementById("mood").textContent = "feeling " + mood(family(F.color), F.brow, F.smile);
}

// ===================== CONTROLS =====================

// a witch's green skin
const WITCH_SKIN = "#6fa34a";
// the skin swatches that mean something, marked so: what they mean
const SKIN_MARKS = { "#cfa000": ["😀", "smiley yellow"], "#aab2ba": ["👽", "alien grey"], "#dc143c": ["😡", "mad red"], "#8cbe32": ["🤢", "sick green"],
                     [WITCH_SKIN]: ["🧙", "witch green"] };
const SKINS = ["#cfa000", "#dc143c", "#8cbe32", "#aab2ba", "#ffdbac", "#f1c27d", "#e0ac69", "#c68642", "#8d5524", WITCH_SKIN];
const BRIGHT = ["#e74c3c", "#ff69b4", "#f39c12", "#f1c40f", "#2ecc71", "#5b8bd0", "#34495e", "#8e44ad", "#ffffff", "#2b2b2b"];
const HAIRS = ["#2b2b2b", "#6f4e37", "#e8c35a", "#b5562b", "#ff69b4", "#3b82f6", "#22c55e", "#8b5cf6"];
const PATTERN_COLORS = ["auto", "#ffffff", "#ff69b4", "#f1c40f", "#e74c3c", "#2ecc71", "#5b8bd0", "#2b2b2b"];
const FURS = ["#e8862a", "#1f1f22", "#d9a441", "#6b4226", "#55616d", "#ffffff", "#9ca3af", "#ff69b4", "#8b5cf6"];
const MARKS = ["#1f1a17", "#3a3a40", "#8a4b1c", "#4a2c17", "#23282e", "#ffffff", "#ff69b4"];
const BELLIES = ["#f7ead8", "#2e2e33", "#f1d9a8", "#b08458", "#f2ece0", "#ffffff", "#ffd1dc"];
const ANIMAL_EYES = ["#e0a800", "#c6d43a", "#c88a1e", "#2b1a10", "#1a1410", "#3b82f6", "#22c55e"];
const ACCENTS = ["#e89aa0", "#f4a0b0", "#5a3a2a", "#1d1410", "#f2c230", "#ff69b4"];
const PATTERNS = [["plain", "plain"], ["stripes", "stripes"], ["dots", "dots"], ["hearts", "♥ hearts"], ["stars", "★ stars"]];

// the hand on the left's style: its own, or the same as the other's
const leftHand = h => (h.leftStyle && h.leftStyle !== "same" ? h.leftStyle : h.style);
// whether either hand wears a style, for showing that style's sliders
const usesHand = (h, st) => h.style === st || leftHand(h) === st;
const HAND_STYLES = [["round", "round"], ["mitten", "mittens"], ["star", "stars"], ["claw", "claws"],
                     ["human", "✋ human"], ["alien", "👽 alien"]];
const TABS = [
  ["😀 Face", "face", [
    ["color", "color", "skin & head color", SKINS],
    ["range", "size", "head size", 8, 150, 36, 64],
    ["range", "faceW", "face width", 40, 600, 85, 115],
    ["range", "faceH", "face height", 40, 600, 85, 115],
    ["range", "alien", "face shape (round ↔ alien)", 0, 100, 0, 0],
    ["range", "eyeGap", "eye gap", 0, 600, 25, 55],
    ["range", "smile", "smile", -100, 200, 0, 100],
    ["range", "mouthSize", "👄 mouth size", 20, 400, 70, 140],
    ["range", "brow", "eyebrows", -100, 200, 0, 100],
    ["toggle", "unibrow", "one big eyebrow"],
    ["choice", "noseView", "👃 nose", [["none", "none"], ["right", "side, L →"], ["left", "side, ← backwards L"], ["front", "front"], ["witch", "🧙 witch, warts"]]],
    ["choice", "nose", "side shape", [["L", "L"], ["angle", "<"], ["soft", "soft"], ["hook", "bulbous"]]],
    ["choice", "noseFront", "front shape", [["pointed", "pointed"], ["round", "round"]]],
    ["choice", "witchDir", "🧙 witch nose points", [["left", "L ←"], ["center", "C"], ["right", "R →"]]],
    ["range", "witchLen", "🧙 witch nose length", 30, 400, 70, 200],

let tab = 0;
let syncs = [];   // each control's refresh, run after every change
let hudSyncs = [];   // ...and the full-screen controls'

function set(part, key, value) {
  state[part][key] = value;
  // choosing an animal dresses it in its natural colors
  if (part === "costume" && key === "kind" && ANIMALS[value]) Object.assign(state.costume, lookOf(value));
  // a skirt starts at skirt length and a dress at dress length
  if (part === "pants" && key === "style" && value === "skirt") state.pants.skirtLen = 50;
  if (part === "pants" && key === "style" && value === "dress") state.pants.skirtLen = 95;
  // a bikini comes with its top; trunks and briefs start without one
  if (part === "undies" && key === "style") state.undies.top = value === "bikini";
  changed();
}
function changed() {
  draw(); for (const f of syncs) f(); for (const f of hudSyncs) f(); persist();
  // a new friend (loaded, started over, surprised) or a scene turned on or
  // off rebuilds the HUD; a slider moving in it does not
  if (!hud.hidden && hudKey() !== hudShown) renderHud();
}

function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of [].concat(kids)) e.append(k);
  return e;
}

// Iris color and eye whites only mean something once there is an iris.
const SHOWN_WHEN = {
  "face.irisColor": f => f.iris > 0,
  "face.nose": f => f.noseView === "right" || f.noseView === "left",
  "face.noseFront": f => f.noseView === "front",
  "face.witchDir": f => f.noseView === "witch",
  "face.witchLen": f => f.noseView === "witch",
  "face.teeth": f => f.teethStyle === "spikes",
  "face.tongueLen": f => f.tongue === "out",
  "face.tongueW": f => f.tongue === "out",
  "face.tongueColor": f => f.tongue !== "none",
  "face.noseH": f => f.noseView !== "none",
  "face.noseW": f => f.noseView !== "none",
  "face.whites": f => f.iris > 0,
  "costume.fur": c => !!ANIMALS[c.kind],
  "costume.furPattern": c => !!(ANIMALS[c.kind] && ANIMALS[c.kind].suit),
  "costume.witchColor": c => c.kind === "witch",
  "costume.webColor": c => c.kind === "witch",
  "costume.trimColor": c => c.kind === "witch",
  "costume.witchCat": c => c.kind === "witch",
  "costume.catFur": c => c.kind === "witch" && c.witchCat,
  "costume.catWhite": c => c.kind === "witch" && c.witchCat,
  "costume.catEyes": c => c.kind === "witch" && c.witchCat,
  "costume.catNose": c => c.kind === "witch" && c.witchCat,
  "costume.broom": c => c.kind === "witch",
  "costume.catSize": c => c.kind === "witch" && c.witchCat,
  "costume.broomSize": c => c.kind === "witch" && c.broom,
  "costume.bootColor": c => c.kind === "witch",
  "background.figSize": b => b.kind !== "none",
  "background.recenter": b => b.kind !== "none" && ((b.figX ?? 0) !== 0 || (b.figY ?? 0) !== 0),
  "costume.marks": c => !!ANIMALS[c.kind],
  "costume.spot": c => c.furPattern === "rosettes" && !!(ANIMALS[c.kind] && ANIMALS[c.kind].suit),
  "costume.belly": c => !!ANIMALS[c.kind],
  "costume.eyes": c => !!ANIMALS[c.kind],
  "costume.accent": c => !!ANIMALS[c.kind],
  "hair.length": h => ["long", "curly", "pigtails", "spiky", "afro"].includes(h.style),
  "pants.skirtLen": p => p.style === "skirt" || p.style === "dress",
  "hands.fingers": h => usesHand(h, "human"),
  "hands.alienFingers": h => usesHand(h, "alien"),
  "hands.starPoints": h => usesHand(h, "star"),
  "hands.starAngle": h => usesHand(h, "star"),
  "hands.mittenAngle": h => usesHand(h, "mitten"),
  "hands.clawAngle": h => usesHand(h, "claw"),
  "hands.humanAngle": h => usesHand(h, "human"),
  "hands.alienAngle": h => usesHand(h, "alien"),
  // claws: the claw hand's, or a cat costume's paws
  "hands.clawLen": h => usesHand(h, "claw") || (!!CLAWED[state.costume.kind] && !!costumeOn()),
  "hands.clawCount": h => usesHand(h, "claw") || (!!CLAWED[state.costume.kind] && !!costumeOn()),
  "undies.style": u => u.on,
  "undies.top": u => u.on && u.style !== "onepiece",
  "undies.color": u => u.on,
  "undies.pattern": u => u.on,
  "undies.patternSize": u => u.on && u.pattern !== "plain",
  "undies.patternColor": u => u.on && u.pattern !== "plain",
  "shirt.patternSize": c => c.pattern !== "plain",
  "shirt.patternColor": c => c.pattern !== "plain",
  "pants.patternSize": c => c.pattern !== "plain",
  "pants.patternColor": c => c.pattern !== "plain",
