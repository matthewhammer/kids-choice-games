<title>Messed Up Dress Up</title>
<!-- (ticket 486) an app on the device: added to the home screen or installed, it opens without the Internet (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#5eb6ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dress Up">
<link rel="stylesheet" href="style.css?v=0.0.411">
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="pic-wrap">
      <div class="pic-area">
        <div class="pic-box">
          <svg id="pic" xmlns="http://www.w3.org/2000/svg"></svg>
          <button class="max-btn" id="max" title="Full screen" aria-label="Full screen">⤢</button>
          <button class="mute-btn" id="mute" title="Music on or off" aria-label="Music on or off" hidden>🔊</button>
          <button class="mfs-btn" id="music-fs" title="The music's controls, full screen" aria-label="The music's controls, full screen">🎚️</button>
          <button class="back-btn" id="back" hidden></button>
          <button class="hud-btn" id="hud-btn" title="Show the pinned controls" aria-label="Show the pinned controls" aria-pressed="false">🎛️</button>
          <button class="pad-btn" id="pad-btn" title="A controller on the screen: arrows and buttons to touch or click" aria-label="Show the on-screen controller" aria-pressed="false">🎮</button>
          <div class="ways-layer" id="ways"></div><div class="ways-layer" id="access-layer"></div>
        </div>
        <div class="bar">
          <div class="caption" id="mood" title="Drag the mouth or the eyebrows on the face, too!"></div>
          <div class="actions">
            <button class="big" id="surprise">🎲 Surprise me!</button>
            <div class="save-menu">
              <button id="save-open" aria-haspopup="true" aria-expanded="false" aria-controls="save-pop" title="Save your friend: a picture, a drawing, and its settings">💾 Save ▾</button>
              <div class="save-pop" id="save-pop" hidden>
                <div class="formats" id="formats">
                  <span id="formats-label">save as:</span>
                  <label><input type="checkbox" value="png" checked> picture (.png)</label>
                  <label><input type="checkbox" value="svg" checked> drawing (.svg)</label>
                  <label><input type="checkbox" value="json" checked> settings (.json)</label>
                </div>
                <button class="big" id="save" title="Saves the files checked above: a picture (.png), a drawing that prints at any size (.svg), and your friend's settings (.json) to load again later">💾 Save</button>
                <div class="saved" id="saved" aria-live="polite"></div>
                <div class="postcard">
                  <label for="postcard-text">💌 a postcard that says</label>
                  <input id="postcard-text" type="text" maxlength="90" placeholder="what to write on it">
                  <button class="big" id="postcard" title="Saves one picture (.png): your friend in their place, in a card's border, with what you wrote under it">💌 Save a postcard</button>
                </div>
              </div>
            </div>
            <button id="load" title="Load a friend you saved (.json)">📂 Load</button>
            <input type="file" id="load-file" accept=".json,application/json" hidden>
            <button id="reset">↺ Start over</button>
          </div>
        </div>
      </div>
      <div class="hud" id="hud" hidden></div>
      <div class="measuring-note" id="measuring" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Between the picture and the controls" title="Drag to make the picture bigger or smaller (double-click: the best fit)"></div>
  <div class="side">
    <h1><span class="game-name">Messed Up Dress Up</span> <span class="version" id="version"></span> <a class="speed-mark" id="speed-mark" hidden target="_blank" rel="noopener"></a> <button class="newer" id="newer" hidden></button></h1>
    <div class="tabs" id="tabs"></div>
    <div class="crumbs" id="crumbs" aria-hidden="true"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>
