<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messed Up Dress Up</title>
<style>
  :root { --ink: #222; --muted: #666; --line: #d6d6d6; --paper: #fffdf7; --bg: #f3f0ff;
          --panel: #ffffff; --accent: #7c3aed; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #aaa; --line: #444; --paper: #fffdf7; --bg: #1d1a26;
            --panel: #29253a; --accent: #a78bfa; --accent-ink: #1d1a26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; }
  /* over the picture, centered on it (at the window's edge it hung far out
     to the left of a picture centered in its column) */
  h1 { margin: 0 0 10px; font-size: 1.6em; letter-spacing: 0.02em; text-align: center; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px;
         max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: sticky; top: 8px; align-self: start; }
  /* The picture, its caption and buttons always fit on the screen, so the
     picture stays in view while the controls scroll. */
  svg#pic { display: block; width: 100%; height: auto;
            max-height: calc(100vh - 195px); max-height: calc(100dvh - 195px);
            background: var(--paper); border-radius: 18px; border: 2px solid var(--line);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .caption { text-align: center; margin-top: 6px; font-size: 1.2em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 2px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 6px 12px; }
  button.big { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
               font-weight: 600; padding: 8px 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tabs button { font-weight: 600; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .panel { background: var(--panel); border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); }
  .ctl { margin: 10px 0; }
  .ctl > .lbl { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .ctl > .lbl .val { color: var(--muted); font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* a menu for each hand, mirrored about a line down the middle */
  .ctl.pair:not([hidden]) { display: flex; }
  .pair > .side { flex: 1 1 0; min-width: 0; }
  .pair > .side:first-child { padding-right: 10px; }
  .pair > .side:last-child { padding-left: 10px; border-left: 2px dashed var(--line); }
  .pair > .side > .lbl { font-weight: 600; margin-bottom: 4px; }
  .pair > .side:last-child > .lbl { text-align: right; }
  .pair > .side:last-child .row { justify-content: flex-end; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid var(--line); }
  .swatch[aria-pressed=true] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .swatch.skin { font-size: 0.6em; }
  input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); }
  input[type=color] { width: 40px; height: 34px; border: none; padding: 0; background: none; }
  .hint { color: var(--muted); font-size: 0.9em; }
  /* the figure's place in its scene: the stage in small, the figure a box */
  svg.place { display: block; width: 100%; max-width: 240px; height: auto; touch-action: none; cursor: crosshair;
              border-radius: 10px; border: 2px solid var(--line); }
  svg.pad { width: 140px; height: 140px; display: block; touch-action: none; cursor: crosshair;
            border-radius: 14px; border: 2px solid var(--line); }
  /* On a phone the controls are below the picture, so the picture is
     kept small and pinned at the top: a change shows while you make it. */
  @media (max-width: 760px) {
    body { padding-top: 8px; }
    h1 { display: none; }
    .stage { top: 0; z-index: 1; background: var(--bg); padding: 4px 0 8px; margin: 0 -16px; padding-inline: 16px; }
    svg#pic { max-height: 40vh; max-height: 40dvh; }
    .stage .hint { display: none; }
    .actions { margin-top: 4px; gap: 6px; flex-wrap: nowrap; }
    .actions button { padding: 4px 8px; font-size: 0.85em; white-space: nowrap; }
    .caption { margin-top: 2px; font-size: 1em; }
  }
  .formats { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center;
             margin-top: 8px; font-size: 13px; color: var(--muted); }
  .formats label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .saved { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .saved a { color: inherit; font-weight: 600; margin: 0 4px; }
  /* Full screen: the button at the picture's top right fills the window
     with the picture, the controls hidden; again (an X then) or Escape
     brings them back. */
  .pic-wrap { position: relative; }
  .max-btn { position: absolute; top: 8px; right: 8px; padding: 0 9px; font-size: 1.3em; line-height: 1.45;
             background: var(--panel); opacity: 0.9; }
  body.big { overflow: hidden; }
  /* (the sticky stage is its own stacking context: raised, or the panel's
     half-faded pins, each a layer of its own, paint over the full screen) */
  body.big .stage { z-index: 20; }
  body.big .app > :not(.stage) { visibility: hidden; }
  body.big .pic-wrap { position: fixed; inset: 0; z-index: 10; background: var(--bg); padding: 8px;
                      display: flex; flex-direction: column; gap: 8px; }
  body.big svg#pic { width: 100%; height: 0; flex: 1 1 auto; max-height: none; }
  body.big .max-btn { top: 16px; right: 16px; }
  /* the music's quick mute, at the picture's other top corner */
  .mute-btn { position: absolute; top: 8px; left: 8px; padding: 0 9px; font-size: 1.3em; line-height: 1.45;
              background: var(--panel); opacity: 0.9; }
  body.big .mute-btn { top: 16px; left: 16px; }
  /* back through the last doorway, after a trip through one */
  .back-btn { position: absolute; bottom: 8px; left: 8px; padding: 0 10px; font-size: 1.15em; line-height: 1.6;
              background: var(--panel); opacity: 0.92; }
  body.big .back-btn { bottom: auto; top: 16px; left: 66px; }
  .ctl > p.now { margin: 0; color: var(--muted); }
  /* the mixing board: a strip for each part, the whole tune's first */
  .mixer { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 4px; }
  .mixer p.now { margin: 0; color: var(--muted); }
  .strip { border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; font-size: 0.85em; }
  .strip.master { border-style: dashed; }
  .strip.dim { opacity: 0.45; }
  .strip-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
  .strip-name { flex: 1 1 auto; font-weight: 600; }
  .strip-name small { color: var(--muted); font-weight: 400; }
  .strip button.ms { padding: 1px 7px; font-size: 0.95em; }
  .strip button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* a throw is held down: no text selection or long-press menu on a tablet */
  .strip button.throw { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  .knob { display: grid; grid-template-columns: 6.2em 1fr 3.8em; align-items: center; gap: 4px; }
  .knob input[type=range] { height: 22px; }
  .knob .val { color: var(--muted); text-align: right; font-size: 0.9em; }
  /* a channel's move: its chips beside the name, how far it is moved on a line of its own */
  .knob.move { grid-template-columns: 6.2em 1fr; }
  .knob.move .row { display: flex; gap: 4px; flex-wrap: nowrap; }
  .knob.move .row button { white-space: nowrap; flex-shrink: 0; }
  .knob.move .val { grid-column: 1 / -1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.on { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  /* the transport: where the tune is, its sections marked under it */
  /* where the tune is: one line that never wraps (the numbers keep their width) */
  .ctl .pos { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; margin-top: 4px; }
  .ctl .where { font-weight: 600; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .ctl .when { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .marks { display: flex; gap: 2px; margin-top: 2px; }
  .marks span { height: 14px; border-radius: 4px; background: var(--line); color: var(--muted); font-size: 10px; line-height: 14px; text-align: center; overflow: hidden; }
  .marks span.on { background: var(--accent); color: var(--accent-ink); }
  .ctl.idle input[type=range], .ctl.idle .marks { opacity: 0.4; }
  /* In full screen, a heads-up display of chosen controls: hidden until
     its button is pressed; the scene's own controls and every pinned slider. */
  .hud-btn { display: none; position: absolute; top: 16px; right: 66px; padding: 0 9px; font-size: 1.3em;
             line-height: 1.45; background: var(--panel); opacity: 0.9; }
  body.big .hud-btn { display: block; }
  /* (below the picture, which shrinks to make room: it never covers the
     figure or its face) */
  .hud { flex: 0 0 auto; max-height: 40vh; overflow: auto; border-radius: 14px;
         display: flex; flex-wrap: wrap; gap: 0 18px; padding: 6px 16px 10px;
         background: rgba(24, 20, 36, 0.86); color: #fff; }
  .hud[hidden] { display: none; }
  .hud .ctl { flex: 1 1 220px; margin: 6px 0; }
  .hud .ctl > .lbl .val { color: #ddd; }
  .hud .empty { color: #ddd; padding: 8px 0; }
  .pin { border: none; background: none; padding: 0; margin-right: 6px; font-size: 0.85em; opacity: 0.3;
         cursor: pointer; vertical-align: baseline; }
  .pin[aria-pressed=true] { opacity: 1; }
  /* in the HUD, an eye on each slider folds it away to its name, and back
     (it stays pinned) */
  .eye { border: none; background: none; padding: 0; margin-right: 6px; font-size: 0.95em; cursor: pointer; }
  .eye[aria-pressed=false] { opacity: 0.45; }
  .hud .ctl.min { flex: 0 0 auto; }
  .hud .ctl.min input, .hud .ctl.min .val { display: none; }
  .hud .ctl.min > .lbl { margin: 0; }
  .hud svg.place { max-width: 130px; }
  .hud .ctl.min svg.place { display: none; }
  /* a doorway into another scene (a picture, a window, a tree house, a
     door) glows under the pointer; a click goes through it */
  #bg .portal { cursor: pointer; }
  #bg .portal:hover { filter: drop-shadow(0 0 3px #fffbe0) drop-shadow(0 0 9px #ffd23f) brightness(1.08); }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <h1>Messed Up Dress Up</h1>
    <div class="pic-wrap">
      <svg id="pic" xmlns="http://www.w3.org/2000/svg"></svg>
      <button class="max-btn" id="max" title="Full screen" aria-label="Full screen">⤢</button>
      <button class="mute-btn" id="mute" title="Music on or off" aria-label="Music on or off" hidden>🔊</button>
      <button class="back-btn" id="back" hidden></button>
      <button class="hud-btn" id="hud-btn" title="Show the pinned controls" aria-label="Show the pinned controls" aria-pressed="false">🎛️</button>
      <div class="hud" id="hud" hidden></div>
    </div>
    <div class="caption" id="mood"></div>
    <div class="actions">
      <button class="big" id="surprise">🎲 Surprise me!</button>
      <button id="save" title="Saves the files checked below: a picture (.png), a drawing that prints at any size (.svg), and your friend's settings (.json) to load again later">💾 Save</button>
      <button id="load" title="Load a friend you saved (.json)">📂 Load</button>
      <input type="file" id="load-file" accept=".json,application/json" hidden>
      <button id="reset">↺ Start over</button>
    </div>
    <div class="formats" id="formats">
      <span id="formats-label">save as:</span>
      <label><input type="checkbox" value="png" checked> picture (.png)</label>
      <label><input type="checkbox" value="svg" checked> drawing (.svg)</label>
      <label><input type="checkbox" value="json" checked> settings (.json)</label>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
    <p class="hint" style="text-align:center">Drag the mouth or the eyebrows on the face, too!</p>
  </div>
  <div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
"use strict";

// ===================== STATE =====================

// Each tree house's own colors, for the kinds of house that have them: a
// cat's (a tuxedo cat to start), a fancy house's, a craftsman's. Kept per
// house: house3's cat can be orange while house5's is a tuxedo.
const HOUSE_COLOR_DEFAULTS = {
  cat: { catFur: "#1f1f22", catWhite: "#ffffff", catEyes: "#c6d43a" },
  fancy: { fancyWalls: "#d9c3e6", fancyRoof: "#6a4c93", fancyTrim: "#ffffff" },
  craftsman: { craftWalls: "#9aa982", craftRoof: "#5a3e2b", craftTrim: "#f4efe6", craftGable: "#c9b27a" },
};
const DEFAULTS = {
  face:  { color: "#cfa000", size: 46, smile: 85, brow: 30, sick: 0, burst: 0, candy: 0,
           stars: false, hearts: false, xeyes: false, unibrow: true, eyes: 50, sides: 0,
           rays: 0, teeth: 5, open: 0, teethStyle: "normal",
           tongue: "in", tongueLen: 100, tongueW: 100, tongueColor: "#e75480",
           lightX: -0.6, lightY: -0.6, shine: "#ffffff", shineMix: 100, shineSize: 45,
           pupil: "#000000", iris: 0, irisColor: "#3b82f6", whites: 0, oval: 0, tilt: 0,
           faceW: 100, faceH: 100, alien: 0, eyeGap: 38, noseView: "none", nose: "L", noseFront: "round", noseW: 100, noseH: 100,
           witchDir: "right", witchLen: 100, mouthSize: 100 },
  hair:  { style: "long", color: "#2b2b2b", length: 100 },
  body:  { neck: 22, neckW: 26, arms: 55, armLen: 95, armW: 16, legLen: 140, legW: 20 },
  shirt: { style: "tee", collar: "v", width: 60, length: 150, color: "#5b8bd0", pattern: "plain",
           patternSize: 14, patternColor: "auto" },
  hands: { style: "round", different: false, size: 14, color: "skin", fingers: 5, alienFingers: 3, clawLen: 100, clawCount: 4, starPoints: 5, starAngle: 0,
           mittenAngle: 0, clawAngle: 0, humanAngle: 0, alienAngle: 0 },
  pants: { style: "long", color: "#34495e", pattern: "plain", patternSize: 14, patternColor: "auto", skirtLen: 50 },
  undies: { on: false, style: "trunks", top: false, color: "#3b82f6", pattern: "plain", patternSize: 14,
            patternColor: "auto" },
  shoes: { style: "sneaker", different: false, size: 100, color: "#c0392b", toes: 5, alienToes: 3, talonCount: 4 },
  // the figure's size and place in a background scene (dragged there)
  background: { kind: "none", figSize: 100, figX: 0, figY: 0, chickenLegs: false, legSize: 100, hutNear: 0,
                eyeRate: 30, eyeGlow: 70, skullMax: 300, skullEye: 100, blinkApart: false,
                ducks: 5, duckSize: 100, cattails: 14, clouds: 4, cloudSize: 100,
                houseSize: 100, treeSize: 100, toys: 6, flowers: 18,
                houses: 4, bridges: 2, ladders: 3, leaves: 60,
                house1: "fox", house2: "owl", house3: "frog", house4: "bunny", house5: "bear", house6: "cat",
                ...Object.fromEntries([1, 2, 3, 4, 5, 6].flatMap(n => Object.values(HOUSE_COLOR_DEFAULTS).flatMap(d => Object.entries(d).map(([k, v]) => [k + n, v])))),
                inside: 1, room1: "bunks", room2: "kitchen", room3: "books", room4: "lookout", room5: "art", room6: "music",
                windowSize: 100, things: 10,
                witchX: 150, witchY: 0, witchSize: 100, cauldronSize: 100, crows: 3, frogs: 4, snakes: 2,
                seeHouse: true, seeTree: true, seeWitch: true, seeCastle: true, seeHealer: true,
                peakHeight: 100, mtClouds: 5, birds: 3, farLake: true,
                fallWidth: 100, vines: 8, mist: 60, parrots: 2,
                campTime: "day", fireOn: true, flameSize: 100, campFood: "none", tents: 2,
                couchSize: 100, pillows: 4, pictures: 3, picDetail: 70, picSize: 100,
                pic1: "lake", pic2: "beach", pic3: "livingroom", pic4: "forest", pic5: "treehouse", pic6: "underwater",
                view: "lake", viewDetail: 80,
                // each tree house room's own two pictures
                ...Object.fromEntries([["lake", "forest"], ["beach", "livingroom"], ["forest", "underwater"], ["treehouse", "lake"], ["house", "witch"], ["cemetery", "beach"]]
                  .flatMap((two, h) => two.map((kd, i) => [`r${h + 1}pic${i + 1}`, kd]))) },
  // the sliders pinned to the full-screen controls, as "part.key"
  hud: { pins: [], min: [] },
  costume: { kind: "none", fur: "#e8862a", marks: "#1f1a17", belly: "#f7ead8", eyes: "#e0a800",
             accent: "#e89aa0", furPattern: "stripes", spot: "auto",
             witchColor: "#6a2c91", webColor: "#3fae4a", webStyle: "tiled", trimColor: "#f28c28", witchCat: false, broom: false,
             catFur: "#1f1f22", catWhite: "#ffffff", catEyes: "#c6d43a", catNose: "#f4a0b0", catSize: 100, broomSize: 100, bootColor: "#1f1f22" },
};
const clone = o => JSON.parse(JSON.stringify(o));
// before the nose views: a nose was a shape (or "none"), a direction and
// one size
function upgradeFace(f, saved) {
  // before the teeth choice, teeth were the spikes, and 0 meant none
  if (saved && saved.teethStyle === undefined && saved.teeth !== undefined)
    f.teethStyle = saved.teeth > 0 ? "spikes" : "normal";
  if (!saved || saved.noseView !== undefined || saved.nose === undefined) return;
  f.noseView = saved.nose === "none" ? "none"
             : saved.noseDir === "left" ? "left" : saved.noseDir === "center" ? "front" : "right";
  f.nose = saved.nose === "none" ? "L" : saved.nose;
  f.noseFront = saved.nose === "angle" ? "pointed" : "round";
  if (saved.noseSize !== undefined) f.noseW = f.noseH = saved.noseSize;
}
// before the alien finger slider there were two alien styles
function upgradeHands(h) {
  if (h.style === "alien4" || h.style === "alien3") { h.alienFingers = h.style === "alien4" ? 4 : 3; h.style = "alien"; }
}
// Before 0.0.3 the friend's right hand had only a style of its own, and
// took the rest from the hands, as it drew: "leftStyle" in 0.0.1 (the hand
// on our left: the friend faces us), "rightStyle" in 0.0.2.
function upgradeRightHand(st, saved) {
  const h = st.hands, mine = h.leftStyle && h.leftStyle !== "same" ? h.leftStyle : h.rightStyle;
  if (h.leftStyle && h.leftStyle !== "same") h.different = true;
  if (!(saved && saved.rightHand)) {
    for (const k of HAND_OWN) st.rightHand[k] = h[k];
    if (mine) st.rightHand.style = mine;
  }
  delete h.leftStyle; delete h.rightStyle;
}
// What each hand has of its own: its style and that style's settings.
// With different hands, "hands" holds the friend's left hand's, and
// "rightHand" their right hand's; the color and the size are both hands'.
const HAND_OWN = ["style", "fingers", "alienFingers", "clawLen", "clawCount", "starPoints", "starAngle",
                  "mittenAngle", "clawAngle", "humanAngle", "alienAngle"];
DEFAULTS.rightHand = Object.fromEntries(HAND_OWN.map(k => [k, DEFAULTS.hands[k]]));
// The feet the same way: with different feet, "shoes" holds the friend's
// left foot's (on our right: they face us), and "rightShoe" their right
// foot's; the color and the size are both feet's.
const SHOE_OWN = ["style", "toes", "alienToes", "talonCount"];
DEFAULTS.rightShoe = Object.fromEntries(SHOE_OWN.map(k => [k, DEFAULTS.shoes[k]]));
// before 0.0.17 there was one tree house room, of a kind ("room"): now
// each house has its own, and "inside" says which house you are in
function upgradeInside(bg, saved) {
  const old = saved && saved.background;
  if (old && old.room && old.inside === undefined) bg.inside = Math.max(1, ["bunks", "kitchen", "books", "lookout"].indexOf(old.room) + 1);
}
// before 0.0.15 there were three toed styles, each with its own count
function upgradeFeet(st, saved) {
  if (!(saved && saved.rightShoe)) for (const k of SHOE_OWN) st.rightShoe[k] = st.shoes[k];
  for (const f of [st.shoes, st.rightShoe]) {
    if (f.style === "toes5") { f.style = "human"; f.toes = 5; }
    if (f.style === "alien4" || f.style === "alien3") { f.alienToes = f.style === "alien4" ? 4 : 3; f.style = "alien"; }
  }
}
// the music: the background's own tune (none without one) or a chosen one;
// the volume and mute belong to the device, not the friend: Load and Start
// over keep them
DEFAULTS.music = { track: "scene", volume: 60, mute: false, tempo: 100, transpose: 0, interval: 12, mix: {} };
let state = clone(DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem("dress-up-v1") || "null");
  if (saved) for (const k of Object.keys(DEFAULTS)) state[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
  upgradeHands(state.hands);
  upgradeRightHand(state, saved);
  upgradeFeet(state, saved);
  upgradeInside(state.background, saved);
  upgradeFace(state.face, saved.face);
  // pants length moved to the legs (leg length)
  if (saved && saved.pants && saved.pants.length && !(saved.body && saved.body.legLen))
    state.body.legLen = saved.pants.length;
} catch (_) { /* no storage: start fresh */ }
function persist() { try { localStorage.setItem("dress-up-v1", JSON.stringify(state)); } catch (_) {} }

// ===================== HELPERS =====================

const idiv = (a, b) => Math.trunc(a / b);           // Hazel's Int division
const mod = (a, n) => a - idiv(a, n) * n;
const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));
const f1 = x => (Math.round(x * 10) / 10).toString();
const pts = ps => ps.map(([x, y]) => f1(x) + "," + f1(y)).join(" ");

  // Eyes slant about their own middles, mirror images of each other:
  // tilt up and the outer corners rise, for almond alien eyes.
  const C = costumeOn(), kind = state.costume.kind;
  const hoodClips = C ? `<clipPath id="hood-brim"><rect x="-200" y="-400" width="600" height="454"/></clipPath>` +
                        `<clipPath id="hood-inside"><ellipse ${hoodEllipse(F)}/></clipPath>` : "";
  return `<defs>${clips}${hoodClips}</defs>` +
    (C ? `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${hoodBack(C, kind, F)}</g></g>` : "") +
    sideLines(F.sides) +
    (b > 0 ? part(' clip-path="url(#below-crack)"') : part()) +
    raysUp(rayLen, 3 + idiv(r, 25), crackY) +
    (b > 0 ? `<g transform="translate(0 ${-lift}) rotate(${-tilt} 100 ${f1(crackY)})">${part(' clip-path="url(#above-crack)"')}</g>` : "") +
    (C ? `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${hoodFront(C, kind, F)}</g></g>` : "") +
    pieces(shown, b, crackY) +
    (b > 0 ? `<path d="${crack}" fill="none" stroke="black" stroke-width="2"/>` : "") +
    `<g transform="translate(0 ${f1(LY.eyeY - 100)})">` +
      eye(100 - LY.eyeDX, F.eyes, F.stars, F.hearts, F.xeyes, F, F.tilt) +
      eye(100 + LY.eyeDX, F.eyes, F.stars, F.hearts, F.xeyes, F, -F.tilt) + `</g>` +
    noseSvg(F) +
    // the brows spread with the eyes (their path's points, so the line
    // keeps its width)
    `<path d="${(F.unibrow ? browPath(F.brow) : browPair(F.brow)).replace(/(-?[\d.]+) (-?[\d.]+)/g, (_, x, y) =>
        f1(100 + (Number(x) - 100) * LY.bx) + " " + f1(Number(y) + LY.eyeY - 100 - browLift(F)))}" ` +
      `stroke="black" fill="none" stroke-width="${F.unibrow ? 7 : 6}" stroke-linecap="round"/>` +
    // the mouth, at its place and grown with the head
    `<g transform="translate(100 ${f1(LY.mouthY)}) scale(${LY.mx.toFixed(3)} ${LY.my.toFixed(3)}) translate(-100 -150)">` +
    mouthSvg(F, o, upper, lower) +
    sickPile(F.sick, 150 + idiv(lower - 150, 2), 150 + (ground - LY.mouthY) / LY.my) + `</g>`;
}

// ===================== COSTUMES =====================
// An animal costume: a hood with the animal's face on its brim, above the
// wearer's own face, and either a full-body suit -- fur, paws, a belly and
// a tail -- or, for the falcon, wings worn on the back and a barred tail.
// Choosing an animal dresses it in its natural colors (see set()).
const ANIMALS = {
  tiger:  { suit: true,  fur: "#e8862a", marks: "#1f1a17", belly: "#f7ead8", eyes: "#e0a800", accent: "#e89aa0", furPattern: "stripes" },
  cat:    { suit: true,  fur: "#1f1f22", marks: "#3a3a40", belly: "#2e2e33", eyes: "#c6d43a", accent: "#f4a0b0", furPattern: "none" },
  lion:   { suit: true,  fur: "#d9a441", marks: "#8a4b1c", belly: "#f1d9a8", eyes: "#c88a1e", accent: "#5a3a2a", furPattern: "none" },
  bear:   { suit: true,  fur: "#6b4226", marks: "#4a2c17", belly: "#b08458", eyes: "#2b1a10", accent: "#1d1410", furPattern: "none" },
  falcon: { suit: false, fur: "#55616d", marks: "#23282e", belly: "#f2ece0", eyes: "#1a1410", accent: "#f2c230", furPattern: "none" },
  raccoon: { suit: true, fur: "#8d9096", marks: "#26262a", belly: "#e4e1da", eyes: "#3b2a1a", accent: "#26262a", furPattern: "none" },
  bobcat: { suit: true,  fur: "#c79a68", marks: "#4b3020", belly: "#f3e6cf", eyes: "#d9a520", accent: "#d98a8a", furPattern: "spots" },
  leopard: { suit: true, fur: "#e3b04b", marks: "#2b1d12", belly: "#f7ecd3", eyes: "#9bbf3a", accent: "#c97a7a", furPattern: "rosettes", spot: "auto" },
  eagle:  { suit: false, fur: "#4a3222", marks: "#2a1a10", belly: "#ffffff", eyes: "#f2c230", accent: "#f2b705", furPattern: "none" },
  // a black jaguar: nearly black, its rosettes just showing
  jaguar: { suit: true, fur: "#1e1c22", marks: "#3d3944", belly: "#2b2830", eyes: "#d4c23a", accent: "#3a363f", furPattern: "rosettes", spot: "auto" },
  cheetah: { suit: true, fur: "#e8b54a", marks: "#1c1410", belly: "#f8eed8", eyes: "#c88a1e", accent: "#2a1d14", furPattern: "spots" },
  // a grey wolf: tall pointed ears, a bushy tail with a dark tip, claws
  wolf: { suit: true, fur: "#8b8f97", marks: "#3f4249", belly: "#e8e6e1", eyes: "#e0a020", accent: "#1d1d1f", furPattern: "none" },
  // a deer, spotted like a fawn: antlers, long ears, a short white tail,
  // hooves
  deer: { suit: true, fur: "#a8682f", marks: "#fbf3e4", belly: "#f3e3c3", eyes: "#3b2414", accent: "#2a1a10", furPattern: "spots" },
  // a whole falcon suit: feathers all over, wings on the arms, talons
  falconsuit: { suit: true, fur: "#55616d", marks: "#23282e", belly: "#f2ece0", eyes: "#1a1410", accent: "#f2c230", furPattern: "none" },
  // and a bald eagle's: dark brown feathers, white head and tail
  eaglesuit: { suit: true, fur: "#4a3222", marks: "#2a1a10", belly: "#ffffff", eyes: "#f2c230", accent: "#f2b705", furPattern: "none" },
};
// cats (pointed ears, a triangle nose) and birds (no suit: wings and a tail)
const FELINE = { cat: 1, tiger: 1, bobcat: 1, leopard: 1, cheetah: 1, jaguar: 1 };
const BIRDS = { falcon: 1, eagle: 1, falconsuit: 1, eaglesuit: 1 };
// the bird suits: feathers all over, wings on the arms, talons
const BIRD_SUIT = { falconsuit: 1, eaglesuit: 1 };
// the bald eagle's head (hat or suit): white, with its beak
const eagleHead = kind => kind === "eagle" || kind === "eaglesuit";
const isBird = kind => !!BIRDS[kind];
// the falcon's head (hat or suit): its hood, moustache and face
const falconHead = kind => kind === "falcon" || kind === "falconsuit";
const lookOf = kind => { const { suit, ...look } = ANIMALS[kind]; return look; };
const costumeOn = () => (ANIMALS[state.costume.kind] ? state.costume : null);

// Fur: the fur color with little tufts, and stripes, spots or patches in
// the markings color. Feathers: the feather color with curved bars.
// A rosette's middle: "auto" is a warm brown mixed into the fur, "off"
// leaves the fur showing through (just the broken ring), or any color.
const rosetteMiddle = C =>
  !C.spot || C.spot === "auto" ? mix(C.fur, "#7a4a10", 0.35) : C.spot === "off" ? "none" : C.spot;
function furDefs(C, kind) {
  if (BIRD_SUIT[kind])   // feathers: the color with curved bars, all over
    return `<pattern id="pat-fur" width="24" height="12" patternUnits="userSpaceOnUse">` +
      `<rect width="24" height="12" fill="${C.fur}"/>` +
      `<path d="M0 9 Q6 6 12 9 Q18 12 24 9" stroke="${C.marks}" stroke-width="2.5" fill="none"/></pattern>` +
      `<pattern id="pat-bars" width="24" height="12" patternUnits="userSpaceOnUse">` +
      `<rect width="24" height="12" fill="${C.fur}"/>` +
      `<path d="M0 9 Q6 6 12 9 Q18 12 24 9" stroke="${C.marks}" stroke-width="2.5" fill="none"/></pattern>`;
  const tuft = mix(C.fur, "#000000", 0.3), m = C.marks;
  const marks = {
    // (stripes are not tiled: wrapStripes draws them on each part)
    spots:   `<circle cx="10" cy="10" r="4.5" fill="${m}"/><circle cx="30" cy="28" r="4" fill="${m}"/><circle cx="28" cy="8" r="2.5" fill="${m}"/>`,
    patches: `<ellipse cx="12" cy="14" rx="11" ry="8" fill="${m}"/><ellipse cx="34" cy="34" rx="9" ry="7" fill="${m}"/>`,
    // a leopard's rosettes: broken rings with a darker middle
    rosettes: [[11, 12, 5.5], [31, 30, 5]].map(([x, y, r]) =>
      `<circle cx="${x}" cy="${y}" r="${r}" fill="${rosetteMiddle(C)}" stroke="${m}" stroke-width="2.4" stroke-dasharray="5 2.6"/>`).join("") +
      `<circle cx="31" cy="9" r="2.2" fill="${m}"/><circle cx="9" cy="31" r="2" fill="${m}"/>`,
  }[C.furPattern] || "";
  return `<pattern id="pat-fur" width="40" height="40" patternUnits="userSpaceOnUse">` +
    `<rect width="40" height="40" fill="${C.fur}"/>${marks}` +
    `<path d="M5 22 q2 -4 4 0 M24 16 q2 -4 4 0 M14 36 q2 -4 4 0 M33 5 q2 -4 4 0" stroke="${tuft}" ` +
    `stroke-width="1.3" fill="none" opacity="0.7"/></pattern>` +
    `<pattern id="pat-bars" width="24" height="12" patternUnits="userSpaceOnUse">` +
    `<rect width="24" height="12" fill="${C.fur}"/>` +
    `<path d="M0 9 Q6 6 12 9 Q18 12 24 9" stroke="${m}" stroke-width="2.5" fill="none"/></pattern>`;
}

// WRAPPED STRIPES, a striped suit's (a tiger's, as Daniel Tiger wears
// them): each stripe comes round from the back, over a part's outline,
// and tapers to a point before the part's middle -- never across it.
const wrapStripes = C => C && C.furPattern === "stripes" && ANIMALS[state.costume.kind].suit &&
                         !BIRD_SUIT[state.costume.kind];
// One stripe from b (on or past the outline) to its tip t, w wide where it
// starts, bowed a little.
function stripe(b, t, w, color) {
  const dx = t[0] - b[0], dy = t[1] - b[1], d = Math.hypot(dx, dy) || 1;
  const nx = -dy / d * w / 2, ny = dx / d * w / 2, mx = (b[0] + t[0]) / 2, my = (b[1] + t[1]) / 2;
  return `<path d="M${f1(b[0] + nx)} ${f1(b[1] + ny)} Q${f1(mx + nx * 0.9)} ${f1(my + ny * 0.9)} ${f1(t[0])} ${f1(t[1])} ` +
         `Q${f1(mx - nx * 0.4)} ${f1(my - ny * 0.4)} ${f1(b[0] - nx)} ${f1(b[1] - ny)} Z" fill="${color}"/>`;
}
// Stripes on a limb, a band W wide from A to E: in from both edges every
// so often, from `from` along it, each ending short of the middle line by
// 15% of the half-width (a limb is narrow: shorter, they barely showed),
// and a little further along than it starts, so the two sides make a
// shallow V pointing down the limb.
function limbStripes(A, E, W, color, id, from = 0) {
  const dx = E[0] - A[0], dy = E[1] - A[1], len = Math.hypot(dx, dy);
  if (len < 1) return "";
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux, h = W / 2, gap = Math.max(18, W * 0.9);
  const at = (t, k) => [A[0] + ux * t + nx * k, A[1] + uy * t + ny * k];
  const band = [at(0, h), at(len, h), at(len, -h), at(0, -h)];
  let s = `<clipPath id="${id}"><polygon points="${pts(band)}"/></clipPath><g clip-path="url(#${id})">`;
  for (let t = from + gap * 0.6; t < len - gap * 0.4; t += gap)
    for (const side of [1, -1]) s += stripe(at(t, side * (h + 4)), at(t + gap * 0.2, side * h * 0.15), gap * 0.5, color);
  return s + `</g>`;
}
// Stripes on the body, in from both sides, every 24 down it, sloping a
// little down toward the middle; the belly, drawn over them, hides their
// tips, so they end before the middle.
function torsoStripes(outline, w, L, color) {
  let s = `<clipPath id="torso-stripes"><polygon points="${pts(outline)}"/></clipPath><g clip-path="url(#torso-stripes)">`;
  for (let y = 14; y < L - 10; y += 24)
    for (const side of [1, -1]) s += stripe([side * (w + 10), y], [side * w * 0.42, y + 7], 10, color);
  return s + `</g>`;
}
// Stripes on the legs (the suit's legs, one shape from the waist): on
// each leg, in from its outer edge and, below the crotch, its inner one,
// each ending short of the leg's middle line by 30% of the way.
function legStripes(outline, hw, fx, half, L, LL, crotch, color) {
  let s = `<clipPath id="leg-stripes"><polygon points="${pts(outline)}"/></clipPath><g clip-path="url(#leg-stripes)">`;
  for (let y = L + 14; y < L + LL - 8; y += 24)
    for (const side of [1, -1]) {
      const xo = hw + (fx + half - hw) * (y - (L - 10)) / (LL + 10);
      const xi = y > L + crotch ? (fx - half) * (y - (L + crotch)) / (LL - crotch) : null;
      const c = xi === null ? xo * 0.5 : (xo + xi) / 2;
      s += stripe([side * (xo + 8), y], [side * (c + (xo - c) * 0.3), y + 6], 10, color);
      // (starting in the gap between the legs, never in the other leg)
      if (xi !== null && c - xi > 8)
        s += stripe([side * Math.max(xi - 8, xi * 0.5), y], [side * (c - (c - xi) * 0.3), y + 6], 10, color);
    }
  return s + `</g>`;
}

// THE HOOD, in the round head's units (it stretches with the face, as hair
// does): behind the head, the hood and its ears (and a lion's mane); over
// the forehead, the brim, with the animal's face on it.
// It hugs the head as drawn: 32.6 above the crown and 27.4 below the chin
// (which an open mouth moves down), at any height. Drawn inside the
// face's stretch, so its ends are placed where they land once stretched.
function hoodGeom(F) {
  const H = F.faceH / 100, Hs = headH(F);
  const top = HEAD_C - 80 - 32.6 / Hs, bottom = HEAD_C + (80 * H + headDrop(F) + 27.4) / Hs;
  return { cy: (top + bottom) / 2, rx: 106, ry: (bottom - top) / 2 };
}
function hoodEllipse(F) {
  const { cy, rx, ry } = hoodGeom(F);
  return `cx="100" cy="${f1(cy)}" rx="${rx}" ry="${f1(ry)}"`;
}
function hoodBack(C, kind, F) {
  const HOOD = hoodEllipse(F);
  // a bald eagle's head is white
  const line = darker(C.fur), fill = eagleHead(kind) ? C.belly : ANIMALS[kind].suit ? "url(#pat-fur)" : C.fur;
  let s = "";
  if (kind === "lion") {
    const pts = [];
    for (let i = 0; i < 48; i++) {
      // the head's outline plus the mane's own 50-70, however tall the
      // head (placed where it lands once stretched)
      const t = i * Math.PI / 24, r = i % 2 ? 130 : 150, H = F.faceH / 100, Hs = headH(F);
      const grown = Math.sin(t) > 0 ? headDrop(F) : eyeLift(F);
      pts.push([100 + r * Math.cos(t), HEAD_C + ((80 * H + grown) * Math.sin(t) + (r - 80) * Math.sin(t)) / Hs]);
    }
    s += poly(pts, C.marks, darker(C.marks), 3);
  }
  for (const side of [-1, 1]) {
    const x = 100 + side * 68;
    if (kind === "wolf") {
      // tall pointed ears, pale inside
      s += poly([[100 + side * 30, 22], [100 + side * 80, -78], [100 + side * 96, 34]], C.fur, line, 3) +
           poly([[100 + side * 46, 16], [100 + side * 78, -54], [100 + side * 88, 24]], C.belly, "none", 0);
    } else if (kind === "deer") {
      // antlers first, their bases under the hood, then long ears out to
      // the side, pale inside
      const beam = `M${100 + side * 38} 14 Q${100 + side * 52} -50 ${100 + side * 96} -104 ` +
                   `M${100 + side * 48} -34 Q${100 + side * 30} -64 ${100 + side * 34} -94 ` +
                   `M${100 + side * 68} -66 Q${100 + side * 60} -100 ${100 + side * 66} -126 ` +
                   `M${100 + side * 84} -88 Q${100 + side * 104} -96 ${100 + side * 118} -86`;
      s += `<path d="${beam}" fill="none" stroke="#7a5a36" stroke-width="12" stroke-linecap="round"/>` +
           `<path d="${beam}" fill="none" stroke="#d9c29a" stroke-width="7" stroke-linecap="round"/>`;
      for (const [rx, ry, fill, w] of [[36, 15, C.fur, 3], [24, 8, C.belly, 0]])
        s += `<ellipse cx="${100 + side * 100}" cy="34" rx="${rx}" ry="${ry}" transform="rotate(${side * -22} ${100 + side * 100} 34)" ` +
             `fill="${fill}"${w ? ` stroke="${line}" stroke-width="${w}"` : ""}/>`;
    } else if (kind === "cat" || kind === "bobcat") {
      s += poly([[100 + side * 36, 16], [100 + side * 92, -46], [100 + side * 96, 40]], C.fur, line, 3) +
           poly([[100 + side * 50, 12], [100 + side * 86, -30], [100 + side * 88, 26]],
                kind === "bobcat" ? C.belly : C.accent, "none", 0);
      if (kind === "bobcat")  // the black tufts on a bobcat's ear tips
        s += poly([[100 + side * 88, -38], [100 + side * 96, -74], [100 + side * 95, -36]], C.marks, C.marks, 2);
    } else if (kind === "raccoon")
      // smaller, rounder ears with pale rims
      s += `<ellipse cx="${100 + side * 70}" cy="2" rx="22" ry="28" transform="rotate(${side * 25} ${100 + side * 70} 2)" ` +
           `fill="${C.belly}" stroke="${line}" stroke-width="3"/>` +
           `<ellipse cx="${100 + side * 70}" cy="6" rx="13" ry="18" transform="rotate(${side * 25} ${100 + side * 70} 6)" fill="${C.fur}"/>`;
    else if (!isBird(kind)) {
      const r = kind === "lion" ? 20 : 25;
      s += `<circle cx="${x}" cy="20" r="${r}" fill="${C.fur}" stroke="${line}" stroke-width="3"/>` +
           `<circle cx="${x}" cy="22" r="${r * 0.5}" fill="${kind === "tiger" ? "#ffffff" : C.belly}"/>`;
    }
  }
  s += `<ellipse ${HOOD} fill="${fill}" stroke="${line}" stroke-width="4"/>`;
  // wrapped stripes on the hood's sides, below the brim: in from the
  // edge toward the face, which covers their tips
  if (wrapStripes(C)) {
    const { cy, rx, ry } = hoodGeom(F);
    s += `<clipPath id="hood-stripes"><ellipse ${HOOD}/></clipPath><g clip-path="url(#hood-stripes)">`;
    for (const deg of [-12, 12, 36, 60])
      for (const side of [1, -1]) {
        const t = deg * Math.PI / 180, c = Math.cos(t) * side, sn = Math.sin(t);
        s += stripe([100 + (rx + 6) * c, cy + (ry + 6) * sn], [100 + (rx - 26) * c, cy + (ry - 26) * sn], 11, C.marks);
      }
    s += `</g>`;
  }
  if (falconHead(kind))  // the peregrine's dark "moustache" down each cheek
    for (const side of [-1, 1])
      s += `<path d="M${100 + side * 84} 52 Q${100 + side * 96} 96 ${100 + side * 84} 132 ` +
           `Q${100 + side * 72} 96 ${100 + side * 72} 52 Z" fill="${C.marks}"/>`;
  return s;
}
function hoodFront(C, kind, F) {
  const HOOD = hoodEllipse(F);
  const brimFill = falconHead(kind) ? C.marks : eagleHead(kind) ? C.belly : ANIMALS[kind].suit ? "url(#pat-fur)" : C.fur;
  let s = `<ellipse ${HOOD} fill="${brimFill}" stroke="${darker(C.fur)}" stroke-width="4" clip-path="url(#hood-brim)"/>` +
          `<line x1="0" y1="54" x2="200" y2="54" stroke="${darker(C.fur)}" stroke-width="4" clip-path="url(#hood-inside)"/>`;
  const shine = (x, y, r) => `<circle cx="${x - r * 0.35}" cy="${y - r * 0.35}" r="${r * 0.28}" fill="#ffffff"/>`;
  if (falconHead(kind)) {
    for (const x of [76, 124])
      s += `<circle cx="${x}" cy="26" r="12" fill="${C.accent}"/>` +
           `<circle cx="${x}" cy="26" r="8" fill="${C.eyes}"/>` + shine(x, 26, 8);
    s += `<path d="M92 31 Q100 26 108 31 L107 36 L93 36 Z" fill="${C.accent}"/>` +
         `<path d="M93 36 L107 36 Q109 47 100 58 Q101 47 93 36 Z" fill="#59636e" stroke="#2a2f35" stroke-width="1.5"/>`;
    return s;
  }
  if (eagleHead(kind)) {
    // a stern brow, yellow eyes, and a big hooked yellow beak
    for (const [x, side] of [[78, -1], [122, 1]])
      s += `<circle cx="${x}" cy="26" r="9" fill="${C.eyes}" stroke="#4a3a20" stroke-width="2"/>` +
           `<circle cx="${x}" cy="26" r="4" fill="#111"/>` + shine(x, 26, 6) +
           `<path d="M${x - side * 14} 14 L${x + side * 10} 19" stroke="#8a7a60" stroke-width="3" stroke-linecap="round"/>`;
    s += `<path d="M86 34 Q100 26 114 34 Q116 50 104 62 Q100 64 98 58 Q104 52 100 46 Q93 44 86 34 Z" ` +
         `fill="${C.accent}" stroke="${darker(C.accent)}" stroke-width="2" stroke-linejoin="round"/>`;
    return s;
  }
  if (kind === "raccoon")  // the bandit mask
    s += `<path d="M58 22 Q66 10 86 16 Q100 22 114 16 Q134 10 142 22 Q138 38 120 36 Q106 34 100 30 ` +
         `Q94 34 80 36 Q62 38 58 22 Z" fill="${C.marks}"/>`;
  if (kind === "cheetah")  // the cheetah's black "tear" lines, eyes to mouth
    s += `<path d="M84 31 Q83 40 89 48 M116 31 Q117 40 111 48" stroke="${C.marks}" stroke-width="3.2" ` +
         `fill="none" stroke-linecap="round"/>`;
  if (kind === "leopard")  // a few small spots on the brow
    s += [[86, 6, 2.6], [100, 2, 3], [114, 6, 2.6], [70, 12, 2.2], [130, 12, 2.2]].map(([x, y, r]) =>
      `<circle cx="${x}" cy="${y}" r="${r}" fill="${C.marks}"/>`).join("");
  if (kind === "tiger")
    s += `<path d="M90 2 L100 14 L110 2 M66 10 L80 18 M134 10 L120 18 M60 24 L74 28 M140 24 L126 28" ` +
         `stroke="${C.marks}" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  for (const x of [78, 122]) {
    s += `<ellipse cx="${x}" cy="24" rx="9" ry="8" fill="${C.eyes}" stroke="${kind === "raccoon" ? "#cfcfcf" : "#111"}" stroke-width="2"/>`;
    s += kind === "cat" ? `<ellipse cx="${x}" cy="24" rx="2.2" ry="7" fill="#111"/>`
                        : `<circle cx="${x}" cy="24" r="3.6" fill="#111"/>`;
    s += shine(x, 24, 8);
  }
  if (kind === "bear")
    s += `<ellipse cx="100" cy="42" rx="18" ry="11" fill="${C.belly}"/>`;
  else
    s += `<circle cx="92" cy="44" r="8" fill="${C.belly}"/><circle cx="108" cy="44" r="8" fill="${C.belly}"/>`;
  s += FELINE[kind]
    ? `<path d="M94 35 L106 35 L100 42 Z" fill="${C.accent}"/>`
    : `<path d="M91 34 Q100 31 109 34 Q105 43 100 44 Q95 43 91 34 Z" fill="${C.accent}"/>`;

// the lake: sky, far wood, the lake with ducks, cattails at its edge, a
// little beach, and dirt with thin grass on the near shore
function lakeScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, land, o, side } = c;
  const horizon = g - 250 * k, shore = g - 70 * k;

  s += SEP + cloudsSvg(c, o.clouds ?? 4, (o.cloudSize ?? 100) / 100, 30);
  s += SEP + part("lake-water", c.F, () => {
    let t = `<defs>${grad("bg-lake", "#2f7fc2", "#79c6ea", horizon, shore)}</defs>` + land(horizon - 6 * k, 4, "#5c9c4c", 0.4);
    // the far shore: a wood of round trees
    for (let i = 0; i < 24; i++) {
      const x = x0 - 20 * k + (W + 40 * k) * i / 23 + 12 * k * (R(i, 40) - 0.5), r = (22 + 18 * R(i, 41)) * k;
      t += `<ellipse cx="${f1(x)}" cy="${f1(horizon - 6 * k - r * 0.5)}" rx="${f1(r)}" ry="${f1(r * 0.9)}" fill="${["#3f7f3a", "#4b8f43", "#356f33"][i % 3]}"/>`;
    }
    t += `<rect x="${f1(x0 - pad)}" y="${f1(horizon)}" width="${f1(W + 2 * pad)}" height="${f1(shore - horizon + 14 * k)}" fill="url(#bg-lake)"/>`;
    for (let i = 0; i < 18; i++) {   // the sun on the water
      const d = R(i, 43), x = x0 + W * R(i, 42), y = horizon + (shore - horizon) * (0.08 + 0.84 * d), l = (6 + 14 * d) * k;
      t += `<line x1="${f1(x - l)}" y1="${f1(y)}" x2="${f1(x + l)}" y2="${f1(y)}" stroke="#ffffff" stroke-width="${f1(2 * k)}" stroke-linecap="round" opacity="0.7"/>`;
    }
    for (let i = 0; i < 7; i++) {    // lily pads, a flower on some
      const d = R(i, 45), x = x0 + W * (0.05 + 0.9 * R(i, 44)), y = horizon + (shore - horizon) * (0.3 + 0.65 * d), r = (8 + 12 * d) * k;
      t += `<path d="M${P(x, y)} L${P(x + r, y - r * 0.12)} A${f1(r)} ${f1(r * 0.38)} 0 1 1 ${P(x + r, y + r * 0.12)} Z" fill="#4f9a3a" stroke="#3a7a2a" stroke-width="${f1(k)}"/>` +
           (i % 3 === 0 ? `<circle cx="${f1(x - r * 0.3)}" cy="${f1(y - r * 0.2)}" r="${f1(r * 0.3)}" fill="#f7a8c8"/>` : "");
    }
    // the near shore: packed dirt, thin grass, and a little beach in the middle
    t += land(shore, 5, "#b59a68", 1.1) +
         `<path d="M${P(-W * 0.3, shore + 8 * k)} Q${P(0, shore - 10 * k)} ${P(W * 0.3, shore + 8 * k)} L${P(W * 0.22, y1 + pad)} L${P(-W * 0.22, y1 + pad)} Z" fill="#ecd8a2"/>` +
         `<path d="M${P(-W * 0.3, shore + 8 * k)} Q${P(0, shore - 10 * k)} ${P(W * 0.3, shore + 8 * k)}" fill="none" stroke="#c9b27a" stroke-width="${f1(5 * k)}"/>`;
    for (let i = 0; i < 46; i++) {
      const sd = side(i), x = sd * (W * 0.27 + W * 0.25 * R(i, 46)), y = shore + 14 * k + (y1 - shore) * R(i, 47), h = (8 + 10 * R(i, 48)) * k;
      t += `<path d="M${P(x - 5 * k, y - h * 0.7)} L${P(x - 2 * k, y)} L${P(x, y - h)} L${P(x + 2 * k, y)} L${P(x + 6 * k, y - h * 0.6)}" fill="none" stroke="#6f9b3c" stroke-width="${f1(1.6 * k)}" stroke-linejoin="round"/>`;
    }
    for (let i = 0; i < 14; i++) {   // pebbles on the beach
      const x = W * 0.36 * (R(i, 49) - 0.5), y = shore + 30 * k + (y1 - shore - 40 * k) * R(i, 50);
      t += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1((3 + 4 * R(i, 51)) * k)}" ry="${f1(2.5 * k)}" fill="${["#9a9389", "#b8b0a3", "#7d776e"][i % 3]}"/>`;
    }

  });
  // ducks: one drawing, its size the slider's, and one <use> for each duck
  s += SEP + part("lake-ducks", [c.F, ducks, dsz], () => `<defs><g id="bg-duck"><g transform="scale(${+dsz.toFixed(3)})">` +
      `<ellipse cx="0" cy="3" rx="36" ry="5" fill="#ffffff" opacity="0.35"/>` +
      `<path d="M-30 -10 L-42 -22 L-28 -17 Z" fill="#2b2b2b"/>` +
      `<path d="M-32 -6 Q-36 -27 -12 -27 L14 -25 Q32 -22 29 -6 Q20 2 -2 2 Q-26 2 -32 -6 Z" fill="#9a958b"/>` +
      `<path d="M8 -6 Q20 -4 28 -11 Q31 -22 22 -25 Q12 -18 8 -6 Z" fill="#7a4a2a"/>` +
      `<path d="M-16 -20 Q4 -31 17 -16 Q2 -11 -16 -20 Z" fill="#6b5a48"/>` +
      `<path d="M13 -27 L27 -27 L29 -20 L12 -20 Z" fill="#1f7a3a"/><path d="M13 -25 L28 -25 L28 -22 L13 -22 Z" fill="#ffffff"/>` +
      `<circle cx="20" cy="-37" r="11" fill="#1f7a3a"/><path d="M29 -40 Q43 -38 42 -34 Q35 -32 29 -35 Z" fill="#f2b13a"/>` +
      `<circle cx="23" cy="-40" r="2.2" fill="#111"/></g></g></defs>` +
    [...Array(ducks)].map((_, i) => { const d = R(i, 52); return { d, i }; }).sort((a, b) => a.d - b.d).map(({ d, i }) =>
      use("bg-duck", x0 + W * (0.06 + 0.88 * R(i, 53)), horizon + 16 * k + (shore - horizon - 40 * k) * d, k * (R(i, 54) < 0.5 ? -1 : 1) * (0.45 + 0.75 * d), k * (0.45 + 0.75 * d))).join(""));

      `<path d="M0 0 Q-14 -60 -30 -108 M2 0 Q16 -50 26 -94 M-2 0 Q-4 -70 -12 -136" fill="none" stroke="#5b8f35" stroke-width="4" stroke-linecap="round"/>` +
      `<line x1="0" y1="0" x2="2" y2="-152" stroke="#6f8f3a" stroke-width="3"/><rect x="-5" y="-132" width="13" height="44" rx="6.5" fill="#6b3f1f"/>` +
      `<line x1="1.5" y1="-132" x2="1.5" y2="-154" stroke="#7a6a3a" stroke-width="2"/></g></defs>` +
    [...Array(tails)].map((_, i) =>
      use("bg-cattail", side(i) * (W * 0.25 + W * 0.25 * R(i, 60)), shore + 10 * k * R(i, 61), k * (R(i, 63) < 0.5 ? -1 : 1) * (0.75 + 0.5 * R(i, 62)), k * (0.75 + 0.5 * R(i, 62)))).join(""));
  return s;
}

const streamAt = ({ W, g, k, y1, pad }) => u => {
  const a = [W * 0.17, g - 125 * k], b = [W * 0.52, g - 40 * k], e = [W * 0.36, y1 + pad * 0.2];

  return [x + 14 * k * Math.sin(u * 9), y, (5 + 95 * u * u + 20 * u) * k];

  for (let i = 0; i <= 30; i++) { const [sx, sy, hw] = sp(i / 30); if (Math.abs(sy - y) < 12 * margin / 8 && Math.abs(sx - x) < hw + margin) return true; }

function houseBuildingSvg() {
    let t = `<rect x="-220" y="-300" width="320" height="300" fill="#8a5a32"/>`;
    for (let y = -288; y < 0; y += 12) t += `<line x1="-220" y1="${y}" x2="100" y2="${y}" stroke="#74492a" stroke-width="1.5"/>`;
    t += `<rect x="-220" y="-300" width="8" height="300" fill="#6b4423"/><rect x="92" y="-300" width="8" height="300" fill="#6b4423"/>` +

    for (let y = -380; y < -296; y += 14) { const half = (y + 398) / 102 * 184; t += `<line x1="${f1(-60 - half)}" y1="${y}" x2="${f1(-60 + half)}" y2="${y}" stroke="#2c1f18" stroke-width="2"/>`; }
    t += `<circle cx="-60" cy="-338" r="15" fill="#bfe3f5" stroke="#ffffff" stroke-width="4"/>` +
         [-180, -60, 60].map(x => winSvg(x, -255, 48, 60)).join("") + [-170, 50].map(x => winSvg(x, -122, 58, 72)).join("") +
         // the front door, its little roof and its step

         `<rect x="-72" y="-96" width="24" height="18" fill="#bfe3f5"/><circle cx="-46" cy="-50" r="3.5" fill="#f2c12e"/></g>` +

    // the garage on the right
    t += `<rect x="100" y="-165" width="190" height="165" fill="#8a5a32"/>`;
    for (let y = -153; y < 0; y += 12) t += `<line x1="100" y1="${y}" x2="290" y2="${y}" stroke="#74492a" stroke-width="1.5"/>`;
    t += `<polygon points="88,-160 302,-160 195,-226" fill="#3d2b22"/><rect x="118" y="-132" width="154" height="132" fill="#f1ede4" stroke="#cfc8b8" stroke-width="2"/>` +
         [-99, -66, -33].map(y => `<line x1="118" y1="${y}" x2="272" y2="${y}" stroke="#cfc8b8" stroke-width="2"/>`).join("") +

      t += `<circle cx="${x}" cy="${-r * 0.6}" r="${r}" fill="#3f8a3a"/><circle cx="${x - r * 0.3}" cy="${-r * 0.9}" r="${r * 0.45}" fill="#55a54d"/>`;

function houseScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, land, o, side } = c;
  const hs = (o.houseSize ?? 100) / 100, ts = (o.treeSize ?? 100) / 100, toys = o.toys ?? 6, flowers = o.flowers ?? 18;
  const yb = g - 175 * k, bx = -40 * k, S = hs * k;   // the building's base and its middle; its scale
  const X = lx => bx + lx * S;                          // a point on the building, in the scene
  let s = SEP + part("house-sky", c.F, () => `<defs>${grad("bg-sky", "#62b8ee", "#e2f4ff", y0, yb)}</defs>` + all("url(#bg-sky)") +
                                        land(yb - 30 * k, 6, "#8fc96c", 0.2) + land(yb - 8 * k, 3, "#7cc25a", 0.7));
  s += SEP + cloudsSvg(c, 3, 0.8, 80);
  // the driveway from the garage door, the stone walk from the front door
  s += SEP + part("house-paths", [c.F, hs], () => {
    const gl = X(120), gr = X(270), d = X(-60);
    let t = `<polygon points="${P(gl, yb)} ${P(gr, yb)} ${P(gr + 150 * k, y1 + pad)} ${P(gl + 30 * k, y1 + pad)}" fill="#a3a09a"/>` +
            [0.3, 0.6].map(u => `<line x1="${f1(gl + 30 * k * u)}" y1="${f1(yb + (y1 - yb) * u)}" x2="${f1(gr + 150 * k * u)}" y2="${f1(yb + (y1 - yb) * u)}" stroke="#8a8780" stroke-width="${f1(2 * k)}"/>`).join("");
    for (let j = 0; j < 9; j++) for (let m = 0; m < 3; m++) {
      const u = (j + 0.5) / 9, cx = d + (0 - d) * u, cy = yb + 8 * k + (y1 - yb) * u, w = (50 * hs + 110 * u) * k, h = (8 + 20 * u) * k;
      const sx = cx + (m - 1) * w / 3 + w * 0.05 * (R(j * 3 + m, 90) - 0.5);
      let pts = "";
      for (let a = 0; a < 6; a++) {
        const ang = a * Math.PI / 3, rr = 0.8 + 0.25 * R(j * 18 + m * 6 + a, 91);
        pts += P(sx + Math.cos(ang) * w / 7 * rr, cy + Math.sin(ang) * h / 2 * rr) + " ";
      }
      t += `<polygon points="${pts}" fill="${["#a8a39a", "#8f8a80", "#bdb6aa"][(j + m) % 3]}" stroke="#6f6a60" stroke-width="${f1(1.2 * k)}"/>`;
    }
    return t;
  });
  // the trees beside the house: one drawing, its size the slider's
  s += SEP + part("house-trees", [c.F, hs, ts], () => `<defs>${oakDef("bg-oak", ts)}</defs>` +
    use("bg-oak", Math.max(X(-300), x0 + 50 * k), yb + 20 * k, k) + use("bg-oak", Math.min(X(370), x1 - 50 * k), yb + 30 * k, k));
  // the building, in its own units: its size is its group's transform
  s += OPEN(`<g id="bg-building" ${tf(bx, yb, S)}>`) + part("house-building", [], houseBuildingSvg);
  // flowers in the bed in front of the bushes (not the door's): two
  // drawings, colored by their <use>, in the building's group
  s += SEP + part("house-flowers", [flowers], () => `<defs>${FLOWER_DEFS}</defs>` +
    [...Array(flowers)].map((_, i) => use(i % 2 ? "bg-daisy" : "bg-tulip", (i % 16 < 8 ? -222 : -12) + (i % 8) * 14.5 + 4 * R(i, 95), 6 + 9 * Math.floor(i / 16), 1, 1,
      ` color="${["#e53935", "#ffffff", "#f7a8c8", "#f2c12e", "#9b59b6", "#ff8c42"][i % 6]}"`)).join("")) + CLOSE;
  // toys on the lawn, either side of the walk, off the driveway
  s += SEP + part("house-toys", [c.F, hs, toys], () => `<defs>${toyDefs}</defs>` + [...Array(toys)].map((_, i) => {
    const u = R(i, 71), y = yb + 40 * k + (y1 - yb - 70 * k) * u;
    let x = side(i) * (W * 0.16 + W * 0.3 * R(i, 70));
    const drive = X(120) + 30 * k * (y - yb) / (y1 + pad - yb);
    if (x > drive - 30 * k) x = -x;
    return use(`bg-toy-${TOYS[i % TOYS.length]}`, x, y, k * (0.9 + 0.8 * u) * (R(i, 72) < 0.5 ? -1 : 1), k * (0.9 + 0.8 * u));
  }).join(""));
  return s;
}

// once, not forever
const PICTURE_KINDS = ["lake", "beach", "livingroom", "forest", "treehouse", "underwater", "house", "witch", "cemetery", "treeroom"];

function pictureSvg(kind, detail, o, depth, x, y, w, h) {

    prefixIds(unmarked(backgroundSvg(kind, SCENE.left, SCENE.top, -SCENE.left, SCENE.bottom, SCENE.ground, oo)), `p${depth}${kind}-`));

    doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${full}</svg>`, "image/svg+xml").documentElement;
    if (SCENE_PARTS.size > 40) SCENE_PARTS.clear();

  // its drawings in the order they are painted, into its groups too
  // (kept by scene and detail: another slider in the room trims nothing)
  const trimmed = full + "\u0000" + detail;
  let body = TRIMMED.get(trimmed);
  if (body === undefined) {
    const root = doc.cloneNode(true), drawn = [];
    const walk = el => { for (const e of el.children) if (e.tagName === "g") walk(e); else if (e.tagName !== "defs") drawn.push(e); };
    walk(root);
    for (const e of drawn.slice(2 + Math.round((drawn.length - 2) * detail / 100))) e.remove();
    if (TRIMMED.size > 200) TRIMMED.clear();

         (blur > 0.2 ? `<defs><filter id="${fid}" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="${f1(blur)}"/></filter></defs><g filter="url(#${fid})">${body}</g>` : body) +

const framedSvg = (kind, detail, o, depth, x, y, w) => {
  const h = w * 0.74, fr = w * 0.07, mat = w * 0.04;

         `<rect x="${f1(x - w / 2 + fr)}" y="${f1(y - h / 2 + fr)}" width="${f1(w - 2 * fr)}" height="${f1(h - 2 * fr)}" fill="#f7f2e6"/>` +

  ["clearing", "🌲 forest clearing"], ["mountains", "⛰️ mountain trail"], ["waterfall", "💦 jungle waterfall"], ["campsite", "🏕️ camp site"]];

    let t = land(near, 3, "#7cc25a", 0.6) + `<path d="M${P(-40 * k, y1 + pad)} L${P(40 * k, y1 + pad)} L${P(26 * k, near)} L${P(-26 * k, near)} Z" fill="#d9c08a"/>`;
    for (const T of shown) {
      // (to where it stands on the ground: its door, its gate, its foot)
      const x = W * T.at[0], y = near - T.at[1] * k + (T.foot + 4) * T.size * k;
      t += `<path d="M${P(0, near + 4 * k)} Q${P(x * 0.5, Math.max(y, near - 10 * k))} ${P(x, y)}" fill="none" stroke="#d9c08a" stroke-width="${f1(14 * k)}" stroke-linecap="round"/>`;
    }
    for (let i = 0; i < 40; i++) {   // flowers in the near grass
      const d = R(i, 312), x = x0 + W * R(i, 313), y = near + 10 * k + (y1 - near) * d;
      if (Math.abs(x) < (40 + 30 * d) * k) continue;
      t += use(i % 2 ? "bg-daisy" : "bg-tulip", x, y, k * (0.8 + 0.6 * d), k * (0.8 + 0.6 * d), ` color="${FLOWER_COLORS[i % 6]}"`);
    }
    return `<defs>${FLOWER_DEFS}</defs>` + t;
  });
  // the things far off, each its own piece, over the paths' far ends
  for (const T of shown) {
    const x = W * T.at[0], y = near - T.at[1] * k;
    const z = T.size * (T.grow ? T.grow(o) : 1) * k;
    s += SEP + (T.to ? `<g class="portal" data-to="${T.to}">` : "") + `<g ${tf(x, y, z)}>${T.draw(o, c)}</g>` + (T.to ? `</g>` : "");
  }
  // near trees at the frame's edges, framing the clearing
  s += SEP + part("clear-near-woods", c.F, () => [-1, 1].map(sd => [[0, 0, 1.15], [1, 40, 0.8]].map(([j, dy, z]) =>
    use("bg-woods-oak", sd * (W * 0.5 + 40 * k - j * 30 * k), g + (40 + dy) * k, k * z * sd, k * z)).join("")).join(""));
  return s;
}
// Three places away from the woods: a mountain trail, a jungle waterfall,
// and a camp site. A signpost on the trail points (a doorway each) to the
// other two, and each of them has a sign back to the trail.
const PINE_DEF = `<g id="bg-pine"><rect x="-6" y="-30" width="12" height="32" fill="#5e3d22"/>` +
  `<polygon points="0,-200 -50,-28 50,-28" fill="currentColor"/><polygon points="0,-200 -14,-150 0,-60 12,-120" fill="#ffffff" opacity="0.1"/></g>`;
// a wooden signpost, its arrows doorways (each [text, to, side]), at (x, base)
const signpost = (x, base, k, arrows) => `<rect x="${f1(x - 5 * k)}" y="${f1(base - 150 * k)}" width="${f1(10 * k)}" height="${f1(150 * k)}" fill="#6e4a2c"/>` +
  arrows.map(([text, to, sd], i) => {
    const y = base - (130 - i * 42) * k, w = 120 * k, x1 = sd > 0 ? x : x - w, tip = sd > 0 ? x + w + 16 * k : x - w - 16 * k;
    return `<g class="portal" data-to="${to}"><polygon points="${P2(x1, y - 16 * k)} ${P2(x1 + w, y - 16 * k)} ${P2(sd > 0 ? tip : x1 + w, sd > 0 ? y : y - 16 * k)} ` +
           `${P2(x1 + w, y + 16 * k)} ${P2(x1, y + 16 * k)} ${P2(sd > 0 ? x1 : tip, sd > 0 ? y + 16 * k : y)}" fill="#a0703f" stroke="#5e3d22" stroke-width="${f1(2.5 * k)}"/>` +
           `<text x="${f1(x1 + w / 2)}" y="${f1(y + 7 * k)}" text-anchor="middle" font-size="${f1(19 * k)}" font-weight="bold" fill="#fff8e7" font-family="sans-serif">${text}</text></g>`;
  }).join("");
const P2 = (x, y) => `${f1(x)},${f1(y)}`;
// a cloud that drifts, back and forth, slowly
const driftingCloud = (x, y, s, i) => `<use href="#bg-cloud" ${tf(x, y, s)}><animateTransform attributeName="transform" type="translate" additive="sum" ` +
  `values="0 0;${30 + 12 * (i % 3)} 0;0 0" dur="${24 + 7 * (i % 4)}s" repeatCount="indefinite"/></use>`;

// The mountain trail: far snowy peaks (their height a slider: they stand
// in a group that stretches them up from the valley), a lake and a village
// far below, drifting clouds, birds circling, and the trail going on up.
function mountainsScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, land, o, side } = c;
  const peaks = (o.peakHeight ?? 100) / 100, birds = o.birds ?? 3, clouds = o.mtClouds ?? 5, lake = o.farLake ?? true;
  const valley = g - 150 * k;
  let s = SEP + part("mt-sky", c.F, () => `<defs>${grad("bg-sky", "#4f9fe0", "#e2f2ff", y0, valley)}${cloudDef("bg-cloud", 1)}</defs>` + all("url(#bg-sky)") +
    `<circle cx="${f1(x1 - W * 0.12)}" cy="${f1(y0 + H * 0.12)}" r="${f1(30 * k)}" fill="#fff6c8"/>`);
  // the high clouds, behind the peaks
  s += SEP + part("mt-clouds-high", [c.F, clouds], () => [...Array(Math.ceil(clouds / 2))].map((_, i) =>
    driftingCloud(x0 + W * (0.1 + 0.8 * R(i, 320)), y0 + H * (0.06 + 0.12 * R(i, 321)), k * (0.6 + 0.4 * R(i, 322)), i)).join(""));
  // the peaks, three ranges, far to near, snow on the far ones
  s += OPEN(`<g transform="translate(0 ${f1(valley)}) scale(1 ${peaks.toFixed(3)}) translate(0 ${f1(-valley)})">`) + part("mt-peaks", c.F, () => {
    let t = "";
    [[0, "#b6c6dc", 330, 9, true], [1, "#8ea3c0", 250, 7, true], [2, "#6d8296", 170, 6, false]].forEach(([r, fill, hgt, n, snow]) => {
      const base = valley + r * 12 * k, pts = [[x0 - pad, base]];
      for (let i = 0; i <= n; i++) {
        const x = x0 - 60 * k + (W + 120 * k) * i / n + 30 * k * (R(i + r * 10, 323) - 0.5);
        pts.push([x - (W / n) * 0.45, base - hgt * k * (0.35 + 0.3 * R(i + r * 10, 324))], [x, base - hgt * k * (0.75 + 0.25 * R(i + r * 10, 325))]);
      }
      pts.push([x1 + pad, base], [x1 + pad, base + 60 * k], [x0 - pad, base + 60 * k]);
      t += `<polygon points="${pts.map(([x, y]) => P2(x, y)).join(" ")}" fill="${fill}"/>`;
      if (snow) for (let i = 2; i < pts.length - 3; i += 2) {
        const [px, py] = pts[i], d = 0.22 * (base - py);
        t += `<polygon points="${P2(px, py)} ${P2(px - d * 0.8, py + d)} ${P2(px - d * 0.3, py + d * 0.8)} ${P2(px, py + d * 1.05)} ${P2(px + d * 0.4, py + d * 0.75)} ${P2(px + d * 0.8, py + d)}" fill="#ffffff" opacity="0.92"/>`;
      }
    });
    return t;
  }) + CLOSE;
  // far below: a lake and a village by it (or not)
  if (lake) s += SEP + part("mt-lake", c.F, () => `<ellipse cx="${f1(W * 0.18)}" cy="${f1(valley + 22 * k)}" rx="${f1(120 * k)}" ry="${f1(14 * k)}" fill="#5aa9e0"/>` +
    `<ellipse cx="${f1(W * 0.18)}" cy="${f1(valley + 20 * k)}" rx="${f1(90 * k)}" ry="${f1(6 * k)}" fill="#bfe3f5" opacity="0.6"/>` +
    [...Array(7)].map((_, i) => { const x = W * 0.18 - 150 * k + i * 16 * k, y = valley + 18 * k + 6 * k * R(i, 326);
      return `<rect x="${f1(x)}" y="${f1(y - 7 * k)}" width="${f1(10 * k)}" height="${f1(7 * k)}" fill="#f4efe6"/><polygon points="${P2(x - 1 * k, y - 7 * k)} ${P2(x + 5 * k, y - 12 * k)} ${P2(x + 11 * k, y - 7 * k)}" fill="${["#c0392b", "#8a5a32", "#3b5ea8"][i % 3]}"/>`; }).join(""));
  // the low clouds, in front of the peaks
  s += SEP + part("mt-clouds-low", [c.F, clouds], () => [...Array(Math.floor(clouds / 2))].map((_, i) =>
    driftingCloud(x0 + W * (0.05 + 0.9 * R(i, 327)), valley - (40 + 90 * R(i, 328)) * k, k * (0.8 + 0.5 * R(i, 329)), i + 2)).join(""));
  // the near slope: grass, rocks, the trail winding off uphill
  s += SEP + part("mt-slope", c.F, () => {
    let t = `<defs>${PINE_DEF}</defs>` + land(valley + 40 * k, 14, "#8fb35a", 0.8) + land(g - 30 * k, 6, "#7aa34e", 1.6);
    const L = [], Rr = [];
    for (let i = 0; i <= 20; i++) {
      const u = i / 20, y = y1 + 10 * k - (y1 - valley - 50 * k) * u, x = W * 0.05 * Math.sin(u * 5) - W * 0.25 * u * u, w = (90 - 80 * u) * k;
      L.push(P2(x - w / 2, y)); Rr.push(P2(x + w / 2, y));
    }
    t += `<polygon points="${[...L, ...Rr.reverse()].join(" ")}" fill="#c9a774"/>`;
    for (let i = 0; i < 9; i++) {
      const x = side(i) * (W * 0.18 + W * 0.28 * R(i, 330)), y = g - 10 * k + 70 * k * R(i, 331), r = (12 + 20 * R(i, 332)) * k;
      t += `<path d="M${P(x - r, y)} L${P(x - r * 0.6, y - r * 0.8)} L${P(x + r * 0.2, y - r)} L${P(x + r, y - r * 0.3)} L${P(x + r * 1.1, y)} Z" fill="${["#8a8a8a", "#9c9c9c", "#7a7a7a"][i % 3]}" stroke="#5a5a5a" stroke-width="${f1(1.5 * k)}"/>`;
    }
    for (let i = 0; i < 8; i++) t += use("bg-pine", side(i) * (W * 0.36 + W * 0.14 * R(i, 333)), g + 30 * k * R(i, 334), k * (0.9 + 0.5 * R(i, 335)), k * (0.9 + 0.5 * R(i, 335)),
      ` color="${["#2f6e3a", "#3a7d44", "#285e33"][i % 3]}"`);
    return t;
  });
  // the signpost by the trail: to the falls, and to the camp
  s += SEP + part("mt-sign", c.F, () => signpost(-W * 0.2, g + 10 * k, k, [["💦 falls", "waterfall", -1], ["🏕️ camp", "campsite", 1]]));
  // birds, circling high up
  s += SEP + part("mt-birds", [c.F, birds], () => [...Array(birds)].map((_, i) => {
    const cx = x0 + W * (0.2 + 0.6 * R(i, 336)), cy = y0 + H * (0.15 + 0.15 * R(i, 337)), rx = (50 + 40 * R(i, 338)) * k, ry = rx * 0.35;
    return `<path d="M${f1(-12 * k)} 0 Q${f1(-6 * k)} ${f1(-7 * k)} 0 0 Q${f1(6 * k)} ${f1(-7 * k)} ${f1(12 * k)} 0" fill="none" stroke="#333" stroke-width="${f1(2.5 * k)}">` +
           `<animateMotion path="M${P(cx - rx, cy)} A${f1(rx)} ${f1(ry)} 0 1 1 ${P(cx + rx, cy)} A${f1(rx)} ${f1(ry)} 0 1 1 ${P(cx - rx, cy)}" dur="${(9 + 5 * R(i, 339)).toFixed(1)}s" repeatCount="indefinite"/></path>`;
  }).join(""));
  return s;
}

// The jungle waterfall: a mossy cliff, the water falling (streaks running
// down it), a pool below with ripples, mist rising, big-leaved trees,
// vines swaying, parrots, flowers.
function waterfallScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, land, o, side } = c;
  const fw = (o.fallWidth ?? 100) / 100, vines = o.vines ?? 8, mist = (o.mist ?? 60) / 100, parrots = o.parrots ?? 2;
  const top = y0 + H * 0.12, pool = g - 70 * k;
  let s = SEP + part("wf-back", c.F, () => {
    let t = `<defs>${grad("bg-sky", "#9fd8c8", "#e8fff4", y0, g)}</defs>` + all("url(#bg-sky)");
    // the far jungle, layers of round crowns
    for (const [row, fill, yb, n] of [[0, "#5f9a6a", y0 + H * 0.3, 16], [1, "#3f8050", y0 + H * 0.42, 14]])
      for (let i = 0; i < n; i++) {
        const x = x0 - 20 * k + (W + 40 * k) * i / (n - 1), r = (40 + 25 * R(i + row * 20, 340)) * k;
        t += `<circle cx="${f1(x)}" cy="${f1(yb + 10 * k * R(i, 341))}" r="${f1(r)}" fill="${fill}"/>`;
      }
    // the cliff, mossy, the falls' lip at its top
    t += `<path d="M${P(-W * 0.34, pool)} L${P(-W * 0.3, top + 40 * k)} Q${P(-W * 0.2, top - 10 * k)} ${P(-W * 0.06, top)} L${P(W * 0.08, top)} Q${P(W * 0.22, top - 12 * k)} ${P(W * 0.3, top + 30 * k)} L${P(W * 0.36, pool)} Z" fill="#6e6a62"/>`;
    for (let i = 0; i < 14; i++) {
      const x = -W * 0.3 + W * 0.62 * R(i, 342), y = top + 20 * k + (pool - top - 40 * k) * R(i, 343);
      t += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1((14 + 14 * R(i, 344)) * k)}" ry="${f1(7 * k)}" fill="${i % 2 ? "#4f8a3a" : "#5c5850"}" opacity="0.85"/>`;
    }
    return t;
  });
  // the falls: a sheet of water, streaks running down it, foam at the lip
  s += SEP + part("wf-falls", [c.F, fw], () => {
    const half = 60 * fw * k;
    let t = `<defs><linearGradient id="bg-falls" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ad7f0"/><stop offset="0.5" stop-color="#e6f8ff"/><stop offset="1" stop-color="#9ad7f0"/></linearGradient></defs>` +
            `<path d="M${P(-half, top)} L${P(half, top)} L${P(half * 1.25, pool)} L${P(-half * 1.25, pool)} Z" fill="url(#bg-falls)" opacity="0.95"/>`;
    const n = Math.max(4, Math.round(10 * fw));
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n, xa = -half + 2 * half * u, xb = -half * 1.25 + 2.5 * half * u, dash = (30 + 30 * R(i, 345)) * k, gap = (20 + 20 * R(i, 346)) * k;
      t += `<line x1="${f1(xa)}" y1="${f1(top)}" x2="${f1(xb)}" y2="${f1(pool)}" stroke="#ffffff" stroke-width="${f1((2 + 3 * R(i, 347)) * k)}" stroke-dasharray="${f1(dash)} ${f1(gap)}" opacity="0.8">` +
           `<animate attributeName="stroke-dashoffset" values="0;${f1(-(dash + gap) * 2)}" dur="${(0.6 + 0.4 * R(i, 348)).toFixed(2)}s" repeatCount="indefinite"/></line>`;
    }
    return t + `<ellipse cx="0" cy="${f1(top)}" rx="${f1(half * 1.1)}" ry="${f1(6 * k)}" fill="#ffffff" opacity="0.9"/>`;
  });
  // the pool, ripples spreading
  s += SEP + part("wf-pool", c.F, () => land(pool + 30 * k, 6, "#5f8a3a", 0.3) +
    `<ellipse cx="0" cy="${f1(pool + 30 * k)}" rx="${f1(W * 0.42)}" ry="${f1(55 * k)}" fill="#3f9ad0"/>` +
    `<ellipse cx="0" cy="${f1(pool + 24 * k)}" rx="${f1(W * 0.34)}" ry="${f1(36 * k)}" fill="#62b6e4"/>` +
    [0, 1, 2].map(i => `<ellipse cx="0" cy="${f1(pool + 6 * k)}" rx="${f1(60 * k)}" ry="${f1(10 * k)}" fill="none" stroke="#ffffff" stroke-width="${f1(2 * k)}">` +
      `<animate attributeName="rx" values="${f1(40 * k)};${f1(200 * k)}" dur="2.4s" begin="${(i * 0.8).toFixed(1)}s" repeatCount="indefinite"/>` +
      `<animate attributeName="ry" values="${f1(6 * k)};${f1(30 * k)}" dur="2.4s" begin="${(i * 0.8).toFixed(1)}s" repeatCount="indefinite"/>` +
      `<animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="${(i * 0.8).toFixed(1)}s" repeatCount="indefinite"/></ellipse>`).join("") +
    land(g + 20 * k, 4, "#4f8a3a", 1.1));
  // the mist at the falls' foot, billowing (as much as the slider says)
  if (mist > 0) s += SEP + part("wf-mist", [c.F, mist], () => `<defs><filter id="bg-mist" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${f1(14 * k)}"/></filter></defs>` +
    `<g filter="url(#bg-mist)" pointer-events="none">` + [...Array(Math.round(3 + 6 * mist))].map((_, i) => {
      const x = (R(i, 349) - 0.5) * 220 * k, y = pool - (10 + 60 * R(i, 350)) * k, r = (40 + 40 * R(i, 351)) * k;
      return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r * 0.55)}" fill="#ffffff" opacity="${(0.25 + 0.35 * mist).toFixed(2)}">` +
             `<animate attributeName="cy" values="${f1(y)};${f1(y - 30 * k)};${f1(y)}" dur="${(4 + 3 * R(i, 352)).toFixed(1)}s" repeatCount="indefinite"/>` +
             `<animate attributeName="opacity" values="${(0.15 + 0.3 * mist).toFixed(2)};${(0.35 + 0.4 * mist).toFixed(2)};${(0.15 + 0.3 * mist).toFixed(2)}" dur="${(3 + 2 * R(i, 353)).toFixed(1)}s" repeatCount="indefinite"/></ellipse>`;
    }).join("") + `</g>`);
  // big-leaved jungle trees either side, flowers at their feet
  s += SEP + part("wf-trees", c.F, () => {
    let t = "";
    for (const sd of [-1, 1]) {
      const tx = sd * W * 0.43, tb = g + 60 * k, tt = y0 + H * 0.18;
      t += `<path d="M${P(tx - 22 * k, tb)} Q${P(tx - 10 * k, (tb + tt) / 2)} ${P(tx - sd * 20 * k, tt)} L${P(tx - sd * 4 * k, tt)} Q${P(tx + 14 * k, (tb + tt) / 2)} ${P(tx + 22 * k, tb)} Z" fill="#6b4a2b"/>`;
      for (let j = 0; j < 9; j++) {
        const a = (-160 + j * 40) * Math.PI / 180, l = (110 + 50 * R(j, 354)) * k, ex = tx - sd * 20 * k + Math.cos(a) * l, ey = tt + Math.sin(a) * l * 0.7 + 30 * k;
        t += `<path d="M${P(tx - sd * 14 * k, tt)} Q${P((tx - sd * 14 * k + ex) / 2 + 10 * k, (tt + ey) / 2 - 40 * k)} ${P(ex, ey)} Q${P((tx - sd * 14 * k + ex) / 2 - 10 * k, (tt + ey) / 2 + 10 * k)} ${P(tx - sd * 14 * k, tt)} Z" ` +
             `fill="${["#2e8b3a", "#3fa34a", "#24753a"][j % 3]}" stroke="#1d5a2a" stroke-width="${f1(1.5 * k)}"/>`;
      }
      for (let j = 0; j < 4; j++) {   // flowers by the trunk
        const fx = tx - sd * (30 + 40 * j) * k, fy = g + (30 + 10 * j) * k;
        t += [0, 72, 144, 216, 288].map(a => `<ellipse cx="${f1(fx)}" cy="${f1(fy - 8 * k)}" rx="${f1(4 * k)}" ry="${f1(9 * k)}" fill="${["#ff4f6d", "#ff8c1a", "#f2c12e", "#e85dbe"][j]}" transform="rotate(${a} ${f1(fx)} ${f1(fy)})"/>`).join("") +
             `<circle cx="${f1(fx)}" cy="${f1(fy)}" r="${f1(3.5 * k)}" fill="#ffd23f"/>`;
      }
    }
    return t;
  });
  // vines hanging from the top, swaying
  s += SEP + part("wf-vines", [c.F, vines], () => [...Array(vines)].map((_, i) => {
    const x = x0 + W * (0.04 + 0.92 * R(i, 355)), len = (120 + 220 * R(i, 356)) * k;
    let d = `M${P(x, y0 - 10 * k)}`, leaves = "";
    for (let j = 1; j <= 8; j++) {
      const y = y0 - 10 * k + len * j / 8, xx = x + 10 * k * Math.sin(j * 1.1 + i);
      d += ` L${P(xx, y)}`;
      leaves += `<ellipse cx="${f1(xx + (j % 2 ? 7 : -7) * k)}" cy="${f1(y)}" rx="${f1(7 * k)}" ry="${f1(3.5 * k)}" fill="#3fa34a" transform="rotate(${j % 2 ? 30 : -30} ${f1(xx)} ${f1(y)})"/>`;
    }
    return `<g><animateTransform attributeName="transform" type="rotate" values="-3 ${f1(x)} ${f1(y0)};3 ${f1(x)} ${f1(y0)};-3 ${f1(x)} ${f1(y0)}" dur="${(4 + 2 * R(i, 357)).toFixed(1)}s" repeatCount="indefinite"/>` +
           `<path d="${d}" fill="none" stroke="#3f7a2a" stroke-width="${f1(3 * k)}"/>${leaves}</g>`;
  }).join(""));
  // parrots on the branches
  s += SEP + part("wf-parrots", [c.F, parrots], () => [...Array(parrots)].map((_, i) => {
    const sd = i % 2 ? 1 : -1, x = sd * (W * 0.32 - 30 * k * Math.floor(i / 2)), y = y0 + H * (0.3 + 0.08 * Math.floor(i / 2)), f = sd < 0 ? 1 : -1;
    return `<g ${tf(x, y, k * f, k)}><path d="M-6 0 Q-14 22 -4 40 L4 40 Q10 20 6 0 Z" fill="${["#e53935", "#2e86de", "#27ae60"][i % 3]}"/>` +
           `<path d="M-4 38 L-8 66 L0 50 L6 68 L4 38 Z" fill="${["#2e86de", "#f2c12e", "#e53935"][i % 3]}"/>` +
           `<circle cx="2" cy="-4" r="9" fill="${["#e53935", "#2e86de", "#27ae60"][i % 3]}"/><circle cx="5" cy="-6" r="2.5" fill="#ffffff"/><circle cx="5.5" cy="-6" r="1.2" fill="#111"/>` +
           `<path d="M9 -6 Q18 -4 12 4 Q10 0 9 -2 Z" fill="#f2c12e"/><path d="M-6 8 Q-18 20 -10 34" fill="none" stroke="#f2c12e" stroke-width="4"/></g>`;
  }).join(""));
  // a sign back to the trail
  s += SEP + part("wf-sign", c.F, () => signpost(W * 0.3, g + 40 * k, k, [["⛰️ trail", "mountains", 1]]));
  return s;
}

// The camp site: day, sunset or night; tents round a campfire (on or out,
// its flames as big as the slider says, in a group that grows them),
// sparks, and on the fire nothing, veggie sausages on sticks, or a pot of
// soup hanging over it, steaming.
const CAMP_SKY = { day: ["#5aa9e6", "#dff2ff"], sunset: ["#3a2a6a", "#f2a65a"], night: ["#0b1030", "#24305a"] };
function campsiteScene(c) {
  const { x0, y0, x1, y1, g, W, H, k, pad, R, P, grad, all, land, o, side } = c;
