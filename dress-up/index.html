    svg += poly([[-hw, L - 10], [hw, L - 10], [fx + half, L + 34], [fx - half, L + 34], [0, L + 14],
                 [-(fx - half), L + 34], [-(fx + half), L + 34]], limb, limbLine);
    svg += undiesBottom(U, hw, fx, half, L, LL);
  } else if (!suit && (P.style === "skirt" || P.style === "dress")) {
    // a skirt flares a little; a dress flares more as it gets longer and
    // has a scalloped hem. The length is a share of the legs' length.
    const sl = LL * (P.skirtLen ?? 50) / 100;
    if (P.style === "skirt")
      svg += `<path d="M${-hw} ${L - 10} L${hw} ${L - 10} L${f1(hw + 30)} ${f1(L + sl)} Q0 ${f1(L + sl + 14)} ${f1(-hw - 30)} ${f1(L + sl)} Z" ` +
             `fill="${pf}" stroke="${ps}" stroke-width="2.5" stroke-linejoin="round"/>`;
    else {
      const fl = hw + 26 + sl * 0.25, n = witch ? 9 : 6;
      let d = `M${-hw} ${L - 10} L${hw} ${L - 10} L${f1(fl)} ${f1(L + sl)}`;
      for (let i = 1; i <= n; i++) {
        const x0 = fl - (i - 1) * 2 * fl / n, x1 = fl - i * 2 * fl / n;
        // (a witch's hem is ragged: points, not scallops)
        d += witch ? ` L${f1((x0 + x1) / 2)} ${f1(L + sl + 18)} L${f1(x1)} ${f1(L + sl)}`
                   : ` Q${f1((x0 + x1) / 2)} ${f1(L + sl + 16)} ${f1(x1)} ${f1(L + sl)}`;
      }
      svg += `<path d="${d} Z" fill="${pf}" stroke="${ps}" stroke-width="2.5" stroke-linejoin="round"/>`;
      // a few webs on the skirt: two side by side, a smaller one below
      if (fewWebs)
        svg += spiderWeb(-0.5 * fl, L + 0.42 * sl, 0.24 * fl, WC.webColor) + spiderWeb(0.5 * fl, L + 0.42 * sl, 0.24 * fl, WC.webColor) +
               spiderWeb(0, L + 0.8 * sl, 0.18 * fl, WC.webColor);
    }
  } else {
    const len = !suit && P.style === "shorts" ? LL * 0.38 : LL;
    const legs = [[-hw, L - 10], [hw, L - 10], [fx + half, L + len], [fx - half, L + len],
                  [0, L + Math.min(len * 0.3, 40)], [-(fx - half), L + len], [-(fx + half), L + len]];
    svg += poly(legs, pf, ps);
    if (wrapStripes(C)) svg += legStripes(legs, hw, fx, half, L, len, Math.min(len * 0.3, 40), C.marks);
  }

  // neck, behind the shirt so it shows in the collar
  svg += `<rect x="${-B.neckW / 2}" y="${neckTop}" width="${B.neckW}" height="${B.neck + 44}" rx="4" ` +
         `fill="${limb}" stroke="${limbLine}" stroke-width="2.5"/>`;

  // arms, sleeves and shirt
  const sf = suit ? "url(#pat-fur)" : fillOf("pat-shirt", SH.color, SH.pattern);
  const ss = suit ? darker(C.fur) : darker(SH.color);
  // (a falcon suit's arms are inside its wings, drawn after the body)
  const winged = !!BIRD_SUIT[kind];
  if (!winged) for (const { A, H } of arms) svg += line(A[0], A[1], H[0], H[1], armW, limb, limbLine);
  const sleeveEnd = ({ A, H }) => [A[0] + (H[0] - A[0]) * sleeve, A[1] + (H[1] - A[1]) * sleeve];
  if (sleeve > 0 && !winged) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 14, ss); }
  const collar = { v: [[0, 18]], round: [[-nw * 0.7, -6], [0, -1], [nw * 0.7, -6]], flat: [] }[SH.collar];
  const shoulder = !suit && SH.style === "tank" ? [[nw + 12, -20], [w, 30]] : [[w + 4, -6], [w, 44]];
  const torso = [[-nw, -20], ...collar, [nw, -20], ...shoulder, [w + 2, L], [-(w + 2), L],
                 ...shoulder.map(([x, y]) => [-x, y]).reverse()];
  const bareBody = [[-(w + 2), L + 2], [-w, 44], [-(w + 4), -6], [-nw, -20], [nw, -20], [w + 4, -6], [w, 44], [w + 2, L + 2]];
  if (undies) {
    // a plain body shape in skin, no collar, then the swimsuit or top on it
    // (outlined on every side but the bottom, so it runs on into the hips
    // without a line at the waist)
    const body = bareBody;
    svg += poly(body, limb, "none", 0) +
           `<polyline points="${pts(body)}" fill="none" stroke="${limbLine}" stroke-width="2.5" stroke-linejoin="round"/>`;
    svg += undiesTop(U, w, nw, hw, fx, L);
  } else svg += poly(torso, sf, ss);
  // a few webs on the bodice, side by side
  if (fewWebs && !undies)
    svg += spiderWeb(-0.42 * hw, -20 + 0.48 * (L + 20), 0.3 * hw, WC.webColor) + spiderWeb(0.42 * hw, -20 + 0.48 * (L + 20), 0.3 * hw, WC.webColor);
  // a witch's belt round her waist, its buckle in the middle
  if (witch) {
    const bc = WC.bootColor ?? "#1f1f22";
    svg += `<rect x="${f1(-(w + 3))}" y="${f1(L - 16)}" width="${f1(2 * w + 6)}" height="12" fill="${bc}" stroke="${darker(bc)}" stroke-width="2"/>` +
           `<rect x="-11" y="${f1(L - 19)}" width="22" height="18" rx="2.5" fill="none" stroke="#f2c230" stroke-width="4"/>` +
           `<line x1="-3" y1="${f1(L - 10)}" x2="9" y2="${f1(L - 10)}" stroke="#f2c230" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  if (wrapStripes(C) && !undies) svg += torsoStripes(torso, w, L, C.marks);
  if (suit && kind !== "eaglesuit")  // the suit's belly (a bald eagle is brown all over)
    svg += `<ellipse cx="0" cy="${f1(L * 0.58)}" rx="${f1(w * 0.55)}" ry="${f1(L * 0.36)}" fill="${C.belly}"/>`;
  // the hair, in the face's frame: over the body and shirt, but under the
  // arms, which are drawn again over it (long or curly hair hangs beside
  // them), and behind the head
  if (!C)
    svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">` +
           `<g transform="${topFlies(F)}"><g transform="${hairStretch(F)}">${tucked(hairSvg(state.hair), "under-hat")}</g></g></g>`;

  if (winged) for (const arm of arms) svg += armWing(C, arm, armW);

  // the face, in its own units
  const groundInFace = (ground - ty) / s;
  svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})">${faceSvg(F, groundInFace)}</g>`;
  // a witch's hat over it, stretched with the head as hair is (and flying
  // off with the lid); her cat on her shoulder
  if (witch) {
    svg += `<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${s.toFixed(4)})"><g transform="${topFlies(F)}">` +
           `<g transform="${hairStretch(F)}">${witchHat(WC, brimRx)}</g></g></g>`;
    // (the cat grows or shrinks about where it sits)
    if (WC.witchCat)
      svg += `<g transform="translate(${f1(-(w - 4))} -9) scale(${((WC.catSize ?? 100) / 100).toFixed(3)}) translate(${f1(w - 4)} 9)">` +
             `${shoulderCat(w, WC)}</g>`;
  }

  // then the arms again, over the hair and the face: raised arms cross
  // the chin and cheeks in front of the head, not behind it
  // (only outside the body, where they showed before: the body still
  // covers their tops, outline and all)
  // (a bird suit's wings stay behind the face, or they would hide it)
  if (!winged) {
    svg += `<mask id="off-body" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">` +
           `<rect x="-5000" y="-5000" width="10000" height="10000" fill="white"/>` +
           `<polygon points="${pts(undies ? bareBody : torso)}" fill="black" stroke="black" stroke-width="3" stroke-linejoin="round"/></mask>` +
           `<g mask="url(#off-body)">`;
    for (const { A, H } of arms) svg += line(A[0], A[1], H[0], H[1], armW, limb, limbLine);
    if (sleeve > 0) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 14, ss); }
    svg += `</g>`;
    if (sleeve > 0) for (const arm of arms) { const E = sleeveEnd(arm); svg += line(arm.A[0], arm.A[1], E[0], E[1], armW + 9, sf); }
    // (from past the shoulder, where the fur sleeve joins the body)
    if (wrapStripes(C))
      for (const arm of arms) svg += limbStripes(arm.A, sleeveEnd(arm), armW + 9, C.marks, `arm-stripes${arm.side}`, 22);
  }

  // a witch's broom, held in her right hand (on the picture's right)
  // (it grows or shrinks about the hand)
  if (broomH)
    svg += `<g transform="translate(${f1(broomH[0])} ${f1(broomH[1])}) scale(${kb.toFixed(3)}) translate(${f1(-broomH[0])} ${f1(-broomH[1])})">` +
           `${broomSvg(broomH, WC.trimColor)}</g>`;

  // and the hands last, in front of everything, the face too: raised
  // arms put them by the cheeks or over the eyes, not behind the head
  if (!winged) {
    const hands = suit ? suitHands(C, kind) : state.hands;
    for (const { side, H, angle } of arms) {
      // with different hands, the friend's right hand (on our left: they
      // face us) wears its own style; a hand holding the broom is closed
      // round it, a round fist
      const own = !suit && side < 0 ? rightHandOf(hands) : hands;
      svg += handSvg(H[0], H[1], angle, side, broomH && side > 0 ? { ...own, style: "round" } : own, skin);
    }
  }
  svg += `</g>`;   // the figure

  const pic = document.getElementById("pic");
  pic.setAttribute("viewBox", `${f1(left)} ${f1(top)} ${f1(width)} ${f1(bottom - top)}`);
  pic.innerHTML = svg;
  // the scenery: the node parsed from it last time, if it has not changed
  // (a figure's slider redraws the figure, not the scene)
  if (scened) {
    if (bgText !== bgShown.text) { bgShown.node = mountScene(bgText); bgShown.text = bgText; }
    pic.insertBefore(bgShown.node, pic.firstChild.nextSibling);
  }
  // a blown lid tilts about the crack, and on a tall head its top (and
  // long hair or a hood's back below it) swings far out: frame what was
  // drawn, kept centred
  if (F.burst > 0 && !scened) {
    const b = pic.getBBox(), l = Math.min(left, b.x - 12, -(b.x + b.width + 12));
    const t = Math.min(top, b.y - 12), btm = Math.max(bottom, b.y + b.height + 12);
    if (l < left || t < top || btm > bottom)
      pic.setAttribute("viewBox", `${f1(l)} ${f1(t)} ${f1(-2 * l)} ${f1(btm - t)}`);
  }
  document.getElementById("mood").textContent = "feeling " + mood(family(F.color), F.brow, F.smile);
}

// ===================== MUSIC =====================
// Each background has a tune of its own, and any tune can play over any
// background (or none). A tune is written as notes, MIDI numbers (60 is
// middle C) in a small text form, and played by little synthesizers made
// of Web Audio oscillators and noise: no sound files. Browsers allow sound
// only after a tap or a key, so the music starts with the first one; it
// rests while the page is hidden.

const NOTE_STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
// "C4" is 60, "F#3" 54, "Bb2" 46
function midiOf(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) throw new Error("not a note: " + name);
  return 12 * (Number(m[3]) + 1) + NOTE_STEP[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
}
// a line of notes, each with its length in steps (sixteenth notes):
// "E5:2 G5:2 C5+E5+G5:4 r:2", "+" for notes played together, "r" a rest,
// "|" a bar line (only for reading)
function lineOf(text) {
  const events = []; let at = 0;
  for (const tok of text.trim().split(/\s+/)) {
    if (tok === "|") continue;
    const [what, len] = tok.split(":"), n = Number(len);
    if (!(n > 0)) throw new Error("no length: " + tok);
    if (what !== "r") events.push({ at, len: n, notes: what.split("+").map(midiOf) });
    at += n;
  }
  return { events, steps: at };
}
// a drum's hits, a character a step, repeated: "x" a hit, "o" a soft one
function hitsOf(text, note = 60) {
  const p = text.replace(/[\s|]/g, ""), events = [];
  for (let at = 0; at < p.length; at++)
    if (p[at] === "x" || p[at] === "o") events.push({ at, len: 1, notes: [note], vel: p[at] === "x" ? 1 : 0.55 });
  return { events, steps: p.length };
}
// a chord by name, its notes up from the root at an octave: "Am", "G7", "Bb"
const CHORD_SHAPES = { "": [0, 4, 7], m: [0, 3, 7], "7": [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11], dim: [0, 3, 6] };
function chordOf(name, oct) {
  const m = /^([A-G][#b]?)(.*)$/.exec(name);
  return CHORD_SHAPES[m[2]].map(s => midiOf(m[1] + oct) + s);
}
// Parts made from a tune's chords, one chord a bar of so many steps:
// a bass line, [step, semitones above the root, length] in every bar
const bassOf = (chords, bar, pat, oct) => ({ steps: chords.length * bar, events: chords.flatMap((c, i) =>
  pat.map(([at, up, len]) => ({ at: i * bar + at, len, notes: [chordOf(c, oct)[0] + up] }))) });
// the chord, struck at these steps of every bar
const stabsOf = (chords, bar, ats, len, oct) => ({ steps: chords.length * bar, events: chords.flatMap((c, i) =>
  ats.map(at => ({ at: i * bar + at, len, notes: chordOf(c, oct) }))) });
// the chord, struck at these steps of every bar, each for its own length: [step, length]
const rhythmOf = (chords, bar, pat, oct) => ({ steps: chords.length * bar, events: chords.flatMap((c, i) =>
  pat.map(([at, len]) => ({ at: i * bar + at, len, notes: chordOf(c, oct) }))) });
// a broken chord: its notes in this order, one every so many steps (past
// the chord's last note, the same notes an octave up)
const arpOf = (chords, bar, order, every, oct) => ({ steps: chords.length * bar, events: chords.flatMap((c, i) => {
  const ns = chordOf(c, oct), tone = j => ns[j % ns.length] + 12 * Math.floor(j / ns.length);
  return Array.from({ length: bar / every }, (_, j) => ({ at: i * bar + j * every, len: every, notes: [tone(order[j % order.length])] }));
}) });

// --- the instruments: each plays one note, at time t, for dur seconds
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const noiseBufs = new WeakMap();
function noiseBuf(A) {
  if (!noiseBufs.has(A)) {
    const b = A.createBuffer(1, A.sampleRate, A.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noiseBufs.set(A, b);
  }
  return noiseBufs.get(A);
}
// a gain into dest (a node or a setting): fixed, ...
function gainOf(A, dest, value) { const g = A.createGain(); g.gain.value = value; g.connect(dest); return g; }
// ... rising to its peak and dying away (tau: how fast) ...
function amp(A, dest, t, peak, attack, tau) {
  const g = A.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.setTargetAtTime(0, t + attack, tau); g.connect(dest); return g;
}
// ... or holding until the note ends, then letting go
function held(A, dest, t, peak, attack, end, release) {
  const g = A.createGain(), from = Math.max(t + attack, end);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.setValueAtTime(peak, from); g.gain.setTargetAtTime(0, from, release); g.connect(dest); return g;
}
function tone(A, dest, type, f, t, stop, detune = 0) {
  const o = A.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.connect(dest); o.start(t); o.stop(stop); return o;
}
function noise(A, dest, t, stop) {
  const s = A.createBufferSource(); s.buffer = noiseBuf(A); s.loop = true;
  s.connect(dest); s.start(t, Math.random() * 0.5); s.stop(stop); return s;
}
function filter(A, dest, type, f, q = 0.7) {
  const b = A.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b;
}
// Each instrument has a knob of its own on the mixing board, x from 0 to
// 100, at 50 as written: how long it rings, how bright, how much vibrato...
// "ring" turns 0..100 into a quarter as long .. four times as long.
const ring = x => Math.pow(2, (x - 50) / 25);
const INSTRUMENTS = {
  // a steel pan: a bright ring that dies away, its octave strong
  steelpan(A, out, t, m, dur, v, x = 50) {
    const f = hz(m), tau = 0.32 * ring(x), g = amp(A, out, t, 0.3 * v, 0.004, tau);
    for (const [r, a] of [[1, 1], [2, 0.55], [3.01, 0.18]]) tone(A, gainOf(A, g, a), "sine", f * r, t, t + 7 * tau);
    tone(A, amp(A, out, t, 0.05 * v, 0.002, 0.025), "triangle", f * 4, t, t + 0.2);
  },
  // a reggae organ's chop: short and buzzy
  organ(A, out, t, m, dur, v, x = 50) {
    const end = t + dur, lp = filter(A, held(A, out, t, 0.08 * v, 0.004, end, 0.03), "lowpass", 400 * Math.pow(2, x / 25));
    tone(A, lp, "sawtooth", hz(m), t, end + 0.25, -7); tone(A, lp, "square", hz(m), t, end + 0.25, 7);
  },
  // a round bass, with an edge so a small speaker can still play it
  bass(A, out, t, m, dur, v, x = 50) {
    const f = hz(m), end = t + dur * 0.9, lp = filter(A, held(A, out, t, 0.22 * v, 0.008, end, 0.05), "lowpass", 300 + 7 * x);
    tone(A, lp, "triangle", f, t, end + 0.4); tone(A, gainOf(A, lp, 0.7 * x / 100), "square", f, t, end + 0.4);
  },
  kick(A, out, t, m, dur, v, x = 50) {
    const o = tone(A, amp(A, out, t, 0.9 * v, 0.002, 0.09 * ring(x)), "sine", 150, t, t + 0.65 * ring(x));
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  },
  rim(A, out, t, m, dur, v, x = 50) {
    const k = ring(x);
    noise(A, filter(A, amp(A, out, t, 0.5 * v, 0.001, 0.025 * k), "bandpass", 2600, 3), t, t + 0.2 * k);
    tone(A, amp(A, out, t, 0.3 * v, 0.001, 0.015 * k), "triangle", 420, t, t + 0.12 * k);
  },
  snare(A, out, t, m, dur, v, x = 50) {
    const k = ring(x);
    noise(A, filter(A, amp(A, out, t, 0.4 * v, 0.001, 0.07 * k), "bandpass", 1800, 0.8), t, t + 0.5 * k);
    tone(A, amp(A, out, t, 0.2 * v, 0.001, 0.04 * k), "triangle", 200, t, t + 0.25 * k);
  },
  // a cowbell: two square tones, filtered, quick to fade
  cowbell(A, out, t, m, dur, v, x = 50) {
    const k = ring(x), bp = filter(A, amp(A, out, t, 0.2 * v, 0.001, 0.07 * k), "bandpass", 1000, 2);
    tone(A, bp, "square", 560, t, t + 0.5 * k); tone(A, bp, "square", 845, t, t + 0.5 * k);
  },
  hat(A, out, t, m, dur, v, x = 50) { noise(A, filter(A, amp(A, out, t, 0.3 * v, 0.001, 0.018 * ring(x)), "highpass", 7500), t, t + 0.15 * ring(x)); },
  shaker(A, out, t, m, dur, v, x = 50) { noise(A, filter(A, amp(A, out, t, 0.22 * v, 0.012, 0.03 * ring(x)), "bandpass", 5500, 1.2), t, t + 0.25 * ring(x)); },
  // a hand drum, tuned to its note
  // (its knob tunes it, a half step at a time, up to an octave either way)
  conga(A, out, t, m, dur, v, x = 50) {
    const f = hz(m) * Math.pow(2, Math.round((x - 50) * 12 / 50) / 12), o = tone(A, amp(A, out, t, 0.42 * v, 0.002, 0.1), "sine", f * 1.4, t, t + 0.7);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
  },
  // a bubble: a quick rising bloop
  bubble(A, out, t, m, dur, v, x = 50) {
    const f = hz(m), o = tone(A, amp(A, out, t, 0.22 * v, 0.004, 0.05), "sine", f, t, t + 0.4);
    o.frequency.exponentialRampToValueAtTime(f * (1 + 0.024 * x), t + 0.09);
  },
  // a plucked string, short
  pizz(A, out, t, m, dur, v, x = 50) { tone(A, filter(A, amp(A, out, t, 0.3 * v, 0.003, 0.13 * ring(x)), "lowpass", 1400), "triangle", hz(m), t, t + 7 * 0.13 * ring(x)); },
  // a guitar's strum, bright, then mellow
  pluck(A, out, t, m, dur, v, x = 50) {
    const lp = filter(A, amp(A, out, t, 0.14 * v, 0.003, 0.16 * ring(x)), "lowpass", 3200);
    lp.frequency.setTargetAtTime(700, t, 0.07); tone(A, lp, "sawtooth", hz(m), t, t + 7 * 0.16 * ring(x));
  },
  // a reggae guitar's chop: short, bright, no low end
  chop(A, out, t, m, dur, v, x = 50) {
    const lp = filter(A, amp(A, out, t, 0.18 * v, 0.002, 0.045 * ring(x)), "lowpass", 2600);
    tone(A, filter(A, lp, "highpass", 500), "sawtooth", hz(m), t, t + 0.35 * ring(x));
  },
  // a melodica: reedy, a little vibrato
  melodica(A, out, t, m, dur, v, x = 50) {
    const f = hz(m), end = t + dur * 0.92, lp = filter(A, held(A, out, t, 0.12 * v, 0.03, end, 0.08), "lowpass", 1900);
    const o = tone(A, lp, "square", f, t, end + 0.6); tone(A, lp, "sawtooth", f, t, end + 0.6, 4);
    tone(A, gainOf(A, o.frequency, f * 0.008 * x / 100), "sine", 5.5, t, end + 0.6);
  },
  // a low buzzy bass: two bright waves through a filter that closes as the note goes on
  // (its knob is its wah: how far the filter opens, and how sharply it sings)
  buzz(A, out, t, m, dur, v, x = 50) {
    const f = hz(m), end = t + dur * 0.9, open = 600 + 24 * x, lp = filter(A, held(A, out, t, 0.1 * v, 0.005, end, 0.04), "lowpass", open, 1 + x / 10);

  openhat(A, out, t, m, dur, v, x = 50) { noise(A, filter(A, amp(A, out, t, 0.24 * v, 0.002, 0.11 * ring(x)), "highpass", 7000), t, t + 0.8 * ring(x)); },

  // fifths), a click as a key goes down, and the wobble of a spinning
  // speaker (its knob is how fast the speaker spins)
  tonewheel(A, out, t, m, dur, v, x = 50) {

  funkgtr(A, out, t, m, dur, v, x = 50) {

  // its note, with a whammy bar's wobble as it is held
  // (its knob is how wide the wobble is)
  twang(A, out, t, m, dur, v, x = 50) {

  bird(A, out, t, m, dur, v, x = 50) {

    }
  },

// --- the tunes: so many beats a minute (a beat is 4 steps), steps a bar
// ("bar", 16 unless it says), the steps shifted later by "swing" (every
// other sixteenth, a share of a step) or "swing8" (every other eighth, for
// a jazzy lilt), how long the room rings ("room", seconds), its loudness
// beside the other tunes ("level"), and the parts: a name, an instrument,
// its notes, its level, how much goes to the room ("rev") and to the echo
// ("echo", a repeat every "echoSteps"), and a shift in semitones.
// The "form" is the tune from start to end: sections of so many bars, each
// with the parts it names (by name; several parts may share one), each
// part starting its notes again at the section's start, and the whole
// section moved up or down ("up", semitones) if it says.
const S = (bars, names, up = 0) => ({ bars, names: names.split(" "), up });
// --- the classic beats: a funk band's tune, made from its lines,
// patterns and plan. Each tune's sections give each player a turn in front:
// the bongos open it, then the bass, the bongos again, the drum kit, the
// organ, the rhythm guitar and the lead guitar take a solo each, over the
// band or alone. (Our own tunes, in the style of the funk instrumentals
// hip-hop grew up on: a breakbeat, bongos, an organ, a twangy guitar.)
const FUNK_SECTIONS = {
  intro: "bongoHi bongoLo",
  kitIn: "bongoHi bongoLo kick snare hat",
  groove: "kick snare hat openhat bass rhythm organ bongoHi fill",
  theme: "kick snare hat openhat bass rhythm organ theme bongoHi bongoLo fill",
  bassSolo: "kick hat bassSolo fill",
  bongoSolo: "soloHi soloLo kick",
  drumBreak: "breakKick breakSnare breakHat openhat fill",
  organSolo: "kick snare hat bass organSolo",
  rhythmSolo: "kick snare hat bass rhythmSolo",
  gtrSolo: "kick snare hat openhat bass rhythm gtrSolo fill",
  outro: "bongoHi bongoLo kick hat",
};
function funkTune(c) {

    { name: "kick", inst: "kick", level: 0.9, line: hitsOf(c.kick) },
    { name: "snare", inst: "snare", level: 0.55, rev: 0.15, line: hitsOf(c.snare) },
    { name: "hat", inst: "hat", level: 0.35, line: hitsOf(c.hat) },
    { name: "openhat", inst: "openhat", level: 0.3, line: hitsOf(c.open) },
    { name: "breakKick", inst: "kick", level: 0.95, line: hitsOf(c.bKick) },

    { name: "breakHat", inst: "hat", level: 0.4, line: hitsOf(c.bHat) },

    { name: "bongoHi", inst: "bongo", level: 0.7, rev: 0.15, line: hitsOf(c.hi, 71) },
    { name: "bongoLo", inst: "bongo", level: 0.75, rev: 0.15, line: hitsOf(c.lo, 64) },

let tab = 0;

let hudSyncs = [];   // ...and the full-screen controls'

function set(part, key, value) {
  const wasBare = state.background.kind === "none";
  state[part][key] = value;
  // choosing an animal dresses it in its natural colors
  if (part === "costume" && key === "kind" && ANIMALS[value]) Object.assign(state.costume, lookOf(value));
  // a skirt starts at skirt length and a dress at dress length
  if (part === "pants" && key === "style" && value === "skirt") state.pants.skirtLen = 50;
  if (part === "pants" && key === "style" && value === "dress") state.pants.skirtLen = 95;
  if (part === "background" && key === "kind") trips.length = 0;
  // you are always inside a house the tree has: going into house 6 grows
  // the tree to six houses, and fewer houses take you to the last one left
  if (part === "background" && key === "inside" && value > (state.background.houses ?? 4)) state.background.houses = value;
  if (part === "background" && key === "houses" && (state.background.inside ?? 1) > value) state.background.inside = value;
  // different hands start alike; then each changes on its own
  if (part === "hands" && key === "different" && value)
    for (const k of HAND_OWN) state.rightHand[k] = state.hands[k];
  if (part === "shoes" && key === "different" && value)
    for (const k of SHOE_OWN) state.rightShoe[k] = state.shoes[k];
  // a bikini comes with its top; trunks and briefs start without one
  if (part === "undies" && key === "style") state.undies.top = value === "bikini";
  // a figure too big for the stage, once a background is chosen, shrinks
  // to fit it (once: after that its size is the slider's)
  if (part === "background" && key === "kind" && value !== "none" && wasBare) {
    // (the usual figure fills the stage exactly: only a bigger one shrinks)
    const n = naturalFrame, fit = Math.min((SCENE.ground - SCENE.top) / (n.ground - n.top), SCENE.left / n.left);
    if (fit < 0.98) state.background.figSize = Math.max(10, Math.floor(100 * fit));
  }
  changed();
}
function changed() {
  draw(); for (const f of syncs) f(); for (const f of hudSyncs) f(); persist(); musicSync(); backSync();
  // a new friend (loaded, started over, surprised) or a scene turned on or
  // off rebuilds the HUD; a slider moving in it does not
  if (!hud.hidden && hudKey() !== hudShown) renderHud();
}

function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of [].concat(kids)) e.append(k);
  return e;
}

const pinned = id => (state.hud.pins || []).includes(id);

// ===================== FULL SCREEN =====================
// The picture fills the window, the controls hidden -- and the screen too,
// where the browser allows it (not an iPhone's); an X, Escape, or leaving
// the browser's full screen brings the controls back.
const maxBtn = document.getElementById("max");
function setBig(on) {
  document.body.classList.toggle("big", on);
  if (!on) setHud(false);
  maxBtn.textContent = on ? "✕" : "⤢";
  maxBtn.title = on ? "Back to the controls" : "Full screen";
  maxBtn.setAttribute("aria-label", maxBtn.title);
  try {
    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement)
      document.documentElement.requestFullscreen().catch(() => {});
    else if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) { /* the window-filling picture is enough */ }
}
maxBtn.addEventListener("click", () => setBig(!document.body.classList.contains("big")));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("big")) setBig(false);
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && document.body.classList.contains("big")) setBig(false);
});

    if (!spec) continue;

      const [kind, , label, ...rest] = spec;
      boxes.push(control(part, [kind, key, foot + label, ...rest],
                         { when: sh => (part === "shoes" || state.shoes.different) && sh.style === FOOT_SLIDER_STYLE[key] }));
      continue;
    }
    if (!whose) { boxes.push(control(part, spec)); continue; }
    const [kind, , label, ...rest] = spec;
    boxes.push(control(part, [kind, key, whose + label, ...rest],
                       { when: h => (part === "hands" || state.hands.different) && handSliderShown(key, h) }));
  }
  if (!boxes.length)
    boxes.push(el("div", { class: "empty" }, "Pin sliders with 📌 in the controls, and they show up here."));
  // (only when there is nothing else: a scene always has its size and place)
  buildingHud = false;
  hud.replaceChildren(...boxes);
  hudSyncs = syncs;
  syncs = saved;
  for (const f of hudSyncs) f();
}
function setHud(on) {
  hud.hidden = !on;
  hudBtn.setAttribute("aria-pressed", on);
  if (on) renderHud(); else { hud.replaceChildren(); hudSyncs = []; }
}
hudBtn.addEventListener("click", () => setHud(hud.hidden));

// ===================== SURPRISE, SAVE, START OVER =====================

const pick = xs => xs[Math.floor(Math.random() * xs.length)];
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
// one control's surprise
function surpriseOne(part, [kind, key, , ...rest]) {
  if (kind === "range") state[part][key] = rnd(rest[2] ?? rest[0], rest[3] ?? rest[1]);
  // (a star turned any way still looks like a star; other hands keep
  // their usual angle most times)
  else if (kind === "turn")
    state[part][key] = key === "starAngle" || Math.random() < 0.25 ? Math.random() * rest[0](state[part]) : 0;
  else if (kind === "toggle") state[part][key] = Math.random() < 0.3;
  // (the hands are mostly the same)
  else if (kind === "flip") state[part][key] = Math.random() < 0.25;
  else if (kind === "choice") state[part][key] = pick(rest[0])[0];
  // (a pair's first column has a part of its own: the friend's right hand)
  else if (kind === "pair") for (const c of rest[1]) surpriseOne(key, c);
  else if (kind === "color") state[part][key] = pick(rest[0]);
}
document.getElementById("surprise").addEventListener("click", () => {
  // (the music is not part of the surprise)
  for (const [, part, ctls] of TABS.filter(t => t[1] !== "music"))
    for (const c of ctls) surpriseOne(part, c);
  // keep the surprises friendly: mostly not sick, not exploded, a normal-ish head
  const F = state.face;
  if (Math.random() < 0.75) F.sick = 0;
  if (Math.random() < 0.6) { F.burst = 0; F.rays = 0; }
  // irises about 4 times in 10, and eye whites around about half of those
  F.iris = Math.random() < 0.4 ? rnd(15, 60) : 0;
  F.whites = F.iris > 0 && Math.random() < 0.5 ? rnd(10, 60) : 0;
  // now and then, an alien: a pointed head and slanted almond eyes
  const alien = Math.random() < 0.15;
  F.alien = alien ? rnd(50, 100) : 0;
  F.tilt = alien ? rnd(15, 35) : 0;
  if (alien) F.oval = rnd(45, 75);
  // and on their own, a somewhat alien head about 1 time in 5, and
  // slanted eyes, up or down, about 1 time in 4
  if (!alien && Math.random() < 0.2) F.alien = rnd(15, 70);
  if (!alien && Math.random() < 0.25) F.tilt = rnd(-20, 35);
  // swimwear now and then (about 1 time in 10), its top to suit its style
  state.undies.on = Math.random() < 0.1;
  state.undies.top = state.undies.style === "bikini" || (state.undies.style !== "onepiece" && Math.random() < 0.2);
  // a costume about 1 time in 4, in its natural colors
  state.costume.kind = Math.random() < 0.25 ? pick(Object.keys(ANIMALS)) : "none";
  if (ANIMALS[state.costume.kind]) Object.assign(state.costume, lookOf(state.costume.kind));
  changed();
});
document.getElementById("reset").addEventListener("click", () => {
  const { volume, mute } = state.music;
  state = clone(DEFAULTS); state.music.volume = volume; state.music.mute = mute; changed();
});
// SAVE: up to three files with one name, stamped with the local date and time
// so each save is new: my-friend-2026-10-10-16-29-05.png, .svg and .json.
// The picture as it is drawn (.png), the drawing itself, which Firefox
// opens and which prints sharp at any size (.svg), and the settings, which
// Load brings back (.json).
function download(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
// which files Save writes: all three to start with; unchecking one is
// remembered on this device
const formatBoxes = [...document.querySelectorAll("#formats input")];
// Tablets and phones save one file per tap: an iPad kept only the last of
// three downloads (the .png). There Save writes ONE file, chosen with
// radio buttons (the settings, to load again, unless changed), and the
// other two are a tap away in the links under the buttons. (iPadOS's
// Safari says it is a Mac; its touch points give it away.)
const oneFile = /iPad|iPhone|iPod|Android/.test(navigator.userAgent) ||
                (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
if (oneFile) {
  document.getElementById("formats-label").textContent = "save (one file per tap here):";
  let chosen = "json";
  try { chosen = localStorage.getItem("dress-up-save-one") || "json"; } catch (_) {}
  for (const b of formatBoxes) {
    b.type = "radio"; b.name = "save-format"; b.checked = b.value === chosen;
    b.addEventListener("change", () => {
      try { localStorage.setItem("dress-up-save-one", b.value); } catch (_) {}
    });
  }
} else {
  try {
    const off = JSON.parse(localStorage.getItem("dress-up-save-off") || "[]");
    for (const b of formatBoxes) b.checked = !off.includes(b.value);
  } catch (_) {}
  for (const b of formatBoxes) b.addEventListener("change", () => {
    try { localStorage.setItem("dress-up-save-off", JSON.stringify(formatBoxes.filter(x => !x.checked).map(x => x.value))); } catch (_) {}
  });
}
const wanted = f => formatBoxes.some(b => b.value === f && b.checked);
// Several downloads from one click: some browsers let only the first
// through, ask first ("allow multiple downloads?"), or drop ones that
// start after the click has finished (the .png is drawn first). So the
// .svg and .json start during the click, the .png right after, and each
// file also gets a link under the buttons: a click on a link always works.
document.getElementById("save").addEventListener("click", () => {
  if (!formatBoxes.some(b => b.checked)) { alert("Check at least one kind of file to save."); return; }
  const d = new Date(), two = n => String(n).padStart(2, "0");
  const name = `my-friend-${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}-` +
               `${two(d.getHours())}-${two(d.getMinutes())}-${two(d.getSeconds())}`;
  const pic = document.getElementById("pic");
  const vb = pic.viewBox.baseVal, scale = 1000 / vb.height;
  // a standalone copy at its own size; both the .svg and the .png keep a
  // transparent background
  const copy = pic.cloneNode(true);
  copy.setAttribute("width", Math.round(vb.width * scale));
  copy.setAttribute("height", 1000);
  const svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
  const saved = document.getElementById("saved");
  saved.replaceChildren("Saved:");
  const files = [];
  // each file: saved now if it is wanted, and a link either way when only
  // one file can be saved per tap (so the others are one tap away)
  const give = (blob, file) => {
    const kind = file.split(".").pop();
    if (wanted(kind)) download(blob, file);
    else if (!oneFile) return;
    const a = el("a", { href: URL.createObjectURL(blob), download: file, title: "save " + file }, kind);
    files.push([kind, a]);
    const order = ["json", "png", "svg"];
    const links = files.slice().sort((x, y) => order.indexOf(x[0]) - order.indexOf(y[0])).map(x => x[1]);
    saved.replaceChildren(...(oneFile
      ? ["Saved the ." + formatBoxes.find(b => b.checked).value + " — tap to save: ",
         ...links.flatMap((x, k) => k ? [" · ", x] : [x])]
      : ["Saved ", ...links.flatMap((x, k) => k ? [" · ", x] : [x]), " — not in your downloads? click each one."]));
  };
  if (wanted("svg") || oneFile) give(new Blob([svgText], { type: "image/svg+xml" }), name + ".svg");
  if (wanted("json") || oneFile)
    give(new Blob([JSON.stringify({ app: "dress-up", version: 1, saved: d.toISOString(), state }, null, 2)],
                  { type: "application/json" }), name + ".json");
  if (!wanted("png") && !oneFile) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = Math.round(vb.width * scale); c.height = 1000;
    c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob(blob => give(blob, name + ".png"));
  };
  img.onerror = () => saved.append(" (the .png couldn't be drawn)");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
});
// LOAD: a saved .json (or a bare state object); anything it lacks keeps
// its default, so friends saved before a feature existed still load.
document.getElementById("load").addEventListener("click", () => document.getElementById("load-file").click());
document.getElementById("load-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const saved = data && data.state ? data.state : data;
    if (!saved || typeof saved !== "object") throw new Error("no settings in this file");
    const next = clone(DEFAULTS);
    for (const k of Object.keys(DEFAULTS)) next[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
    upgradeHands(next.hands);
    upgradeRightHand(next, saved);
    upgradeFeet(next, saved);
    upgradeInside(next.background, saved);
    upgradeFace(next.face, saved.face);
    next.music = { ...next.music, volume: state.music.volume, mute: state.music.mute };
    state = next;
    changed();
  } catch (err) {
    alert("That file didn't load: " + err.message);
  }
});

// ===================== DRAG THE MOUTH AND BROW =====================
// As in Kids' Choice: a press above the eyes grabs the brow, below them
// the mouth, and dragging down raises the value: a smile, or a glower.

let drag = null;
const pic = document.getElementById("pic");
// the pointer in the picture's units, then in the figure's (undoing its
// size and place in a scene), then in the face's
const picUnits = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(pic.getScreenCTM().inverse());
function faceUnits(e) {
  const p = picUnits(e), T = figureT;
  const x = (p.x - T.dx) / T.k, y = (p.y - T.dy - T.sg) / T.k + T.g;
  return [(x - faceFrame.tx) / faceFrame.s, (y - faceFrame.ty) / faceFrame.s];
}
// in a scene, a press on the figure (not its face) picks it up
const onFigure = e => {
  if (state.background.kind === "none") return false;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  return !!(t && t.closest && t.closest("#figure"));
};
const onFace = e => {
  const [x, y] = faceUnits(e);
  return (x - 100) ** 2 + (y - 110) ** 2 <= 90 ** 2;
};
// On a touch screen the picture pinches and pans like the rest of the
// page; only a one-finger touch that starts on the face is kept for the
// drag (the page used to opt the whole picture out of zooming). A second
// finger lets go of the face, so a pinch goes to the browser.
// in a scene, a press on a thing that moves (data-drag: the witch) picks it up
const onThing = e => {
  const t = document.elementFromPoint(e.clientX, e.clientY);
  return t && t.closest ? t.closest("#bg [data-drag]") : null;
};
pic.addEventListener("touchstart", e => {
  if (e.touches.length === 1 && (onFace(e.touches[0]) || onFigure(e.touches[0]) || onThing(e.touches[0]))) e.preventDefault();
  else drag = null;
}, { passive: false });
pic.addEventListener("touchmove", e => {
  if (drag && e.touches.length === 1) e.preventDefault();
}, { passive: false });
pic.addEventListener("pointerdown", e => {
  if (!e.isPrimary) return;
  const thing = onThing(e);
  if (thing && !onFigure(e)) {
    const p = picUnits(e), B = state.background, name = thing.dataset.drag;
    drag = { thing: name, x0: B[name + "X"] ?? 0, y0: B[name + "Y"] ?? 0, px: p.x, py: p.y };
    pic.setPointerCapture(e.pointerId);
    return;
  }
  if (!onFace(e)) {
    if (!onFigure(e)) return;
    const p = picUnits(e);
    drag = { figure: true, x0: state.background.figX ?? 0, y0: state.background.figY ?? 0, px: p.x, py: p.y };
    pic.setPointerCapture(e.pointerId);
    return;
  }
  const [x, y] = faceUnits(e);
  const feature = y < faceLayout(state.face).eyeY - 12 - browLift(state.face) ? "brow" : "smile";
  drag = { feature, v0: state.face[feature], y0: e.clientY };
  pic.setPointerCapture(e.pointerId);
});
// One step per screen pixel, however big the picture is drawn.
pic.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.thing) {
    // kept in the scene, as the figure is
    const p = picUnits(e), F = sceneFrame, B = state.background;
    B[drag.thing + "X"] = Math.round(clamp(drag.x0 + p.x - drag.px, F.left, F.right));
    B[drag.thing + "Y"] = Math.round(clamp(drag.y0 + p.y - drag.py, (F.top - F.ground) * 0.6, F.bottom - F.ground));
    changed();
    return;
  }
  if (drag.figure) {
    // kept in the scene: its feet within the frame, from the frame's top
    // half down to just below the ground
    const p = picUnits(e), F = sceneFrame;
    state.background.figX = Math.round(clamp(drag.x0 + p.x - drag.px, F.left, F.right));
    state.background.figY = Math.round(clamp(drag.y0 + p.y - drag.py, (F.top - F.ground) * 0.6, F.bottom - F.ground));
    changed();
    return;
  }
  state.face[drag.feature] = clamp(Math.round(drag.v0 + (e.clientY - drag.y0)), -100, 200);
  changed();
});
const letGo = () => { drag = null; };
pic.addEventListener("pointerup", letGo);
pic.addEventListener("pointercancel", letGo);

// Through a doorway (a picture, a window, a tree house, a door: .portal in
// the scene) into its scene: the friend flies to it, shrinking to fit it
// and spinning, slowly and then fast, and lands in the new scene where a
// friend starts, at the size they had.
let entering = false;
pic.addEventListener("click", e => {
  const door = !entering && e.target.closest && e.target.closest("#bg .portal");
  if (door) enterScene(door);
});
// a nested <svg>'s own box on the screen, from its x, y, width and height
function svgBox(el) {
  const m = el.parentNode.getScreenCTM(), g = k => el[k].baseVal.value;
  const p = new DOMPoint(g("x"), g("y")).matrixTransform(m), q = new DOMPoint(g("x") + g("width"), g("y") + g("height")).matrixTransform(m);
  return { x: Math.min(p.x, q.x), y: Math.min(p.y, q.y), width: Math.abs(q.x - p.x), height: Math.abs(q.y - p.y) };
}
// The friend flies into a box on the screen (a doorway, or the back chip),
// shrinking to fit it and spinning, slowly and then fast; then the scene
// changes (arrive) and they land, spinning out, at their own size.
function flyInto(box, arrive) {
  const fig = document.getElementById("figure");
  if (!fig) return;
  entering = true;
  const NS = "http://www.w3.org/2000/svg", inv = pic.getScreenCTM().inverse();
  const at = r => new DOMPoint(r.x + r.width / 2, r.y + r.height / 2).matrixTransform(inv);
  const fr = fig.getBoundingClientRect(), f0 = at(fr), d0 = at(box);
  const s = Math.min(box.width / fr.width, box.height / fr.height) * 0.75, dx = d0.x - f0.x, dy = d0.y - f0.y;
  // (in a group of its own, so the figure keeps its own transform)
  const wrap = document.createElementNS(NS, "g");
  fig.replaceWith(wrap);
  wrap.append(fig);
  wrap.style.transformBox = "fill-box";
  wrap.style.transformOrigin = "center";
  const step = (u, turn, k, o = 1) => ({ transform: `translate(${f1(dx * u)}px, ${f1(dy * u)}px) rotate(${turn}deg) scale(${+k.toFixed(3)})`, opacity: o });
  const fly = wrap.animate([step(0, 0, 1), step(0.2, 45, 1 - (1 - s) * 0.2), step(0.55, 240, 1 - (1 - s) * 0.6),
                            step(0.85, 720, 1 - (1 - s) * 0.9), step(1, 1260, s), step(1, 1620, s * 0.2, 0)],
                           { duration: 2000, easing: "ease-in", fill: "forwards" });
  fly.onfinish = () => {
    arrive();
    entering = false;
    changed();
    // landing: a quick spin out, slowing, to the friend's own size
    const there = document.getElementById("figure");
    if (!there) return;
    const land = document.createElementNS(NS, "g");
    there.replaceWith(land);
    land.append(there);
    land.style.transformBox = "fill-box";
    land.style.transformOrigin = "center bottom";
    land.animate([{ transform: "rotate(-360deg) scale(0.2)", opacity: 0 }, { transform: "rotate(0deg) scale(1)", opacity: 1 }],
                 { duration: 600, easing: "ease-out" });
  };
}
// Where each trip through a doorway began, the last on top: the back chip
// goes back through them, one at a time, while the friend is in the scene
// the last trip went to.
const trips = [];
function enterScene(door) {
  const to = door.dataset.to, house = door.dataset.house, B = state.background;
  if (!SCENES[to] && !PICTURE_CHOICES.some(([kd]) => kd === to)) return;
  // (a picture's own box: the scene inside it spills past it, hidden)
  const view = door.querySelector(":scope > svg");
  const from = { kind: B.kind, inside: B.inside, figX: B.figX ?? 0, figY: B.figY ?? 0, to };
  flyInto(view ? svgBox(view) : door.getBoundingClientRect(), () => {
    trips.push(from);
    Object.assign(B, { kind: to, figX: 0, figY: 0 });
    if (house) B.inside = +house;
  });
}
const backBtn = document.getElementById("back");
const sceneName = kd => (TABS.find(t => t[1] === "background")[2][0][3].find(([v]) => v === kd) || [kd, kd])[1];
function backSync() {
  const last = trips[trips.length - 1], show = !!last && last.to === state.background.kind;
  backBtn.hidden = !show;
  if (show) {
    const name = sceneName(last.kind);
    backBtn.textContent = `⬅️ ${name.split(" ")[0]} back`;
    backBtn.title = "back to the " + name.replace(/^\S+\s/, "");
    backBtn.setAttribute("aria-label", backBtn.title);
  }
}
backBtn.addEventListener("click", () => {
  const last = trips[trips.length - 1];
  if (entering || !last) return;
  flyInto(backBtn.getBoundingClientRect(), () => {
    trips.pop();
    Object.assign(state.background, { kind: last.kind, figX: last.figX, figY: last.figY });
    if (last.inside) state.background.inside = last.inside;
  });
});

showTab();
</script>
