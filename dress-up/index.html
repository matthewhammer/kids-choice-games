// Pinning a slider puts it in the full-screen controls (the HUD); the
// pins are part of the friend, saved and loaded with it.
const pinned = id => (state.hud.pins || []).includes(id);
function togglePin(id) {
  const pins = state.hud.pins || [];
  state.hud.pins = pinned(id) ? pins.filter(x => x !== id) : [...pins, id];
  changed(); renderHud();
}
// (while the HUD is built: its sliders have no pins -- pinning is for
// the editor, not the performance)
let buildingHud = false;
function control(part, [kind, key, label, ...rest]) {
  const val = el("span", { class: "val" });
  const name = el("span", { class: "name" }, [label]);
  const lbl = el("div", { class: "lbl" }, [el("span", {}, [name]), val]);
  const box = el("div", { class: "ctl" }, [lbl]);
  if ((kind === "range" || kind === "turn") && part !== "background" && !buildingHud) {
    // the pin, left of the name (the scene's own sliders are always in the
    // HUD: no pin)
    const id = part + "." + key, pin = el("button", { class: "pin", title: "Pin to the full-screen controls",
                                                       onclick: () => togglePin(id) }, "📌");
    name.before(pin);
    syncs.push(() => pin.setAttribute("aria-pressed", pinned(id)));
  }
  if (kind === "action") {
    const b = el("button", { onclick: () => { rest[0](); changed(); } }, label);
    lbl.replaceChildren();
    box.append(b);
  }
  if (kind === "range") {
    const [lo, hi] = rest;
    const input = el("input", { type: "range", min: lo, max: hi,
                                oninput: e => set(part, key, Number(e.target.value)) });
    box.append(input);
    syncs.push(() => { input.value = state[part][key]; val.textContent = state[part][key]; });
  } else if (kind === "turn") {
    // an angle in radians, from 0 to a period that the other settings
    // decide (a star's turn to its next point), in hundredths shown; past
    // the period (fewer points made it shorter) it shows, as it draws,
    // the same turn within the period
    const period = () => rest[0](state[part]);
    const input = el("input", { type: "range", min: 0, step: "any",
                                oninput: e => set(part, key, Number(e.target.value)) });
    box.append(input);
    syncs.push(() => {
      const p = period(), v = state[part][key] ?? 0, w = v > p ? v % p : v;
      input.max = p; input.value = w; val.textContent = w.toFixed(2);
    });
  } else if (kind === "toggle") {
    const b = el("button", { onclick: () => set(part, key, !state[part][key]) });
    box.querySelector(".lbl").textContent = "";
    box.append(b);
    syncs.push(() => { b.textContent = label + (state[part][key] ? ": on" : ": off");
                       b.setAttribute("aria-pressed", state[part][key]); });
  } else if (kind === "choice") {
    const row = el("div", { class: "row" });
    const bs = rest[0].map(([v, text]) => {
      const b = el("button", { onclick: () => set(part, key, v) }, text);
      row.append(b); return [v, b];
    });
    box.append(row);
    syncs.push(() => { for (const [v, b] of bs) b.setAttribute("aria-pressed", state[part][key] === v); });
  } else if (kind === "color") {
    const row = el("div", { class: "row" });
    const bs = rest[0].map(c => {
      const b = c === "skin" || c === "auto" || c === "off"
        ? el("button", { class: "swatch skin",
                         title: c === "skin" ? "same as skin" : c === "off" ? "none: the fur shows through"
                              : key === "spot" ? "a warm brown" : "a lighter shade",
                         onclick: () => set(part, key, c) }, c)
        : key === "color" && part === "face" && SKIN_MARKS[c]
        ? el("button", { class: "swatch", title: SKIN_MARKS[c][1], "aria-label": SKIN_MARKS[c][1],
                         style: `background:${c};font-size:18px;line-height:1`, onclick: () => set(part, key, c) }, SKIN_MARKS[c][0])
        : el("button", { class: "swatch", title: c, style: `background:${c}`, onclick: () => set(part, key, c) });
      row.append(b); return [c, b];
    });
    const pick = el("input", { type: "color", title: "any color",
                               oninput: e => set(part, key, e.target.value) });
    row.append(pick);
    box.append(row);
    syncs.push(() => {
      for (const [c, b] of bs) b.setAttribute("aria-pressed", state[part][key] === c);
      if (state[part][key].startsWith("#")) pick.value = state[part][key];
    });
  } else if (kind === "pad") {
    // A square to tap or drag: the sun marks where the light comes from,
    // and the shine sits on that side of each eye.
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "-1.2 -1.2 2.4 2.4");
    svg.setAttribute("class", "pad");
    svg.innerHTML = `<rect x="-1.2" y="-1.2" width="2.4" height="2.4" rx="0.2" fill="#87ceeb"/>` +
      `<circle r="0.45" fill="#f5c542" stroke="#333" stroke-width="0.04"/>` +
      `<circle cx="-0.15" cy="-0.08" r="0.07"/><circle cx="0.15" cy="-0.08" r="0.07"/>` +
      `<g id="sun"><circle r="0.16" fill="#fff59d" stroke="#f59e0b" stroke-width="0.05"/></g>`;
    const sun = svg.querySelector("#sun");
    const at = e => {
      const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
      const c = v => Math.round(Math.max(-1, Math.min(1, v)) * 100) / 100;
      state[part].lightX = c(p.x); state[part].lightY = c(p.y); changed();
    };
    let held = false;
    svg.addEventListener("pointerdown", e => { held = true; svg.setPointerCapture(e.pointerId); at(e); });
    svg.addEventListener("pointermove", e => { if (held) at(e); });
    svg.addEventListener("pointerup", () => { held = false; });
    svg.addEventListener("pointercancel", () => { held = false; });
    box.append(svg);
    syncs.push(() => sun.setAttribute("transform", `translate(${state[part].lightX} ${state[part].lightY})`));
  }
  const when = SHOWN_WHEN[part + "." + key];
  if (when) syncs.push(() => { box.hidden = !when(state[part]); });
  return box;
}

function showTab() {
  syncs = [];
  const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");
  tabs.replaceChildren(...TABS.map(([name], i) =>
    el("button", { "aria-pressed": i === tab, onclick: () => { tab = i; showTab(); } }, name)));
  const [, part, ctls] = TABS[tab];
  panel.replaceChildren(...ctls.map(c => control(part, c)));
  changed();
}

// ===================== FULL SCREEN =====================
// The picture fills the window, the controls hidden -- and the screen too,
// where the browser allows it (not an iPhone's); an X, Escape, or leaving
// the browser's full screen brings the controls back.
const maxBtn = document.getElementById("max");
function setBig(on) {
  document.body.classList.toggle("big", on);
  if (!on) setHud(false);
  maxBtn.textContent = on ? "✕" : "⤢";
  maxBtn.title = on ? "Back to the controls" : "Full screen";
  maxBtn.setAttribute("aria-label", maxBtn.title);
  try {
    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement)
      document.documentElement.requestFullscreen().catch(() => {});
    else if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) { /* the window-filling picture is enough */ }
}
maxBtn.addEventListener("click", () => setBig(!document.body.classList.contains("big")));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("big")) setBig(false);
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && document.body.classList.contains("big")) setBig(false);
});

// ===================== THE HEADS-UP DISPLAY =====================
// In full screen, a strip of controls along the bottom, hidden until its
// button is pressed: a scene's own controls (the figure's size; drag the
// figure to move it), then every pinned slider, made by control() as in
// the panel, with their own refreshes.
const hud = document.getElementById("hud"), hudBtn = document.getElementById("hud-btn");
const hudKey = () => JSON.stringify(state.hud.pins || []) + (state.background.kind !== "none");
let hudShown = "";
function renderHud() {
  if (hud.hidden) return;
  hudShown = hudKey();
  const saved = syncs;
  syncs = [];
  buildingHud = true;
  const boxes = [];
  if (state.background.kind !== "none")
    for (const spec of TABS.find(t => t[1] === "background")[2].filter(c => c[1] !== "kind")) boxes.push(control("background", spec));
  for (const id of state.hud.pins || []) {
    const [part, key] = id.split("."), tabEntry = TABS.find(t => t[1] === part);
    const spec = tabEntry && tabEntry[2].find(c => c[1] === key);
    if (spec) boxes.push(control(part, spec));
  }
  if (!boxes.length)
    boxes.push(el("div", { class: "empty" }, "Pin sliders with 📌 in the controls, and they show up here."));
  buildingHud = false;
  hud.replaceChildren(...boxes);
  hudSyncs = syncs;
  syncs = saved;
  for (const f of hudSyncs) f();
}
function setHud(on) {
  hud.hidden = !on;
  hudBtn.setAttribute("aria-pressed", on);
  if (on) renderHud(); else { hud.replaceChildren(); hudSyncs = []; }
}
hudBtn.addEventListener("click", () => setHud(hud.hidden));

// ===================== SURPRISE, SAVE, START OVER =====================

const pick = xs => xs[Math.floor(Math.random() * xs.length)];
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
document.getElementById("surprise").addEventListener("click", () => {
  for (const [, part, ctls] of TABS)
    for (const [kind, key, , ...rest] of ctls) {
      if (kind === "range") state[part][key] = rnd(rest[2] ?? rest[0], rest[3] ?? rest[1]);
      // (a star turned any way still looks like a star; other hands keep
      // their usual angle most times)
      else if (kind === "turn")
        state[part][key] = key === "starAngle" || Math.random() < 0.25 ? Math.random() * rest[0](state[part]) : 0;
      else if (kind === "toggle") state[part][key] = Math.random() < 0.3;
      // (the hand on the left mostly matches the other one)
      else if (kind === "choice")
        state[part][key] = key === "leftStyle" && Math.random() < 0.75 ? "same" : pick(rest[0])[0];
      else if (kind === "color") state[part][key] = pick(rest[0]);
    }
  // keep the surprises friendly: mostly not sick, not exploded, a normal-ish head
  const F = state.face;
  if (Math.random() < 0.75) F.sick = 0;
  if (Math.random() < 0.6) { F.burst = 0; F.rays = 0; }
  // irises about 4 times in 10, and eye whites around about half of those
  F.iris = Math.random() < 0.4 ? rnd(15, 60) : 0;
  F.whites = F.iris > 0 && Math.random() < 0.5 ? rnd(10, 60) : 0;
  // now and then, an alien: a pointed head and slanted almond eyes
  const alien = Math.random() < 0.15;
  F.alien = alien ? rnd(50, 100) : 0;
  F.tilt = alien ? rnd(15, 35) : 0;
  if (alien) F.oval = rnd(45, 75);
  // and on their own, a somewhat alien head about 1 time in 5, and
  // slanted eyes, up or down, about 1 time in 4
  if (!alien && Math.random() < 0.2) F.alien = rnd(15, 70);
  if (!alien && Math.random() < 0.25) F.tilt = rnd(-20, 35);
  // swimwear now and then (about 1 time in 10), its top to suit its style
  state.undies.on = Math.random() < 0.1;
  state.undies.top = state.undies.style === "bikini" || (state.undies.style !== "onepiece" && Math.random() < 0.2);
  // a costume about 1 time in 4, in its natural colors
  state.costume.kind = Math.random() < 0.25 ? pick(Object.keys(ANIMALS)) : "none";
  if (ANIMALS[state.costume.kind]) Object.assign(state.costume, lookOf(state.costume.kind));
  changed();
});
document.getElementById("reset").addEventListener("click", () => { state = clone(DEFAULTS); changed(); });
// SAVE: up to three files with one name, stamped with the local date and time
// so each save is new: my-friend-2026-10-10-16-29-05.png, .svg and .json.
// The picture as it is drawn (.png), the drawing itself, which Firefox
// opens and which prints sharp at any size (.svg), and the settings, which
// Load brings back (.json).
function download(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
// which files Save writes: all three to start with; unchecking one is
// remembered on this device
const formatBoxes = [...document.querySelectorAll("#formats input")];
// Tablets and phones save one file per tap: an iPad kept only the last of
// three downloads (the .png). There Save writes ONE file, chosen with
// radio buttons (the settings, to load again, unless changed), and the
// other two are a tap away in the links under the buttons. (iPadOS's
// Safari says it is a Mac; its touch points give it away.)
const oneFile = /iPad|iPhone|iPod|Android/.test(navigator.userAgent) ||
                (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
if (oneFile) {
  document.getElementById("formats-label").textContent = "save (one file per tap here):";
  let chosen = "json";
  try { chosen = localStorage.getItem("dress-up-save-one") || "json"; } catch (_) {}
  for (const b of formatBoxes) {
    b.type = "radio"; b.name = "save-format"; b.checked = b.value === chosen;
    b.addEventListener("change", () => {
      try { localStorage.setItem("dress-up-save-one", b.value); } catch (_) {}
    });
  }
} else {
  try {
    const off = JSON.parse(localStorage.getItem("dress-up-save-off") || "[]");
    for (const b of formatBoxes) b.checked = !off.includes(b.value);
  } catch (_) {}
  for (const b of formatBoxes) b.addEventListener("change", () => {
    try { localStorage.setItem("dress-up-save-off", JSON.stringify(formatBoxes.filter(x => !x.checked).map(x => x.value))); } catch (_) {}
  });
}
const wanted = f => formatBoxes.some(b => b.value === f && b.checked);
// Several downloads from one click: some browsers let only the first
// through, ask first ("allow multiple downloads?"), or drop ones that
// start after the click has finished (the .png is drawn first). So the
// .svg and .json start during the click, the .png right after, and each
// file also gets a link under the buttons: a click on a link always works.
document.getElementById("save").addEventListener("click", () => {
  if (!formatBoxes.some(b => b.checked)) { alert("Check at least one kind of file to save."); return; }
  const d = new Date(), two = n => String(n).padStart(2, "0");
  const name = `my-friend-${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}-` +
               `${two(d.getHours())}-${two(d.getMinutes())}-${two(d.getSeconds())}`;
  const pic = document.getElementById("pic");
  const vb = pic.viewBox.baseVal, scale = 1000 / vb.height;
  // a standalone copy at its own size; both the .svg and the .png keep a
  // transparent background
  const copy = pic.cloneNode(true);
  copy.setAttribute("width", Math.round(vb.width * scale));
  copy.setAttribute("height", 1000);
  const svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
  const saved = document.getElementById("saved");
  saved.replaceChildren("Saved:");
  const files = [];
  // each file: saved now if it is wanted, and a link either way when only
  // one file can be saved per tap (so the others are one tap away)
  const give = (blob, file) => {
    const kind = file.split(".").pop();
    if (wanted(kind)) download(blob, file);
    else if (!oneFile) return;
    const a = el("a", { href: URL.createObjectURL(blob), download: file, title: "save " + file }, kind);
    files.push([kind, a]);
    const order = ["json", "png", "svg"];
    const links = files.slice().sort((x, y) => order.indexOf(x[0]) - order.indexOf(y[0])).map(x => x[1]);
    saved.replaceChildren(...(oneFile
      ? ["Saved the ." + formatBoxes.find(b => b.checked).value + " — tap to save: ",
         ...links.flatMap((x, k) => k ? [" · ", x] : [x])]
      : ["Saved ", ...links.flatMap((x, k) => k ? [" · ", x] : [x]), " — not in your downloads? click each one."]));
  };
  if (wanted("svg") || oneFile) give(new Blob([svgText], { type: "image/svg+xml" }), name + ".svg");
  if (wanted("json") || oneFile)
    give(new Blob([JSON.stringify({ app: "dress-up", version: 1, saved: d.toISOString(), state }, null, 2)],
                  { type: "application/json" }), name + ".json");
  if (!wanted("png") && !oneFile) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = Math.round(vb.width * scale); c.height = 1000;
    c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob(blob => give(blob, name + ".png"));
  };
  img.onerror = () => saved.append(" (the .png couldn't be drawn)");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
});
// LOAD: a saved .json (or a bare state object); anything it lacks keeps
// its default, so friends saved before a feature existed still load.
document.getElementById("load").addEventListener("click", () => document.getElementById("load-file").click());
document.getElementById("load-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const saved = data && data.state ? data.state : data;
    if (!saved || typeof saved !== "object") throw new Error("no settings in this file");
    const next = clone(DEFAULTS);
    for (const k of Object.keys(DEFAULTS)) next[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
    upgradeHands(next.hands);
    upgradeFace(next.face, saved.face);
    state = next;
    changed();
  } catch (err) {
    alert("That file didn't load: " + err.message);
  }
});

// ===================== DRAG THE MOUTH AND BROW =====================
// As in Kids' Choice: a press above the eyes grabs the brow, below them
// the mouth, and dragging down raises the value: a smile, or a glower.

let drag = null;
const pic = document.getElementById("pic");
// the pointer in the picture's units, then in the figure's (undoing its
// size and place in a scene), then in the face's
const picUnits = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(pic.getScreenCTM().inverse());
function faceUnits(e) {
  const p = picUnits(e), T = figureT;
  const x = (p.x - T.dx) / T.k, y = (p.y - T.dy - T.g) / T.k + T.g;
  return [(x - faceFrame.tx) / faceFrame.s, (y - faceFrame.ty) / faceFrame.s];
}
// in a scene, a press on the figure (not its face) picks it up
const onFigure = e => {
  if (state.background.kind === "none") return false;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  return !!(t && t.closest && t.closest("#figure"));
};
const onFace = e => {
  const [x, y] = faceUnits(e);
  return (x - 100) ** 2 + (y - 110) ** 2 <= 90 ** 2;
};
// On a touch screen the picture pinches and pans like the rest of the
// page; only a one-finger touch that starts on the face is kept for the
// drag (the page used to opt the whole picture out of zooming). A second
// finger lets go of the face, so a pinch goes to the browser.
pic.addEventListener("touchstart", e => {
  if (e.touches.length === 1 && (onFace(e.touches[0]) || onFigure(e.touches[0]))) e.preventDefault();
  else drag = null;
}, { passive: false });
pic.addEventListener("touchmove", e => {
  if (drag && e.touches.length === 1) e.preventDefault();
}, { passive: false });
pic.addEventListener("pointerdown", e => {
  if (!e.isPrimary) return;
  if (!onFace(e)) {
    if (!onFigure(e)) return;
    const p = picUnits(e);
    drag = { figure: true, x0: state.background.figX ?? 0, y0: state.background.figY ?? 0, px: p.x, py: p.y };
    pic.setPointerCapture(e.pointerId);
    return;
  }
  const [x, y] = faceUnits(e);
  const feature = y < faceLayout(state.face).eyeY - 12 - browLift(state.face) ? "brow" : "smile";
  drag = { feature, v0: state.face[feature], y0: e.clientY };
  pic.setPointerCapture(e.pointerId);
});
// One step per screen pixel, however big the picture is drawn.
pic.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.figure) {
    // kept in the scene: its feet within the frame, from the frame's top
    // half down to just below the ground
    const p = picUnits(e), F = sceneFrame;
    state.background.figX = Math.round(clamp(drag.x0 + p.x - drag.px, F.left, F.right));
    state.background.figY = Math.round(clamp(drag.y0 + p.y - drag.py, (F.top - F.ground) * 0.6, F.bottom - F.ground));
    changed();
    return;
  }
  state.face[drag.feature] = clamp(Math.round(drag.v0 + (e.clientY - drag.y0)), -100, 200);
  changed();
});
const letGo = () => { drag = null; };
pic.addEventListener("pointerup", letGo);
pic.addEventListener("pointercancel", letGo);

showTab();
</script>
</body>
</html>
