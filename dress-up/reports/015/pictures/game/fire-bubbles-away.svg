.fi-tail, .fi-bub-flame { animation: fi-tail 0.1s linear infinite alternate; }
.fi-bub-flame { animation-duration: 0.15s; }
.fi-a-bub { animation: fi-a-bub 2.4s linear infinite; }
.fi-a-bubpop { animation: fi-a-bubpop 2.4s linear infinite; }
