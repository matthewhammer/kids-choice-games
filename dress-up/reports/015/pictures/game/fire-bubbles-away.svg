<svg width="460" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="-230 -440 460 500" role="img" aria-label="The game at 0.0.392: fire bubbles, away from us"><style>.fi-heat { animation: fi-shimmer 0.6s linear infinite; }
