<svg width="520" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="-260 -260 520 520" role="img" aria-label="The game at 0.0.392: brick fire, toward us"><style>.fi-heat { animation: fi-shimmer 0.6s linear infinite; }
