<svg width="460" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="-230 -440 460 500" role="img" aria-label="The game at 0.0.392: fireballs, away from us"><style>.fi-heat { animation: fi-shimmer 0.6s linear infinite; }
.fi-glow { animation: fi-flicker 0.13s ease-in-out infinite alternate; }
.fi-tail, .fi-bub-flame { animation: fi-tail 0.1s linear infinite alternate; }
.fi-a-ball { animation: fi-a-ball 1.5s linear infinite; }
.fi-a-burst { animation: fi-a-burst 1.5s linear infinite; }
@keyframes fi-shimmer { to { stroke-dashoffset: -22; } }
@keyframes fi-flicker { from { transform: scale(0.88); opacity: 0.75; } to { transform: scale(1.15); opacity: 1; } }
@keyframes fi-tail { from { transform: scale(0.85, 0.9); } to { transform: scale(1.12, 1.05); } }
@keyframes fi-a-ball { 0% { transform: translate(0, 20px) scale(1.4); opacity: 0; } 8% { opacity: 1; } 30% { transform: translate(0, -120px) scale(0.75); }
  55% { transform: translate(0, -205px) scale(0.5); } 80% { transform: translate(0, -250px) scale(0.38); opacity: 1; }
  88% { transform: translate(0, -262px) scale(0.32); opacity: 0; } 100% { transform: translate(0, -262px) scale(0.32); opacity: 0; } }
